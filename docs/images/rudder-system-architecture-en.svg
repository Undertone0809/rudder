<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Rudder connects a complete Agent work loop</title>
  <desc id="desc">An organization is the boundary. A goal gives work direction, Chat or an Issue carries the request, an Agent starts one Agent Run through a runtime, people review the output and evidence, and approved learning improves future runs.</desc>
  <defs>
    <pattern id="paper-lines" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 63.5H64" stroke="#6a9bcc" stroke-opacity="0.065"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#141413"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#788c5d"/></marker>
    <style>
      .serif{font-family:"Lora",Georgia,"Noto Serif SC",serif;fill:#141413}
      .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;fill:#5b5851;letter-spacing:1.3px}
      .head{font-family:"Lora",Georgia,"Noto Serif SC",serif;fill:#141413;font-size:25px;font-weight:700}
      .body{font-family:"Lora",Georgia,"Noto Serif SC",serif;fill:#4e4b44;font-size:19px}
      .edge{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;fill:#6b685f;font-size:13px;letter-spacing:.7px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#faf9f5"/><rect width="1600" height="900" fill="url(#paper-lines)"/>
  <text x="80" y="144" class="serif" font-size="49" font-weight="700">One organization connects a complete Agent work loop</text>
  <text x="80" y="187" class="serif" font-size="21" fill="#5d5a52">A traceable relationship: why work exists, where it moves, who runs it, what remains, and who decides.</text>

  <rect x="82" y="234" width="1436" height="566" fill="none" stroke="#141413" stroke-width="2"/>
  <rect x="82" y="234" width="230" height="44" fill="#141413"/>
  <text x="104" y="263" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace" fill="#faf9f5" font-size="14" letter-spacing="1.4">ORGANIZATION BOUNDARY</text>

  <g transform="translate(128 360)">
    <rect width="210" height="150" fill="#d97757"/>
    <text x="24" y="49" class="head">Goal</text><text x="24" y="83" class="body">Explains why</text>
    <text x="24" y="123" class="edge">GOAL</text>
  </g>
  <path d="M338 435H410" stroke="#141413" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="418" class="edge">TRACES TO</text>

  <g transform="translate(430 334)">
    <rect width="244" height="202" fill="#faf9f5" stroke="#141413" stroke-width="2"/>
    <rect width="244" height="14" fill="#6a9bcc"/>
    <text x="24" y="65" class="head">Chat or Issue</text><text x="24" y="101" class="body">Request + context</text><text x="24" y="136" class="body">Structure as needed</text>
    <text x="24" y="176" class="edge">WORK SURFACE</text>
  </g>
  <path d="M674 435H746" stroke="#141413" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="688" y="418" class="edge">ROUTES TO</text>

  <g transform="translate(766 334)">
    <rect width="210" height="202" fill="#faf9f5" stroke="#141413" stroke-width="2"/>
    <rect width="210" height="14" fill="#788c5d"/>
    <text x="24" y="65" class="head">Agent</text><text x="24" y="101" class="body">Durable role</text><text x="24" y="136" class="body">Skills, rules, budget</text>
    <text x="24" y="176" class="edge">REUSABLE TEAMMATE</text>
  </g>
  <path d="M976 435H1048" stroke="#141413" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="989" y="418" class="edge">STARTS</text>

  <g transform="translate(1068 334)">
    <rect width="244" height="202" fill="#6a9bcc"/>
    <text x="24" y="65" class="head">Agent Run</text><text x="24" y="101" class="body">Invokes a runtime</text><text x="24" y="136" class="body">One attempt + record</text>
    <text x="24" y="176" class="edge" fill="#333">CODEX · CLAUDE · HTTP</text>
  </g>

  <path d="M1190 536V594" stroke="#141413" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1208" y="570" class="edge">PRODUCES</text>
  <g transform="translate(1030 614)">
    <rect width="320" height="118" fill="#faf9f5" stroke="#141413" stroke-width="2"/>
    <text x="24" y="48" class="head">Output + evidence</text><text x="24" y="82" class="body">Files · answers · links</text><text x="24" y="106" class="body">Usage · errors</text>
  </g>

  <path d="M1030 673H910" stroke="#141413" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="932" y="656" class="edge">REVIEW</text>
  <g transform="translate(644 614)">
    <rect width="246" height="118" fill="#d97757"/>
    <text x="24" y="48" class="head">People decide</text><text x="24" y="82" class="body">Accept · revise</text><text x="24" y="106" class="body">Block · continue</text>
  </g>

  <path d="M644 673H524" stroke="#788c5d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="546" y="656" class="edge" fill="#788c5d">IF APPROVED</text>
  <g transform="translate(164 614)">
    <rect width="340" height="118" fill="#faf9f5" stroke="#788c5d" stroke-width="2"/>
    <text x="24" y="48" class="head">Approved learning</text><text x="24" y="82" class="body">Context · skill · decision</text><text x="24" y="106" class="body">Workflow</text>
  </g>

  <path d="M256 614C256 568 320 566 420 566H830C908 566 871 536 871 536" fill="none" stroke="#788c5d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="390" y="590" class="edge" fill="#788c5d">BETTER FUTURE RUNS</text>
</svg>
