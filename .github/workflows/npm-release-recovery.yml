name: Publish npm recovery

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Full immutable source SHA to publish"
        required: true
        type: string
      version:
        description: "Stable package version expected at the source SHA"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stable-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish exact npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-stable
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Require immutable source and version
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(node -p "require('./cli/package.json').version")" = "$RELEASE_VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Build publish payloads
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          bash scripts/prepare-server-ui-dist.sh
          for pkg_dir in \
            server \
            packages/agent-runtimes/claude-local \
            packages/agent-runtimes/codex-local \
            packages/agent-runtimes/cursor-local \
            packages/agent-runtimes/gemini-local \
            packages/agent-runtimes/opencode-local; do
            rm -rf "$pkg_dir/skills"
            cp -R server/resources/bundled-skills "$pkg_dir/skills"
          done
          node scripts/release-package-map.mjs set-publish-version "$RELEASE_VERSION" --allow-source-mutation
          ./scripts/build-npm.sh --skip-checks --skip-typecheck

      - name: Pack and publish missing stable packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p dist/npm-payloads
          package_map="$(mktemp)"
          node scripts/release-package-map.mjs list > "$package_map"
          test "$(wc -l < "$package_map" | xargs)" = "15"
          while IFS=$'\t' read -r pkg_dir pkg_name pkg_version; do
            [ -n "$pkg_dir" ] || continue
            test "$pkg_version" = "$RELEASE_VERSION"
            pack_output="$(cd "$pkg_dir" && npm pack --json --pack-destination "$GITHUB_WORKSPACE/dist/npm-payloads" 2>&1)"
            filename="$(printf '%s\n' "$pack_output" | node scripts/parse-npm-pack-output.mjs)"
            digest="$(shasum -a 256 "dist/npm-payloads/$filename" | awk '{print $1}')"
            view_error="$(mktemp)"
            if published="$(npm view "$pkg_name@$pkg_version" version 2>"$view_error")"; then
              test "$published" = "$pkg_version"
              echo "Keeping existing $pkg_name@$pkg_version"
            elif grep -q "E404" "$view_error"; then
              echo "Publishing $pkg_name@$pkg_version ($filename, $digest)"
              npm publish "dist/npm-payloads/$filename" --tag latest --access public --provenance
            else
              cat "$view_error" >&2
              exit 1
            fi
            rm -f "$view_error"
          done < "$package_map"

      - name: Verify stable npm surfaces
        run: |
          . ./scripts/release-lib.sh
          package_map="$(mktemp)"
          awk -F '\t' '{ print ".\t" $2 "\t" $3 }' <(node scripts/release-package-map.mjs list) > "$package_map"
          wait_for_npm_package_versions "$(cat "$package_map")" 60 5
          while IFS=$'\t' read -r _ pkg_name pkg_version; do
            test "$(npm view "$pkg_name@$pkg_version" version)" = "$pkg_version"
            test "$(npm view "$pkg_name" dist-tags.latest)" = "$pkg_version"
          done < "$package_map"
