name: R6Z isolated native test kit

# Temporary artifact transport for PR 172. No deployment or writer authority.
# Remove after the offline environment has been recovered.
on:
  pull_request:
    paths:
      - .github/workflows/r6z-native-test-kit.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: r6z-native-test-kit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kit:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34997859870
          name: r6z-native-test-kit-3e8f300f52bbe41510d24321e9abf736d64f736c
          path: ${{ runner.temp }}/r6z-kit

      - name: Verify and split the exact public-source test kit
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/r6z-kit"
          test "$(cat "$kit/source-sha.txt")" = "3e8f300f52bbe41510d24321e9abf736d64f736c"
          (cd "$kit" && sha256sum --check SHA256SUMS)
          tar -C "$kit" -cf "$RUNNER_TEMP/r6z-kit.tar" .
          split --bytes=200M --numeric-suffixes=0 --suffix-length=2 "$RUNNER_TEMP/r6z-kit.tar" "$RUNNER_TEMP/r6z-kit.part-"
          test ! -f "$RUNNER_TEMP/r6z-kit.part-05"

      - uses: actions/upload-artifact@v7
        with:
          name: r6z-native-kit-part-00-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-kit.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: r6z-native-kit-part-01-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-kit.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: r6z-native-kit-part-02-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-kit.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: r6z-native-kit-part-03-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-kit.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: r6z-native-kit-part-04-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-kit.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
