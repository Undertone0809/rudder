name: Qualify D1 actor-status repair

on:
  pull_request:
    paths:
      - .github/workflows/r6z-qualify-actor-status.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin_dir="$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)"
          test -x "$bin_dir/initdb"
          echo "RUDDER_POSTGRES_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
      - name: Append only the reviewed adversarial regressions
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
            const base = 'dc88c9ff6006291641616e8f493b4c8857ce959d';
            const workflow = '.github/workflows/r6z-qualify-actor-status.yml';
            assert.equal(git('rev-parse','HEAD'),context.payload.pull_request.head.sha);
            assert.equal(git('rev-parse','HEAD^'),base);
            assert.equal(git('diff','--name-only',base,'HEAD'),workflow);
            const file = 'native/crates/d1-persistence/tests/postgres.rs';
            assert.equal(git('hash-object',file),'e1f7ab346b5d024d8f8ad27d4e18390806a0796d');
            const sha = 'cbc81fe24bb87ee78a9da4418075c92574d4478f';
            const {data} = await github.rest.git.getBlob({...context.repo,file_sha:sha});
            assert.equal(data.sha,sha);
            assert.equal(data.encoding,'base64');
            fs.appendFileSync(file,Buffer.from(data.content,'base64'));
      - name: Require inactive actor and stale replay regressions to fail first
        shell: bash
        run: |
          set +e
          cargo test --manifest-path native/Cargo.toml --locked -p rudder-d1-persistence --test postgres actor_status_ -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/status-red.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'test result: FAILED. 1 passed; 3 failed;' "$RUNNER_TEMP/status-red.log"
          grep -F 'actor_status_terminated_ceo_cannot_use_previously_authorized_commands ... FAILED' "$RUNNER_TEMP/status-red.log"
          grep -F 'actor_status_pending_approval_ceo_cannot_use_previously_authorized_commands ... FAILED' "$RUNNER_TEMP/status-red.log"
          grep -F 'actor_status_termination_blocks_original_receipt_replay ... FAILED' "$RUNNER_TEMP/status-red.log"
      - name: Recheck current Agent status under the authorization row lock
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const file = 'native/crates/d1-persistence/src/transaction.rs';
            assert.equal(execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),'5d2cdd49ac8af9d31d70aced1e5bcef1418b37fe');
            let text=fs.readFileSync(file,'utf8');
            const old = [
              '        let role: Option<String> = sqlx::query_scalar(',
              '            "SELECT role FROM agents WHERE id=$1::uuid AND org_id=$2::uuid FOR UPDATE",',
              '        )',
              '        .bind(&actor.principal_id)',
              '        .bind(&meta.org)',
              '        .fetch_optional(&mut **tx)',
              '        .await?;',
              '        if role.as_deref() != Some("ceo") {',
              '            return Err(StoreError::Unauthorized);',
              '        }'
            ].join('\n');
            const replacement = [
              '        let agent = sqlx::query(',
              '            "SELECT role,status FROM agents WHERE id=$1::uuid AND org_id=$2::uuid FOR UPDATE",',
              '        )',
              '        .bind(&actor.principal_id)',
              '        .bind(&meta.org)',
              '        .fetch_optional(&mut **tx)',
              '        .await?',
              '        .ok_or(StoreError::Unauthorized)?;',
              '        // Match Node authentication even when authorization preceded a status change.',
              '        // Pausing work does not revoke an otherwise valid Agent identity.',
              '        if agent.try_get::<String, _>("role")? != "ceo"',
              '            || matches!(',
              '                agent.try_get::<String, _>("status")?.as_str(),',
              '                "terminated" | "pending_approval"',
              '            )',
              '        {',
              '            return Err(StoreError::Unauthorized);',
              '        }'
            ].join('\n');
            assert.equal(text.split(old).length,2);
            fs.writeFileSync(file,text.replace(old,replacement));
      - name: Format the reviewed change and verify the locked native workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked --workspace -- --test-threads=1
      - name: Prepare the verified functional source tree
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
            const base = 'dc88c9ff6006291641616e8f493b4c8857ce959d';
            const workflow = '.github/workflows/r6z-qualify-actor-status.yml';
            const files = ['native/crates/d1-persistence/src/transaction.rs','native/crates/d1-persistence/tests/postgres.rs'];
            git('add','--',...files);
            git('rm','--cached','--',workflow);
            fs.unlinkSync(workflow);
            git('diff','--cached','--check');
            git('diff','--exit-code');
            assert.deepEqual(git('diff','--cached','--name-only',base).split('\n').sort(),files.sort());
            const elements=[];
            for (const file of files) {
              const {data} = await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
              assert.equal(data.sha,git('hash-object',file));
              elements.push({path:file,mode:'100644',type:'blob',sha:data.sha});
            }
            const {data:tree} = await github.rest.git.createTree({...context.repo,base_tree:'945aea64a51fa810fa29c8a0b076d0e838f0624f',tree:elements});
            assert.equal(tree.sha,git('write-tree'));
            core.info(`ACTOR_STATUS_TREE=${tree.sha}`);
            core.info(JSON.stringify(elements));
            core.info(git('diff','--cached',base,'--',...files));
            await core.summary.addHeading('D1 stale-authorization repair qualification').addRaw(`Tree: ${tree.sha}\n\nExpected pre-fix failures observed; full locked native fmt/Clippy/tests passed. No branch or writer was advanced.\n`).write();
