name: Publish exact validated R6Z batch

# Temporary transport for an offline coding checkout. Deletes itself in the first
# implementation commit. Never executes patched code with write credentials.
on:
  pull_request:
    paths:
      - .github/workflows/r6z-publish-validated-batch.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Publish only hash-verified, locally tested source trees
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, zlib

          def git(*args, **kwargs):
              return subprocess.check_output(["git", *args], **kwargs).decode().strip()

          base = "f8306754d25fbc5fa098980db196277e06c2e6b4"
          transport = os.environ["EXPECTED_HEAD"]
          branch = "codex/r6z-120-project-goal-link-core-luna-fast-20260914"
          workflow = ".github/workflows/r6z-publish-validated-batch.yml"
          assert git("rev-parse", "HEAD") == transport
          assert git("rev-parse", "HEAD^") == base
          assert git("diff", "--name-only", base, "HEAD") == workflow
          batches = json.loads(r'''[{"patch":"","sha256":"25dfac082e578ed457104d422bf9edc637c6b218f1510d81268315f46562fff1","tree":"6901709c0d64ab9f27be08e12f077d2476577d53","paths":["native/crates/organization-mutation-core/src/lib.rs","native/crates/organization-mutation-core/tests/persistence_contract.rs","native/crates/project-goal-link-core/src/lib.rs","native/crates/project-goal-link-core/tests/persistence_contract.rs"],"message":"fix(native): preserve original D1 mutation receipts\n\nDifferentiate omitted and cleared branding patches in JSON and command\nfingerprints, reject overflow before changing fields, and retain original\nversion/fence/state snapshots for replay without recursive ledger history.\nReject empty actors and non-branding fields. No SQL or public writer wiring.\n\nTDD: 11 new regression failures reproduced; all 26 core tests now pass.\nRust fmt, full-workspace Clippy, and workspace tests pass (227 tests).\nNo independent production acceptance or listener cutover claimed.\n\nCo-Authored-By: Rudder <285064165+Rudderhq@users.noreply.github.com>"},{"patch":"","sha256":"82035060f51423280d8f099cc3d9abc5fb4e4d7c8ea768fe417f626f4ade42c1","tree":"08aeddb8de341f9116a12d15b64e0ec193f0fb41","paths":["cli/src/__tests__/agent-cli-e2e.test.ts","cli/src/__tests__/company-import-export-e2e.test.ts","packages/db/src/client.test.ts","packages/db/src/migrations/chat-transcript-storage.test.ts","packages/db/src/migrations/managed-mcp-canonicalization.test.ts","packages/db/src/migrations/project-budget-removal.test.ts","server/src/__tests__/activity-service.test.ts","server/src/__tests__/agent-integration-feishu-db-dispatcher.test.ts","server/src/__tests__/agent-startup-context.test.ts","server/src/__tests__/app-builder-service.test.ts","server/src/__tests__/automations-e2e.test.ts","server/src/__tests__/automations-service.test.ts","server/src/__tests__/chat-agent-runs.test.ts","server/src/__tests__/chat-work-manifest.test.ts","server/src/__tests__/costs-rollups-service.test.ts","server/src/__tests__/custom-integrations-service.test.ts","server/src/__tests__/goals-concurrency.test.ts","server/src/__tests__/goals-history.test.ts","server/src/__tests__/heartbeat-passive-issue-closeout.test.ts","server/src/__tests__/heartbeat-paused-wakeups.test.ts","server/src/__tests__/heartbeat-process-recovery.test.ts","server/src/__tests__/heartbeat-run-concurrency.test.ts","server/src/__tests__/heartbeat-skill-analytics.test.ts","server/src/__tests__/heartbeat-workspace-preflight.test.ts","server/src/__tests__/issues-service.test.ts","server/src/__tests__/local-account-auth.test.ts","server/src/__tests__/managed-mcp-bindings-service.test.ts","server/src/__tests__/managed-mcp-connections-service.test.ts","server/src/__tests__/managed-mcp-oauth-service.test.ts","server/src/__tests__/messenger-service.test.ts","server/src/__tests__/operator-profile-service.test.ts","server/src/__tests__/organization-skills-installation.test.ts","server/src/__tests__/organization-skills-reference.test.ts","server/src/__tests__/organization-workspace-browser.test.ts","server/src/__tests__/orgs-service.test.ts","server/src/__tests__/projects-service.test.ts","server/src/__tests__/rudder-plugins-lifecycle.test.ts","server/src/__tests__/run-intelligence-e2e.test.ts","server/src/__tests__/run-intelligence-summary-service.test.ts","server/src/__tests__/side-chats.test.ts","server/src/__tests__/sidebar-badges-service.test.ts","server/src/__tests__/workspace-backups.test.ts","server/src/services/chat-generation-protocol.test.ts","server/src/services/chat-inline-annotations.test.ts"],"message":"test(db): pin message locale in disposable PostgreSQL fixtures\n\nExplicitly override embedded-postgres message locale after its default\nflags. Minimal Linux environments otherwise fail initdb because en_US.UTF-8\nis unavailable, despite the fixtures already requesting the C locale.\n\nOnly real test-fixture startup arguments change: no assertions are removed,\nno database tests are skipped, and no production provider behavior changes.\nDatabase package: 79 tests pass after reproducing 22 locale-init failures.\nFull Node qualification remains separately reported; no production authority\nor runtime ownership changes.\n\nCo-Authored-By: Rudder <285064165+Rudderhq@users.noreply.github.com>"}]''')
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          for index, batch in enumerate(batches):
              patch = zlib.decompress(base64.b64decode(batch["patch"], validate=True))
              assert len(patch) < 256 * 1024
              assert hashlib.sha256(patch).hexdigest() == batch["sha256"]
              subprocess.run(["git", "apply", "--index", "--whitespace=error", "-"], input=patch, check=True)
              expected = set(batch["paths"])
              if index == 0:
                  git("rm", "--", workflow)
                  expected.add(workflow)
              assert set(git("diff", "--cached", "--name-only").splitlines()) == expected
              git("diff", "--cached", "--check")
              assert git("write-tree") == batch["tree"], "Tested tree identity changed"
              git("commit", "-m", batch["message"])
              print("Validated commit:", git("rev-parse", "HEAD"), "tree:", batch["tree"])
          remote = git("ls-remote", "origin", "refs/heads/" + branch).split()[0]
          assert remote == transport, "Remote branch advanced; refusing to replace concurrent work"
          git("push", "origin", "HEAD:refs/heads/" + branch)
          PYCODE
