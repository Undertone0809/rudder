name: Publish exact validated R6Z batch
on:
  pull_request:
    paths:
      - .github/workflows/r6z-publish-validated-batch.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
      - name: Apply only exact validated patch bytes and source trees
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs).decode().strip()
          workflow = '.github/workflows/r6z-publish-validated-batch.yml'
          base = 'f8306754d25fbc5fa098980db196277e06c2e6b4'
          transport = os.environ['EXPECTED_HEAD']
          branch = 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
          assert git('rev-parse', 'HEAD') == transport
          assert git('rev-parse', 'HEAD^') == '7bf476e90e344eed5b0359617f5a339ad5d03955'
          assert git('diff', '--name-only', base, 'HEAD') == workflow
          source = git('show', '7bf476e90e344eed5b0359617f5a339ad5d03955:' + workflow)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'public-transport.txt').write_text(source)
          data = source.split("batches = json.loads(r'''", 1)[1].split("''')", 1)[0]
          batches = json.loads(data)
          corrections = [
              [('dxqgFzpl', 'dxqvFzpl'), ('Pi+PInZJZtT', 'Pi+PInZvtT')],
              [('DyLqSr9', 'DyL7qSr9'), ('KLC5Rbq3Zx', 'KLC5Rbq2Zx'),
               ('TCyftUYpXKU', 'TCyftUYpKU'), ('NIYgVg', 'NIYVg'),
               ('StVRz3OB', 'StVRz4OB'), ('SllFjFl1', 'SlljFl1'),
               ('B6mI0yth', 'B6m0yth'), ('XuVuVuXA3', 'XuVuJqXA3'),
               ('YPDYJcu6l', 'YPDYJ2i6l'), ('HDZcf9x', 'HDZx9x'),
               ('NVqiSl0', 'NVqi0')]
          ]
          patches = []
          for batch, fixes in zip(batches, corrections):
              encoded = batch['patch']
              for before, after in fixes:
                  assert encoded.count(before) == 1, before
                  encoded = encoded.replace(before, after)
              patch = zlib.decompress(base64.b64decode(encoded, validate=True))
              assert len(patch) < 256 * 1024
              assert hashlib.sha256(patch).hexdigest() == batch['sha256']
              patches.append(patch)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          for index, (batch, patch) in enumerate(zip(batches, patches)):
              subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
              expected = set(batch['paths'])
              if index == 0:
                  git('rm', '--', workflow)
                  expected.add(workflow)
              assert set(git('diff', '--cached', '--name-only').splitlines()) == expected
              git('diff', '--cached', '--check')
              assert git('write-tree') == batch['tree'], 'Tested source tree changed'
              git('commit', '-m', batch['message'])
              print('Validated commit:', git('rev-parse', 'HEAD'), 'tree:', batch['tree'])
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == transport
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: r6z-public-transport-diagnostic
          path: ${{ runner.temp }}/public-transport.txt
          if-no-files-found: ignore
          retention-days: 1
