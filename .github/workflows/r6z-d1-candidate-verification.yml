name: R6Z D1 candidate verification

on:
  push:
    branches:
      - codex/r6z-120-d1-validation-20260916

permissions:
  contents: read

concurrency:
  group: r6z-d1-candidate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Exact-source native and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain
          git show -s --format='source=%H%ntree=%T' HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install public dependencies and disposable PostgreSQL runtime
        run: |
          corepack enable
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Rust Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Rust workspace tests including real PostgreSQL
        if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path native/Cargo.toml --workspace -- --test-threads=1
      - name: Confirm tracked source was not changed by verification
        if: ${{ !cancelled() }}
        run: git diff --exit-code

  repository:
    name: Repository ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: pnpm lint
          - check: typecheck
            command: pnpm -r typecheck
          - check: tests
            command: pnpm test:run
          - check: build
            command: pnpm build
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install public dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run the actual repository baseline
        run: ${{ matrix.command }}
      - name: Confirm tracked source was not changed by verification
        if: ${{ !cancelled() }}
        run: git diff --exit-code
