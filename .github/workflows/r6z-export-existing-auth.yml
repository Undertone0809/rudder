name: Qualify converged bearer authentication
on:
  pull_request:
    paths:
      - .github/workflows/r6z-export-existing-auth.yml
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Materialize the primary-thread candidate without changing production code
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),path=require('path'),assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='e0e16ae944bbd4c3e2aab6260ab850b646f8e30a';
            const workflow='.github/workflows/r6z-export-existing-auth.yml';
            assert.equal(git('rev-parse','HEAD'),context.payload.pull_request.head.sha);
            git('merge-base','--is-ancestor',base,'HEAD');
            assert.equal(git('diff','--name-only',base,'HEAD'),workflow);
            const files={
              'Cargo.toml':'d66a08b0e1442d49b929f420832c211c38c32bec',
              'README.md':'9b20089ce4b3436ff09dff23bc44addb2c61e7c9',
              'src/lib.rs':'be625a323f9965e24af174adb48cfd03c93648d1',
              'src/jwt.rs':'6dd472da2cd90db2f3677ce58c77766c2adfc728',
              'src/store.rs':'db19829493c4126cf44abd63783764db4ee8629e',
              'src/middleware.rs':'05f3fd75f7b48e68431c4752a36407ef0d61a48c',
              'tests/common/mod.rs':'07ec3161dc50866680e15fbc4a40b45cc6219616',
              'tests/postgres.rs':'980c91c764f41ee1b94c520bb6851d375ad444ab',
              'tests/http.rs':'d863b64e773ff1b86e545526c3507a9fac47aceb'
            };
            const root='native/crates/bearer-auth-service';
            assert.ok(!fs.existsSync(root));
            for(const [name,sha] of Object.entries(files)) {
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
              assert.equal(data.sha,sha);assert.equal(data.encoding,'base64');
              const file=path.join(root,name);fs.mkdirSync(path.dirname(file),{recursive:true});
              fs.writeFileSync(file,Buffer.from(data.content,'base64'));
              assert.equal(git('hash-object',file),sha);
              if(name.endsWith('.rs')) assert.ok(fs.readFileSync(file,'utf8').trimEnd().split('\n').at(-1).startsWith('// End of'));
            }
            const manifest='native/Cargo.toml',text=fs.readFileSync(manifest,'utf8');
            assert.equal(text.split('members = [\n').length,2);
            fs.writeFileSync(manifest,text.replace('members = [\n','members = [\n  "crates/bearer-auth-service",\n'));
            fs.copyFileSync('native/Cargo.lock',path.join(process.env.RUNNER_TEMP,'before.lock'));
      - name: Install isolated PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin_dir="$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)"
          test -x "$bin_dir/initdb"
          echo "RUDDER_POSTGRES_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
      - name: Compile without updating external dependency identities
        run: |
          cargo check --manifest-path native/Cargo.toml -p rudder-bearer-auth-service
          python3 - <<'PY'
          import os,pathlib,tomllib
          before=tomllib.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'before.lock').read_text())
          after=tomllib.loads(pathlib.Path('native/Cargo.lock').read_text())
          def identities(lock):
              return {(p['name'],p['version'],p['source'],p.get('checksum')) for p in lock['package'] if 'source' in p}
          assert identities(before)==identities(after), 'External dependency identity changed'
          PY
      - name: Execute complete native qualification and actual bearer workflows
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked -p rudder-bearer-auth-service -- --test-threads=1
          cargo test --manifest-path native/Cargo.toml --locked --workspace -- --test-threads=1
      - name: Export only the verified candidate tree
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='e0e16ae944bbd4c3e2aab6260ab850b646f8e30a';
            const workflow='.github/workflows/r6z-export-existing-auth.yml';
            git('add','--','native/Cargo.toml','native/Cargo.lock','native/crates/bearer-auth-service');
            git('rm','--cached','--',workflow);fs.unlinkSync(workflow);
            git('diff','--cached','--check',base);git('diff','--exit-code');
            const files=git('diff','--cached','--name-only',base).split('\n');
            assert.equal(files.length,12);
            assert.ok(files.every(f=>f.startsWith('native/crates/bearer-auth-service/') || ['native/Cargo.toml','native/Cargo.lock',workflow].includes(f)));
            const entries=[{path:workflow,mode:'100644',type:'blob',sha:null}];
            for(const file of files.filter(f=>f!==workflow)) {
              const {data}=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
              assert.equal(data.sha,git('hash-object',file));entries.push({path:file,mode:'100644',type:'blob',sha:data.sha});
            }
            const {data:tree}=await github.rest.git.createTree({...context.repo,base_tree:'55663eb50862f626206bf34d0debd381f4af9de1',tree:entries});
            assert.equal(tree.sha,git('write-tree'));
            core.info('VERIFIED_BEARER_TREE='+JSON.stringify({tree:tree.sha,files:entries}));
            await core.summary.addHeading('Primary-thread bearer qualification').addCodeBlock(JSON.stringify({base,tree:tree.sha,files:entries,branchAdvanced:false,productionAuthorityChanged:false},null,2)).write();
  diagnostics:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId});
            const job=jobs.jobs.find(j=>j.name==='qualify');
            const {data}=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
            const lines=(typeof data==='string'?data:Buffer.from(data).toString('utf8')).replace(/\u001b\[[0-9;]*m/g,'').split('\n');
            const selected=new Set();
            for(let i=0;i<lines.length;i++) if(/error\[|error:|AssertionError|FAILED|test result:|VERIFIED_BEARER_TREE=/.test(lines[i])) {
              for(let j=Math.max(0,i-1);j<Math.min(lines.length,i+18);j++) selected.add(j);
            }
            for(const i of [...selected].sort((a,b)=>a-b).slice(-240)) core.info(lines[i]);
            core.info('Qualification: '+job.conclusion);
