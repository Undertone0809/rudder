name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach desktop artifacts to, for example v0.1.0 or canary/v0.1.0-canary.1"
        required: true
      source_ref:
        description: "Optional source ref to build from when recovering an existing release tag"
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve-source:
    name: Resolve trusted desktop source
    if: github.repository == 'Undertone0809/rudder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(canary/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_sha="$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")"
          source_sha="$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}")"
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo "Desktop source must resolve to the release tag commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Desktop release tag must belong to the protected main history." >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: resolve-source
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-14
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare PostgreSQL 18.4 runtime payload
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "${MATRIX_PLATFORM}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-18
            echo "RUDDER_POSTGRES_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
            /usr/lib/postgresql/18/bin/postgres --version
            exit 0
          fi

          bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"
          RUDDER_POSTGRES_BIN_DIR="${bin_dir}" node -e "const {execFileSync}=require('node:child_process'); const path=require('node:path'); const exe=process.platform==='win32'?'postgres.exe':'postgres'; console.log(execFileSync(path.join(process.env.RUDDER_POSTGRES_BIN_DIR, exe), ['--version'], {encoding:'utf8'}).trim())"

      - name: Build desktop portable asset
        env:
          RUDDER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag##*/}"
          version="${version#v}"
          node scripts/release-package-map.mjs set-version "${version}"

          if [ "$(uname -s)" = "Darwin" ]; then
            ulimit -n 65536 || ulimit -n 10240 || true
            echo "macOS open file limit: $(ulimit -n)"
          fi

          pnpm desktop:dist

      - name: Collect release asset
        id: collect
        env:
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag##*/}"
          version="${version#v}"
          node scripts/collect-desktop-release-assets.mjs \
            --version "${version}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --out dist/desktop-assets

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-assets/*
          if-no-files-found: error

  publish:
    name: Attach desktop artifacts
    needs:
      - resolve-source
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist/desktop-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/desktop-assets
          shasum -a 256 Rudder-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          release_title="${tag##*/}"
          notes_file="releases/${tag}.md"
          release_args=(create "${tag}" --title "${release_title}")
          if [[ "${tag}" == canary/* ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release "${release_args[@]}" --notes-file "${notes_file}"
            else
              gh release "${release_args[@]}" --notes "Desktop artifacts for ${tag}."
            fi
          else
            edit_args=(edit "${tag}" --title "${release_title}")
            if [[ "${tag}" == canary/* ]]; then
              edit_args+=(--prerelease)
            fi
            gh release "${edit_args[@]}"
          fi

          find dist/desktop-assets -maxdepth 1 -type f \( -name 'Rudder-*' -o -name 'SHASUMS256.txt' \) \
            | sort \
            | while IFS= read -r asset; do
              echo "Uploading ${asset}"
              gh release upload "${tag}" "${asset}" --clobber
            done
