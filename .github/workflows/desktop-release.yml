name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach desktop artifacts to, for example v0.1.0 or canary/v0.1.0-canary.1"
        required: true
      source_ref:
        description: "Optional source ref to build from when recovering an existing release tag"
        required: false
  push:
    tags:
      - "v*"
      - "canary/v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-14
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      - name: Cache PostgreSQL runtime payload
        uses: actions/cache@v5
        with:
          path: ~/.rudder/runtime-payloads/postgres-18.4
          key: postgres-runtime-18.4-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/scripts/prepare-postgres-runtime.mjs', '.github/workflows/desktop-release.yml') }}

      - name: Prepare PostgreSQL 18.4 runtime payload
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "${MATRIX_PLATFORM}" = "linux" ]; then
            runtime_root="${HOME}/.rudder/runtime-payloads/postgres-18.4/linux-${{ matrix.arch }}"
            bin_dir="${runtime_root}/bin"
            if [ ! -x "${bin_dir}/postgres" ]; then
              source_url="https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
              source_sha256="81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
              source_archive="${RUNNER_TEMP}/postgresql-18.4.tar.bz2"
              source_root="${RUNNER_TEMP}/postgresql-18.4"
              build_root="${RUNNER_TEMP}/postgresql-18.4-build"
              curl --fail --location --output "${source_archive}" "${source_url}"
              actual_sha256="$(shasum -a 256 "${source_archive}" | awk '{print $1}')"
              test "${actual_sha256}" = "${source_sha256}"
              tar -xjf "${source_archive}" -C "${RUNNER_TEMP}"
              mkdir -p "${build_root}"
              cd "${build_root}"
              "${source_root}/configure" \
                --prefix="${runtime_root}" \
                --without-icu \
                --without-readline \
                --without-zlib
              make -j2
              make install
            fi
            test -f "${runtime_root}/share/postgres.bki"
            test -f "${runtime_root}/share/postgresql.conf.sample"
            test -d "${runtime_root}/share/timezone"
            test -x "${bin_dir}/pg_config"
            postgres_configure="$("${bin_dir}/pg_config" --configure)"
            if grep -q -- '--with-system-tzdata' <<< "${postgres_configure}"; then
              echo "Linux portable PostgreSQL must bundle its own timezone database." >&2
              exit 1
            fi
            echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"
            "${bin_dir}/postgres" --version
            exit 0
          fi

          bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"
          RUDDER_POSTGRES_BIN_DIR="${bin_dir}" node -e "const {execFileSync}=require('node:child_process'); const path=require('node:path'); const exe=process.platform==='win32'?'postgres.exe':'postgres'; console.log(execFileSync(path.join(process.env.RUDDER_POSTGRES_BIN_DIR, exe), ['--version'], {encoding:'utf8'}).trim())"

      - name: Build desktop portable asset
        env:
          RUDDER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          version="${tag##*/}"
          version="${version#v}"
          node scripts/release-package-map.mjs set-version "${version}"

          if [ "$(uname -s)" = "Darwin" ]; then
            ulimit -n 65536 || ulimit -n 10240 || true
            echo "macOS open file limit: $(ulimit -n)"
          fi

          if [ "$(uname -s)" = "Linux" ]; then
            command -v dbus-run-session
            command -v xvfb-run
            dbus-run-session -- xvfb-run --auto-servernum pnpm desktop:dist
            dbus-run-session -- xvfb-run --auto-servernum node desktop/scripts/app-builder-smoke.mjs --packaged
          else
            pnpm desktop:dist
            node desktop/scripts/app-builder-smoke.mjs --packaged
          fi

          if [ "$(uname -s)" = "Linux" ] || [ "$(uname -s)" = "Darwin" ]; then
            runtime_platform="linux"
            if [ "$(uname -s)" = "Darwin" ]; then
              runtime_platform="darwin"
            fi
            staged_runtime="${GITHUB_WORKSPACE}/desktop/.packaged/postgres-18.4/${runtime_platform}-${{ matrix.arch }}"
            source_runtime="$(dirname "${RUDDER_POSTGRES_BIN_DIR}")"
            hidden_source_runtime="${source_runtime}.portable-smoke-hidden"
            restore_source_runtime() {
              if [ -d "${hidden_source_runtime}" ]; then
                mv "${hidden_source_runtime}" "${source_runtime}"
              fi
            }
            trap restore_source_runtime EXIT
            mv "${source_runtime}" "${hidden_source_runtime}"
            smoke_data="$(mktemp -d "${RUNNER_TEMP}/rudder-postgres-portable-smoke.XXXXXX")"
            "${staged_runtime}/bin/initdb" \
              --pgdata="${smoke_data}" \
              --no-locale \
              --encoding=UTF8
            "${staged_runtime}/bin/pg_ctl" \
              --pgdata="${smoke_data}" \
              --options="-h 127.0.0.1 -p 55432" \
              --wait \
              start
            "${staged_runtime}/bin/pg_ctl" \
              --pgdata="${smoke_data}" \
              --mode=fast \
              --wait \
              stop
            restore_source_runtime
            trap - EXIT
          fi

      - name: Smoke packaged account gate
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: node desktop/scripts/smoke.mjs --mode=packaged --scenario=account-gate

      - name: Collect release asset
        id: collect
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          version="${tag##*/}"
          version="${version#v}"
          node scripts/collect-desktop-release-assets.mjs \
            --version "${version}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --out dist/desktop-assets

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-assets/*
          if-no-files-found: error

  publish:
    name: Attach desktop artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/desktop-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/desktop-assets
          shasum -a 256 Rudder-* > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          release_title="${tag##*/}"
          notes_file="releases/${tag}.md"
          release_args=(create "${tag}" --title "${release_title}")
          if [[ "${tag}" == canary/* ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release "${release_args[@]}" --notes-file "${notes_file}"
            else
              gh release "${release_args[@]}" --notes "Desktop artifacts for ${tag}."
            fi
          else
            edit_args=(edit "${tag}" --title "${release_title}")
            if [[ "${tag}" == canary/* ]]; then
              edit_args+=(--prerelease)
            fi
            gh release "${edit_args[@]}"
          fi

          find dist/desktop-assets -maxdepth 1 -type f \( -name 'Rudder-*' -o -name 'SHASUMS256.txt' \) \
            | sort \
            | while IFS= read -r asset; do
              echo "Uploading ${asset}"
              gh release upload "${tag}" "${asset}" --clobber
            done
