name: Qualify integrated Rust migration baseline

on:
  pull_request:
    paths:
      - .github/workflows/r6z-qualify-integrated-baseline.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: '1'
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the verified two-parent integration candidate
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
            const head = '47ae2915597afa601b2ffc26d3d36f40e731754a';
            const main = '81cff2958923cb9009b23a457cd1b9bfcc9d4b69';
            const merge = 'df9fd0b92656bd09a119c9b91a751a76d707e49b';
            const workflow = '.github/workflows/r6z-qualify-integrated-baseline.yml';
            assert.equal(git('rev-parse','HEAD'),context.payload.pull_request.head.sha);
            assert.equal(git('rev-parse','HEAD^'),'314d19d1d6b281b3f6a08dcf364a3f75b805f062');
            assert.deepEqual(git('diff','--name-only',head,'HEAD').split('\n').sort(),[
              '.github/workflows/r6z-baseline-diagnostics.yml',workflow
            ].sort());
            const {data:commit} = await github.rest.git.getCommit({...context.repo,commit_sha:merge});
            assert.deepEqual(commit.parents.map(p=>p.sha),[main,head]);
            assert.equal(commit.tree.sha,'8830e5750ba6022902f537a2d1fa2a5e987d83d5');
            execFileSync('git',['fetch','--no-tags','origin',merge]);
            assert.equal(git('rev-parse',`${merge}^{tree}`),commit.tree.sha);
            git('read-tree','--reset','-u',merge);
            assert.equal(git('write-tree'),commit.tree.sha);
            assert.match(fs.readFileSync('native/Cargo.toml','utf8'),/version = "0\.7\.22"/);
            const file='native/Cargo.lock';
            const before=fs.readFileSync(file,'utf8');
            const changed=[];
            const after=before.split('[[package]]').map(block=>{
              const name=/^\nname = "([^"]+)"/m.exec(block)?.[1];
              if (!name?.startsWith('rudder-') || /\nsource = /.test(block) || !/\nversion = "0\.7\.21"\n/.test(block)) return block;
              changed.push(name);
              return block.replace('\nversion = "0.7.21"\n','\nversion = "0.7.22"\n');
            }).join('[[package]]');
            assert.deepEqual(changed.sort(),['rudder-d1-persistence','rudder-organization-mutation-core','rudder-project-goal-link-core'].sort());
            fs.writeFileSync(file,after);
            git('add','--',file);
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Reproduce the missing development migration declaration
        shell: bash
        run: |
          set +e
          node scripts/release-compatibility-matrix.mjs --candidate-version 0.7.22 --channel stable > "$RUNNER_TEMP/compat-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/compat-red.log"
          test "$status" -ne 0
          grep -F 'but 0.7.22 declares 085c15c2a32685dbbddd775ee6fe21aea4ff5c151193f1711ad8c1c52a04a0db' "$RUNNER_TEMP/compat-red.log"
      - name: Declare only the current schema and isolate historical test source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readCandidateManifest} from './scripts/release-compatibility-matrix.mjs';
          const manifest=readCandidateManifest();
          assert.equal(manifest.entries.at(-1).tag,'0163_organization_mutations');
          assert.equal(manifest.entries.length,164);
          assert.equal(manifest.fingerprint,'4315219366d44c9350db4b23977b5d86df80aee341a2253ae0fe7a5239c8cbd8');
          const file='scripts/release-compatibility-matrix.mjs';
          const before=fs.readFileSync(file,'utf8');
          const old='  "0.7.22": {\n    candidateFingerprint: "085c15c2a32685dbbddd775ee6fe21aea4ff5c151193f1711ad8c1c52a04a0db",';
          assert.equal(before.split(old).length,2);
          fs.writeFileSync(file,before.replace(old,`  "0.7.22": {\n    candidateFingerprint: "${manifest.fingerprint}",`));
          const testFile='scripts/release-compatibility-matrix.test.mjs';
          assert.equal(execFileSync('git',['hash-object',testFile],{encoding:'utf8'}).trim(),'aeecf97b7b4496da976ece9523f334ceccf818e3');
          let tests=fs.readFileSync(testFile,'utf8');
          tests=tests.replace('import { describe, expect, it }','import { fileURLToPath } from "node:url";\nimport { describe, expect, it }');
          tests=tests.replace('  runCompatibilityPreflight,','  readFixtureManifest,\n  runCompatibilityPreflight,');
          const cut='  it("retains the 0.7.11 compatibility declaration",';
          assert.equal(tests.split(cut).length,2);
          let [historical,remaining]=tests.split(cut);
          assert.equal(historical.split('runCompatibilityPreflight({').length,9);
          historical=historical.replaceAll('runCompatibilityPreflight({','preD1CompatibilityPreflight({').replaceAll('checked-in','frozen pre-D1');
          tests=historical+cut+remaining;
          const helper=`
          const repoRoot = fileURLToPath(new URL("../", import.meta.url));
          const preD1SchemaRef = "81cff2958923cb9009b23a457cd1b9bfcc9d4b69";
          let preD1Schema;

          // Retained declarations shared this candidate schema, not the moving worktree.
          // Released upgrade fixtures still load their own separately pinned Git sources.
          function preD1CompatibilityPreflight({ candidateVersion, channel }) {
            preD1Schema ??= readFixtureManifest(repoRoot, { version: "pre-D1", ref: preD1SchemaRef });
            return validateCompatibilityMatrix({
              candidateManifest: preD1Schema,
              candidateVersion,
              channel,
              loadFixture: (fixture) => readFixtureManifest(repoRoot, fixture),
            });
          }
          `;
          tests=tests.replace('function journal(entries) {',helper+'\nfunction journal(entries) {');
          tests+=`
          describe("current D1 schema release identity", () => {
            it.each([
              ["0.7.22", "stable"],
              ["0.7.22-canary.1", "canary"],
            ])("accepts %s only with its declared schema and historical fixtures", (candidateVersion, channel) => {
              const result = runCompatibilityPreflight({ candidateVersion, channel });
              expect(result.candidateFingerprint).toBe("4315219366d44c9350db4b23977b5d86df80aee341a2253ae0fe7a5239c8cbd8");
              expect(result.candidateMigrations).toBe(164);
              expect(result.candidateSqlFiles).toBe(166);
              expect(result.fixtures.map((fixture) => fixture.version)).toEqual([
                "0.7.21", "0.7.20", "0.7.19", "0.7.18", "0.7.16", "0.7.15",
              ]);
            }, 60_000);

            it.each(["0.7.21", "0.7.20", "0.7.19", "0.7.18", "0.7.16", "0.7.15", "0.7.14", "0.7.13"])(
              "rejects labeling the appended schema as historical %s",
              (candidateVersion) => {
                expect(() => runCompatibilityPreflight({ candidateVersion, channel: "stable" }))
                  .toThrow("but " + candidateVersion + " declares 085c15c2a32685dbbddd775ee6fe21aea4ff5c151193f1711ad8c1c52a04a0db");
              },
            );
          });
          `;
          fs.writeFileSync(testFile,tests);
          const pkgFile='package.json';
          const text=fs.readFileSync(pkgFile,'utf8');
          const pkg=JSON.parse(text);
          assert.equal(pkg.scripts.build,'pnpm -r build');
          const replacement='pnpm -r --filter "!@rudderhq/desktop" build && pnpm --filter @rudderhq/desktop build';
          const oldBuild='"build": "pnpm -r build"';
          assert.equal(text.split(oldBuild).length,2);
          fs.writeFileSync(pkgFile,text.replace(oldBuild,`"build": ${JSON.stringify(replacement)}`));
          const after=JSON.parse(fs.readFileSync(pkgFile,'utf8'));
          after.scripts.build=pkg.scripts.build;
          assert.deepEqual(after,pkg);
          NODE
      - name: Verify current stable/canary and every historical regression
        run: |
          node scripts/release-compatibility-matrix.mjs --candidate-version 0.7.22 --channel stable
          node scripts/release-compatibility-matrix.mjs --candidate-version 0.7.22-canary.1 --channel canary
          pnpm exec vitest run --root scripts --config vitest.config.ts release-compatibility-matrix.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install disposable native PostgreSQL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin_dir="$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)"
          test -x "$bin_dir/initdb"
          echo "RUDDER_POSTGRES_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
      - name: Add the reviewed link capacity and scope regressions
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const file='native/crates/d1-persistence/tests/postgres.rs';
            assert.equal(execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),'0d8433b65e156c91d078ab606296da306af8d3eb');
            const sha='965ddaefefac94d8642c2477d85f867df2683bf7';
            const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
            assert.equal(data.sha,sha);
            fs.appendFileSync(file,Buffer.from(data.content,'base64'));
      - name: Reproduce the capacity overflow before applying the fix
        shell: bash
        run: |
          set +e
          cargo test --manifest-path native/Cargo.toml --locked -p rudder-d1-persistence --test postgres link_capacity_ -- --test-threads=1 > "$RUNNER_TEMP/capacity-red.log" 2>&1
          status=$?
          set -e
          tail -n 75 "$RUNNER_TEMP/capacity-red.log"
          test "$status" -ne 0
          grep -F 'test result: FAILED. 2 passed; 1 failed;' "$RUNNER_TEMP/capacity-red.log"
          grep -F 'link_capacity_append_cannot_create_a_state_the_adapter_cannot_read ... FAILED' "$RUNNER_TEMP/capacity-red.log"
      - name: Apply the reviewed bounded link implementation
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const file='native/crates/d1-persistence/src/links.rs';
            assert.equal(execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),'ee71599aab9eb5c893e1d1ea81b4bfc3436d0ab2');
            const sha='1f9ed35c12949afee6e17a43609be39fc94f0c71';
            const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
            assert.equal(data.sha,sha);
            fs.writeFileSync(file,Buffer.from(data.content,'base64'));
            assert.equal(execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),sha);
      - name: Locked full native qualification
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked --workspace -- --test-threads=1
      - name: Full repository lint and typecheck
        run: pnpm lint && pnpm -r typecheck
      - name: Build the real native release binaries
        run: pnpm native:build
      - name: Complete Node baseline with its own PostgreSQL provider selection
        id: node_baseline
        shell: bash
        run: |
          set +e
          env -u RUDDER_POSTGRES_BIN_DIR pnpm test:run --maxWorkers=2 > "$RUNNER_TEMP/node-baseline.log" 2>&1
          status=$?
          set -e
          grep -E 'Test Files|Tests  |FAIL |Failed Tests|Failed Suites|Error:' "$RUNNER_TEMP/node-baseline.log" | tail -n 80 || true
          tail -n 60 "$RUNNER_TEMP/node-baseline.log"
          exit "$status"
      - name: Complete root build with non-overlapping Desktop packaging
        if: ${{ !cancelled() && steps.node_baseline.outcome != 'skipped' }}
        shell: bash
        run: |
          set +e
          env -u RUDDER_POSTGRES_BIN_DIR pnpm build > "$RUNNER_TEMP/build-baseline.log" 2>&1
          status=$?
          set -e
          tail -n 90 "$RUNNER_TEMP/build-baseline.log"
          exit "$status"
      - name: Prepare separate history-preserving integration and repair trees
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const assert = require('assert/strict');
            const {execFileSync} = require('child_process');
            const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
            const merge='df9fd0b92656bd09a119c9b91a751a76d707e49b';
            const groups=[['native/Cargo.lock'],['scripts/release-compatibility-matrix.mjs','scripts/release-compatibility-matrix.test.mjs'],['package.json'],['native/crates/d1-persistence/src/links.rs','native/crates/d1-persistence/tests/postgres.rs']];
            const files=groups.flat();
            git('add','--',...files);
            git('diff','--cached','--check',merge);
            git('diff','--exit-code');
            assert.deepEqual(git('diff','--cached','--name-only',merge).split('\n').sort(),[...files].sort());
            let base_tree='8830e5750ba6022902f537a2d1fa2a5e987d83d5';
            const trees=[];
            for (const group of groups) {
              const elements=[];
              for (const file of group) {
                const {data:blob} = await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
                assert.equal(blob.sha,git('hash-object',file));
                elements.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
              }
              const {data:tree} = await github.rest.git.createTree({...context.repo,base_tree,tree:elements});
              base_tree=tree.sha;
              trees.push({files:elements,tree:tree.sha});
            }
            assert.equal(base_tree,git('write-tree'));
            core.info(`QUALIFIED_INTEGRATION_TREES=${JSON.stringify(trees)}`);
            core.info(git('diff','--cached','--stat',merge));
            await core.summary.addHeading('Integrated migration baseline').addRaw(JSON.stringify({main:'81cff2958923cb9009b23a457cd1b9bfcc9d4b69',originalHead:'47ae2915597afa601b2ffc26d3d36f40e731754a',trees,branchAdvanced:false,productionAuthorityChanged:false},null,2)).write();
  diagnostics:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId});
            const job=jobs.jobs.find(job=>job.name==='qualify');
            if(!job) throw new Error('qualification job missing');
            const {data}=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
            const text=typeof data==='string'?data:Buffer.from(data).toString('utf8');
            const lines=text.replace(/\u001b\[[0-9;]*m/g,'').split('\n');
            const selected=new Set();
            for(let i=0;i<lines.length;i++) {
              if(/FAIL |Failed Suites|Failed Tests|AssertionError|Test Files|Tests  |test result:|QUALIFIED_INTEGRATION_TREES=|Error:/.test(lines[i]) && lines[i].length<6000) {
                for(let j=Math.max(0,i-1);j<Math.min(lines.length,i+10);j++) selected.add(j);
              }
            }
            for(const index of [...selected].sort((a,b)=>a-b).slice(-200)) core.info(lines[index].slice(0,6000));
            core.info(`Qualification conclusion: ${job.conclusion}`);
