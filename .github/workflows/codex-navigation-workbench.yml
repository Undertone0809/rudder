name: Navigation workbench (temporary)
on:
  push:
    branches: [codex/projects-library-navigation]
    paths: [.github/workflows/codex-navigation-workbench.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_E2E_PRODUCTION_UI: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/projects-library-navigation
      - name: Load immutable reviewed patch
        run: git fetch --depth=1 origin b91ef52a33b8696c4b679379273f145b5fbaa1f2
      - name: Apply reviewed navigation patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, re, subprocess
          source = subprocess.check_output(['git', 'show', 'b91ef52a33b8696c4b679379273f145b5fbaa1f2:.github/workflows/codex-navigation-workbench.yml']).decode()
          encoded = re.search(r'encoded = "([^"]+)"', source).group(1)
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'abc3f65f7ab0bcf01fedafdc02a3ab36fd938e362f3b6a083cfc2c0153194fe3'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', '-N', 'tests/e2e/projects-library-navigation.spec.ts'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only']).decode()
          pathlib.Path('/tmp/navigation-paths.txt').write_text(paths)
          print(paths)
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
      - name: Record known unrelated full-repository lint baseline
        continue-on-error: true
        run: |
          git diff --exit-code -- cli/src/commands/start.ts packages/shared/src/validators/chat.ts packages/shared/src/validators/index.ts server/src/__tests__/organization-workspace-media-routes.test.ts server/src/routes/issues.mutations.ts
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/navigation-baseline-lint.log
      - name: Scoped lint and focused regression tests
        run: |
          node scripts/lint-imports.mjs --changed
          pnpm --filter @rudderhq/identity-core build
          pnpm --filter @rudderhq/ui exec vitest run src/components/PrimaryRail.test.tsx src/components/ThreeColumnContextSidebar.test.tsx src/lib/primary-rail-memory.test.ts --maxWorkers=2
      - name: Typecheck and production UI build
        run: |
          pnpm --filter @rudderhq/ui typecheck
          pnpm --filter @rudderhq/ui build
      - name: Real browser navigation and visual evidence
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e projects-library-navigation.spec.ts primary-rail-layout.spec.ts organization-skill-library-navigation.spec.ts chat-draft-persistence.spec.ts --workers=2
          cp -r tests/e2e/playwright-report /tmp/navigation-browser-report 2>/dev/null || cp -r playwright-report /tmp/navigation-browser-report
      - name: Inspect and publish only the tested navigation changes
        run: |
          git diff --check
          git diff --binary > /tmp/navigation-verified.patch
          xargs -d '\n' git add -- < /tmp/navigation-paths.txt
          git diff --cached --check
          git diff --cached --stat
          git -c user.name='codex[bot]' -c user.email='codex@users.noreply.github.com' commit -m 'feat(ui): group Library under Projects navigation'
          git push origin HEAD:refs/heads/codex/projects-library-navigation
          git rev-parse HEAD > /tmp/navigation-verified-sha.txt
      - name: Collect candidate diff even on failure
        if: always()
        run: git diff --binary > /tmp/navigation-candidate.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: navigation-validation
          path: |
            /tmp/navigation-*.patch
            /tmp/navigation-baseline-lint.log
            /tmp/navigation-verified-sha.txt
            /tmp/navigation-browser-report
            tests/e2e/test-results
            tests/e2e/playwright-report
            playwright-report
          retention-days: 7
