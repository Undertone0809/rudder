name: Docs production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA, branch, or existing tag to publish"
        required: true
        default: "main"
      tag_name:
        description: "Optional docs release tag, for example docs/v2026.05.27"
        required: false
        default: ""
      confirm_domain:
        description: "Enter only after explicit operator approval; type docs.rudderhq.dev"
        required: true
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: "Immutable stable release tag or commit to publish"
        required: true
        type: string
      tag_name:
        description: "Stable docs deployment tag"
        required: true
        type: string
      release_docs_approved:
        description: "Set only by the stable release workflow after its separate docs confirmation"
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: docs-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERCEL_ORG_ID: team_eu3qF8T1G0150GL2tqHOrG6Q
  VERCEL_PROJECT_ID: prj_ppjxvoIGcoV3jGTeq8vBhzObXaJV
  VERCEL_SCOPE: zeelands-projects
  DOCS_PRODUCTION_DOMAIN: docs.rudderhq.dev
  DOCS_PRODUCTION_ALIASES: doc.rudder.zeeland.studio,rudder-docs.vercel.app,rudder-docs-zeelands-projects.vercel.app

jobs:
  publish:
    name: Publish production docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'Undertone0809/rudder'
    steps:
      - name: Confirm production target
        env:
          CONFIRM_DOMAIN: ${{ inputs.confirm_domain }}
          RELEASE_DOCS_APPROVED: ${{ inputs.release_docs_approved }}
        run: |
          if [ "$RELEASE_DOCS_APPROVED" = "true" ]; then
            exit 0
          fi
          test "$CONFIRM_DOMAIN" = "$DOCS_PRODUCTION_DOMAIN"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Test docs structure
        run: pnpm docs:structure:test

      - name: Verify generated docs metadata
        run: node scripts/docs-content-map.mjs integrity

      - name: Resolve docs tag
        id: tag
        run: |
          git fetch --tags --force origin

          if [[ -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="docs/v$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          fi

          if [[ ! "$tag" =~ ^docs/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.-][A-Za-z0-9._-]+)?$ && ! "$tag" =~ ^docs/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid docs tag: $tag" >&2
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "Tag $tag already exists at $existing_sha, not $current_sha" >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Validate docs
        working-directory: docs
        run: PUPPETEER_SKIP_DOWNLOAD=1 npx -y mint@4.2.637 validate

      - name: Export docs
        working-directory: docs
        run: npx -y mint@4.2.637 export --output "$RUNNER_TEMP/rudder-docs.zip"

      - name: Unpack static export
        run: |
          mkdir -p "$RUNNER_TEMP/rudder-docs-export"
          unzip -q "$RUNNER_TEMP/rudder-docs.zip" -d "$RUNNER_TEMP/rudder-docs-export"
          node scripts/postprocess-docs-export.mjs "$RUNNER_TEMP/rudder-docs-export"
          mkdir -p "$RUNNER_TEMP/rudder-docs-export/.vercel"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > "$RUNNER_TEMP/rudder-docs-export/.vercel/project.json"
          cp docs/vercel.production.redirects.json "$RUNNER_TEMP/rudder-docs-export/vercel.json"

      - name: Inject production analytics id
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/vercel-production.env"
          vercel env pull "$env_file" \
            --yes \
            --environment=production \
            --cwd "$RUNNER_TEMP/rudder-docs-export" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

          VERCEL_ENV_FILE="$env_file" EXPORT_DIR="$RUNNER_TEMP/rudder-docs-export" node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const placeholder = "__RUDDER_GA_MEASUREMENT_ID__";
          const envFile = process.env.VERCEL_ENV_FILE;
          const exportDir = process.env.EXPORT_DIR;

          function parseDotenv(text) {
            const values = {};
            for (const rawLine of text.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;
              const equals = line.indexOf("=");
              if (equals === -1) continue;
              const key = line.slice(0, equals).trim();
              let value = line.slice(equals + 1).trim();
              if (
                (value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))
              ) {
                value = value.slice(1, -1);
              }
              values[key] = value.replace(/\\n/g, "\n");
            }
            return values;
          }

          const values = parseDotenv(fs.readFileSync(envFile, "utf8"));
          const measurementId = values.RUDDER_GA_MEASUREMENT_ID;

          if (!measurementId) {
            throw new Error("RUDDER_GA_MEASUREMENT_ID is not set in the Vercel production environment");
          }

          if (!/^G-[A-Z0-9]+$/.test(measurementId || "")) {
            throw new Error("Missing or invalid RUDDER_GA_MEASUREMENT_ID in the Vercel production environment");
          }

          const analyticsFile = path.join(exportDir, "ga.js");
          const source = fs.readFileSync(analyticsFile, "utf8");
          if (!source.includes(placeholder)) {
            throw new Error("GA measurement placeholder was not found in ga.js");
          }
          fs.writeFileSync(analyticsFile, source.split(placeholder).join(measurementId));

          const analyticsTag = `<script src="/ga.js?v=${encodeURIComponent(measurementId)}" defer></script>`;
          let injectedHtmlCount = 0;

          function injectAnalyticsTag(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const filePath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                injectAnalyticsTag(filePath);
                continue;
              }
              if (!entry.name.endsWith(".html")) continue;
              const html = fs.readFileSync(filePath, "utf8");
              if (html.includes(analyticsTag)) continue;
              if (!html.includes("</head>")) {
                continue;
              }
              fs.writeFileSync(filePath, html.replace("</head>", `${analyticsTag}</head>`));
              injectedHtmlCount += 1;
            }
          }
          injectAnalyticsTag(exportDir);
          if (injectedHtmlCount === 0) {
            throw new Error("Analytics tag was not injected into any exported HTML page");
          }

          function assertHtmlFlightPayloadsRemainUntouched(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const filePath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                assertHtmlFlightPayloadsRemainUntouched(filePath);
                continue;
              }
              if (!entry.name.endsWith(".html")) {
                continue;
              }
              const html = fs.readFileSync(filePath, "utf8");
              if (html.includes("self.__next_f.push") && !html.includes(placeholder)) {
                throw new Error(`GA placeholder unexpectedly missing from HTML Flight payload: ${filePath}`);
              }
            }
          }
          assertHtmlFlightPayloadsRemainUntouched(exportDir);

          console.log("Injected analytics id into ga.js.");
          NODE

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_output="$(
            vercel deploy "$RUNNER_TEMP/rudder-docs-export" \
              --prod \
              --skip-domain \
              --yes \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" \
              --meta githubCommitSha="${{ steps.tag.outputs.sha }}" \
              --meta githubCommitRef="${{ inputs.source_ref }}" \
              --meta docsChannel=production
          )"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+|[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "Could not determine Vercel deployment URL" >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Alias production domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "$DOCS_PRODUCTION_DOMAIN" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

          IFS=',' read -ra aliases <<< "$DOCS_PRODUCTION_ALIASES"
          for alias_domain in "${aliases[@]}"; do
            vercel alias set "${{ steps.deploy.outputs.deployment_url }}" "$alias_domain" \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          done

      - name: Verify production domains
        run: |
          hosts="$DOCS_PRODUCTION_DOMAIN,$DOCS_PRODUCTION_ALIASES"
          for attempt in {1..12}; do
            if DOCS_HEALTH_HOSTS="$hosts" node scripts/check-docs-public-health.mjs; then
              break
            fi
            echo "Waiting for docs production domains to serve the new alias ($attempt/12)..."
            sleep 5
          done

          DOCS_HEALTH_HOSTS="$hosts" node scripts/check-docs-public-health.mjs

          analytics_source="$(curl -fsSL -H 'Cache-Control: no-cache' "https://$DOCS_PRODUCTION_DOMAIN/ga.js")"
          page_source="$(curl -fsSL -H 'Cache-Control: no-cache' "https://$DOCS_PRODUCTION_DOMAIN/")"
          grep -F 'G-7LFL6GL5QZ' <<< "$analytics_source" >/dev/null
          grep -F '<script src="/ga.js?v=G-7LFL6GL5QZ" defer></script>' <<< "$page_source" >/dev/null
          if grep -F '__RUDDER_GA_MEASUREMENT_ID__' <<< "$analytics_source" >/dev/null; then
            echo "Production docs analytics still contains the measurement placeholder" >&2
            exit 1
          fi

      - name: Create docs release tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          current_sha="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "Tag $tag already exists at $existing_sha, not $current_sha" >&2
              exit 1
            fi
            echo "Tag $tag already exists at the published commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "docs: publish $tag"
          git push origin "refs/tags/$tag"
