name: Test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional immutable source SHA to verify with the trusted main-branch Test workflow"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan qualification profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.impact.outputs.profile }}
      qualification: ${{ steps.impact.outputs.qualification }}
      source_sha: ${{ steps.impact.outputs.source_sha }}
      source_tree_sha: ${{ steps.impact.outputs.source_tree_sha }}
      comparison_sha: ${{ steps.impact.outputs.comparison_sha }}
      changed_areas: ${{ steps.impact.outputs.changed_areas }}
      affected_scopes: ${{ steps.impact.outputs.affected_scopes }}
      required_families: ${{ steps.impact.outputs.required_families }}
      escalation_reasons: ${{ steps.impact.outputs.escalation_reasons }}
      full_qualification: ${{ steps.impact.outputs.full_qualification }}
      plan_digest: ${{ steps.impact.outputs.plan_digest }}
      run_architecture: ${{ steps.impact.outputs.run_architecture }}
      run_affected: ${{ steps.impact.outputs.run_affected }}
      run_docs: ${{ steps.impact.outputs.run_docs }}
      run_verify: ${{ steps.impact.outputs.run_verify }}
      run_native: ${{ steps.impact.outputs.run_native }}
      run_desktop: ${{ steps.impact.outputs.run_desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require exact trusted dispatch source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Resolve comparison source
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha=""
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            merge_group) base_sha="$MERGE_BASE_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              base_sha="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
              ;;
          esac
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            git cat-file -e "$base_sha^{commit}"
            echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changed paths
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          BASE_SHA: ${{ steps.comparison.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          fi

      - name: Select deterministic qualification profile
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          BASE_SHA: ${{ steps.comparison.outputs.sha }}
        run: |
          node scripts/ci-impact-plan.mjs \
            --event "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --head-tree-sha "$(git rev-parse "${HEAD_SHA}^{tree}")" \
            --files-from "$RUNNER_TEMP/changed-files.txt" \
            --output "$GITHUB_OUTPUT" \
            --report "$RUNNER_TEMP/ci-impact-plan.json"
          cat "$RUNNER_TEMP/ci-impact-plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload impact plan evidence
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-impact-plan.json
          if-no-files-found: error
          retention-days: 7

  affected:
    name: Affected qualification
    needs: plan
    if: needs.plan.outputs.run_affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CHANGED_AREAS: ${{ needs.plan.outputs.changed_areas }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies without Electron binary
        run: pnpm install --frozen-lockfile

      - name: Run affected workspace checks
        run: |
          set -euo pipefail
          has_area() { case ",$CHANGED_AREAS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          if has_area ui; then
            pnpm --filter @rudderhq/ui typecheck
            pnpm --filter @rudderhq/ui build
          fi
          if has_area server; then pnpm --filter @rudderhq/server typecheck; fi
          if has_area cli; then pnpm --filter @rudderhq/cli typecheck; fi
          if has_area identity; then pnpm --filter @rudderhq/identity typecheck; fi
          if has_area e2e || has_area ui; then
            pnpm exec playwright install chromium
            pnpm test:e2e --grep @smoke
          fi

  architecture:
    name: Architecture ratchet
    needs: plan
    if: needs.plan.outputs.run_architecture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require dispatch ref to match exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Architecture audit tests
        run: node --test scripts/architecture-audit.test.mjs scripts/architecture-boundaries.test.mjs

      - name: Declared architecture boundaries
        run: node scripts/architecture-boundaries.mjs

      - name: Reject new architecture debt
        if: needs.plan.outputs.comparison_sha != 'unknown' && needs.plan.outputs.comparison_sha != ''
        run: node scripts/architecture-audit.mjs --baseline scripts/architecture-audit-baseline.json --compare-ref "${{ needs.plan.outputs.comparison_sha }}" --fail-on-regression

      - name: Report missing initial comparison ref
        if: needs.plan.outputs.comparison_sha == 'unknown' || needs.plan.outputs.comparison_sha == ''
        run: echo "Architecture ratchet skipped because this is an initial push with no parent comparison commit."

  docs:
    name: Docs qualification
    needs: plan
    if: needs.plan.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies without Electron binary
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Docs structure
        run: pnpm docs:structure:test

      - name: Docs metadata integrity
        run: node scripts/docs-content-map.mjs integrity

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Docs search E2E
        run: pnpm test:docs-search

  verify:
    name: Verify ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.run_verify == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: full
          - os: macos-latest
            test: build
          - os: windows-latest
            test: cli-start
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        if: matrix.test == 'full'
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Ensure Electron runtime dependency
        if: matrix.test == 'full'
        run: |
          verify_electron() {
            pnpm --filter @rudderhq/desktop exec node -e "const fs = require('node:fs'); const electronPath = require('electron'); fs.accessSync(electronPath, fs.constants.X_OK)"
          }
          if ! verify_electron; then
            echo "Electron package cache is missing its platform binary; rebuilding Electron" >&2
            pnpm --filter @rudderhq/desktop rebuild electron
          fi
          verify_electron

      - name: Install dependencies without Electron binary
        if: matrix.test != 'full'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Stage Rust native binaries for Ubuntu verification
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust native binaries for Ubuntu verification
        if: matrix.os == 'ubuntu-latest'
        env:
          RUDDER_DESKTOP_TARGET_ARCH: x64
        run: |
          pnpm native:build
          echo "RUDDER_NATIVE_WORKSPACE_MANIFEST_PATH=${{ github.workspace }}/desktop/.packaged/native/x86_64-unknown-linux-gnu/rudder-native" >> "$GITHUB_ENV"

      - name: Unit tests
        if: matrix.test == 'full'
        run: pnpm test:run --maxWorkers=2

      - name: CLI start tests
        if: matrix.test == 'cli-start'
        run: pnpm -s exec vitest run cli/src/__tests__/npm-command.test.ts cli/src/__tests__/start.test.ts

      - name: Build
        env:
          RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
        run: pnpm build

  native-foundations:
    name: Native foundations ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.run_native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            extension: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            extension: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            extension: .exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            extension: ""
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_NATIVE_MODE: required
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare PostgreSQL test runtime
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"

      - name: Install Linux PostgreSQL test runtime
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          bin_dir="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Rust formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --manifest-path native/Cargo.toml --all --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests serially
        run: cargo test --manifest-path native/Cargo.toml --all-targets -- --test-threads=1

      - name: Stage native binaries
        env:
          RUDDER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: pnpm native:build

      - name: Verify staged target and protocol metadata
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_EXTENSION: ${{ matrix.extension }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const path = require("node:path");
          const target = process.env.NATIVE_TARGET;
          const extension = process.env.NATIVE_EXTENSION;
          const root = path.resolve("desktop/.packaged/native", target);
          for (const name of ["rudder-process-host", "rudder-native", "rudder-update-helper"]) {
            const binary = path.join(root, `${name}${extension}`);
            execFileSync(binary, ["--version"], { stdio: "pipe" });
          }
          const metadata = JSON.parse(execFileSync(path.join(root, `rudder-native${extension}`), ["archive", "capabilities"], { encoding: "utf8" }));
          if (metadata.ok !== true || metadata.target !== target || metadata.protocolVersion !== 1 || metadata.effectiveEngine !== "rust") {
            throw new Error(`Unexpected native metadata: ${JSON.stringify(metadata)}`);
          }
          NODE

      - name: Native policy, protocol, fallback, and public workflow tests
        env:
          RUDDER_NATIVE_PROCESS_HOST_PATH: ${{ github.workspace }}/desktop/.packaged/native/${{ matrix.target }}/rudder-process-host${{ matrix.extension }}
          RUDDER_NATIVE_ARCHIVE_PATH: ${{ github.workspace }}/desktop/.packaged/native/${{ matrix.target }}/rudder-native${{ matrix.extension }}
          RUDDER_NATIVE_EVIDENCE_INDEX_PATH: ${{ github.workspace }}/desktop/.packaged/native/${{ matrix.target }}/rudder-native${{ matrix.extension }}
          RUDDER_NATIVE_PAYLOAD_PATH: ${{ github.workspace }}/desktop/.packaged/native/${{ matrix.target }}/rudder-native${{ matrix.extension }}
          RUDDER_NATIVE_WORKSPACE_MANIFEST_PATH: ${{ github.workspace }}/desktop/.packaged/native/${{ matrix.target }}/rudder-native${{ matrix.extension }}
        run: |
          RUDDER_NATIVE_MODE=required pnpm exec vitest run \
            packages/shared/src/native-mode.test.ts \
            packages/agent-runtime-utils/src/native-process-runner.test.ts \
            cli/src/runtime/native-payload.test.ts \
            desktop/src/local-app-native-host.test.ts \
            server/src/__tests__/log-store-offsets.test.ts \
            server/src/__tests__/workspace-manifest-native.test.ts \
            server/src/__tests__/workspace-backups.test.ts
          RUDDER_NATIVE_MODE=node pnpm exec vitest run desktop/src/local-apps-runtime.test.ts

  desktop-packaged-smoke:
    name: Desktop packaged smoke macOS arm64
    needs: plan
    if: needs.plan.outputs.run_desktop == 'true'
    runs-on: macos-14
    timeout-minutes: 25
    env:
      CI: true
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require dispatch ref to match exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-arm64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-arm64-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Cache PostgreSQL runtime payload
        uses: actions/cache@v5
        with:
          path: ~/.rudder/runtime-payloads/postgres-18.4
          key: postgres-runtime-18.4-${{ runner.os }}-arm64-${{ hashFiles('desktop/scripts/prepare-postgres-runtime.mjs', '.github/workflows/ci.yml') }}

      - name: Prepare PostgreSQL runtime
        run: |
          bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"

      - name: Build packaged Desktop candidate
        env:
          RUDDER_DESKTOP_TARGET_ARCH: arm64
        run: |
          ulimit -n 65536 || ulimit -n 10240 || true
          pnpm desktop:dist

      - name: Smoke packaged account gate
        run: node desktop/scripts/smoke.mjs --mode=packaged --scenario=account-gate

      - name: Smoke packaged Rust-first Local App workflow
        env:
          RUDDER_NATIVE_MODE: required
        run: node desktop/scripts/smoke.mjs --mode=packaged --scenario=local-apps

      - name: Exercise Rust-first Workspace backup workflow
        env:
          RUDDER_NATIVE_MODE: required
          RUDDER_NATIVE_ARCHIVE_PATH: ${{ github.workspace }}/desktop/.packaged/native/aarch64-apple-darwin/rudder-native
          RUDDER_NATIVE_WORKSPACE_MANIFEST_PATH: ${{ github.workspace }}/desktop/.packaged/native/aarch64-apple-darwin/rudder-native
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/workspace-backups.spec.ts

      - name: Exercise Rust-first Agent Run process workflow
        env:
          RUDDER_NATIVE_MODE: required
          RUDDER_NATIVE_PROCESS_HOST_PATH: ${{ github.workspace }}/desktop/.packaged/native/aarch64-apple-darwin/rudder-process-host
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts tests/e2e/issue-active-run-steer.spec.ts

  qualification-summary:
    name: Qualification summary
    needs:
      - plan
      - architecture
      - affected
      - docs
      - verify
      - native-foundations
      - desktop-packaged-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected qualification families
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED_FAMILIES: ${{ needs.plan.outputs.required_families }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          QUALIFICATION: ${{ needs.plan.outputs.qualification }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          SOURCE_TREE_SHA: ${{ needs.plan.outputs.source_tree_sha }}
          COMPARISON_SHA: ${{ needs.plan.outputs.comparison_sha }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          AFFECTED_RESULT: ${{ needs.affected.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NATIVE_RESULT: ${{ needs.native-foundations.result }}
          DESKTOP_RESULT: ${{ needs.desktop-packaged-smoke.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          echo "profile=$PROFILE"
          echo "qualification=$QUALIFICATION"
          echo "source_sha=$SOURCE_SHA"
          echo "source_tree_sha=$SOURCE_TREE_SHA"
          echo "comparison_sha=$COMPARISON_SHA"
          echo "plan_digest=$PLAN_DIGEST"
          result_for() {
            case "$1" in
              architecture) echo "$ARCHITECTURE_RESULT" ;;
              affected) echo "$AFFECTED_RESULT" ;;
              docs) echo "$DOCS_RESULT" ;;
              verify) echo "$VERIFY_RESULT" ;;
              native) echo "$NATIVE_RESULT" ;;
              desktop) echo "$DESKTOP_RESULT" ;;
              *) echo "unknown" ;;
            esac
          }
          IFS=',' read -ra required <<< "$REQUIRED_FAMILIES"
          for family in "${required[@]}"; do
            result="$(result_for "$family")"
            echo "$family=$result"
            test "$result" = success || {
              echo "Required qualification family $family did not succeed: $result" >&2
              exit 1
            }
          done
          for family in architecture affected docs verify native desktop; do
            if [[ ",$REQUIRED_FAMILIES," != *",$family,"* ]]; then
              result="$(result_for "$family")"
              test "$result" = skipped || {
                echo "Non-required qualification family $family was not intentionally skipped: $result" >&2
                exit 1
              }
            fi
          done
