name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional immutable source SHA to verify with the trusted main-branch Test workflow"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  architecture:
    name: Architecture ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require dispatch ref to match exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$DISPATCH_REF_SHA" = "$SOURCE_SHA"

      - name: Architecture audit tests
        run: node --test scripts/architecture-audit.test.mjs scripts/architecture-boundaries.test.mjs

      - name: Declared architecture boundaries
        run: node scripts/architecture-boundaries.mjs

      - name: Select architecture comparison ref
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          compare_ref=""
          case "$EVENT_NAME" in
            pull_request)
              compare_ref="$PR_BASE_SHA"
              ;;
            push)
              if [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                compare_ref="$PUSH_BEFORE_SHA"
              fi
              ;;
            workflow_dispatch)
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                compare_ref="$(git rev-parse HEAD^)"
              fi
              ;;
          esac
          echo "ref=$compare_ref" >> "$GITHUB_OUTPUT"

      - name: Reject new architecture debt
        if: steps.comparison.outputs.ref != ''
        run: node scripts/architecture-audit.mjs --baseline scripts/architecture-audit-baseline.json --compare-ref "${{ steps.comparison.outputs.ref }}" --fail-on-regression

      - name: Report missing initial comparison ref
        if: steps.comparison.outputs.ref == ''
        run: echo "Architecture ratchet skipped because this is an initial push with no parent comparison commit."

  docs:
    name: Docs qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies without Electron binary
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Docs structure
        run: pnpm docs:structure:test

      - name: Docs metadata integrity
        run: node scripts/docs-content-map.mjs integrity

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Docs search E2E
        run: pnpm test:docs-search

  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: full
          - os: macos-latest
            test: build
          - os: windows-latest
            test: cli-start
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        if: matrix.test == 'full'
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Ensure Electron runtime dependency
        if: matrix.test == 'full'
        run: |
          verify_electron() {
            pnpm --filter @rudderhq/desktop exec node -e "const fs = require('node:fs'); const electronPath = require('electron'); fs.accessSync(electronPath, fs.constants.X_OK)"
          }
          if ! verify_electron; then
            echo "Electron package cache is missing its platform binary; rebuilding Electron" >&2
            pnpm rebuild electron
          fi
          verify_electron

      - name: Install dependencies without Electron binary
        if: matrix.test != 'full'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts" >&2
              exit 1
            fi
            echo "pnpm install attempt $attempt failed; retrying after backoff" >&2
            sleep $((attempt * 10))
          done

      - name: Product logic registry
        if: matrix.os == 'ubuntu-latest'
        run: pnpm product-logic:check

      - name: Product logic registry tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm product-logic:test

      - name: Unit tests
        if: matrix.test == 'full'
        run: pnpm test:run --maxWorkers=2

      - name: CLI start tests
        if: matrix.test == 'cli-start'
        run: pnpm -s exec vitest run cli/src/__tests__/start.test.ts

      - name: Build
        env:
          RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
        run: pnpm build

  desktop-packaged-smoke:
    name: Desktop packaged smoke macOS arm64
    runs-on: macos-14
    timeout-minutes: 25
    env:
      CI: true
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require dispatch ref to match exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$DISPATCH_REF_SHA" = "$SOURCE_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-arm64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-arm64-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Cache PostgreSQL runtime payload
        uses: actions/cache@v5
        with:
          path: ~/.rudder/runtime-payloads/postgres-18.4
          key: postgres-runtime-18.4-${{ runner.os }}-arm64-${{ hashFiles('desktop/scripts/prepare-postgres-runtime.mjs', '.github/workflows/ci.yml') }}

      - name: Prepare PostgreSQL runtime
        run: |
          bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"

      - name: Build packaged Desktop candidate
        env:
          RUDDER_DESKTOP_TARGET_ARCH: arm64
        run: |
          ulimit -n 65536 || ulimit -n 10240 || true
          pnpm desktop:dist

      - name: Smoke packaged account gate
        run: node desktop/scripts/smoke.mjs --mode=packaged --scenario=account-gate
