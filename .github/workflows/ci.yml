name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional immutable source SHA to verify with the trusted main-branch CI workflow"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  architecture:
    name: Architecture ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Require dispatch ref to match exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$DISPATCH_REF_SHA" = "$SOURCE_SHA"

      - name: Architecture audit tests
        run: node --test scripts/architecture-audit.test.mjs scripts/architecture-boundaries.test.mjs

      - name: Declared architecture boundaries
        run: node scripts/architecture-boundaries.mjs

      - name: Select architecture comparison ref
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          compare_ref=""
          case "$EVENT_NAME" in
            pull_request)
              compare_ref="$PR_BASE_SHA"
              ;;
            push)
              if [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                compare_ref="$PUSH_BEFORE_SHA"
              fi
              ;;
            workflow_dispatch)
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                compare_ref="$(git rev-parse HEAD^)"
              fi
              ;;
          esac
          echo "ref=$compare_ref" >> "$GITHUB_OUTPUT"

      - name: Reject new architecture debt
        if: steps.comparison.outputs.ref != ''
        run: node scripts/architecture-audit.mjs --baseline scripts/architecture-audit-baseline.json --compare-ref "${{ steps.comparison.outputs.ref }}" --fail-on-regression

      - name: Report missing initial comparison ref
        if: steps.comparison.outputs.ref == ''
        run: echo "Architecture ratchet skipped because this is an initial push with no parent comparison commit."

  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: full
          - os: macos-latest
            test: full
          - os: windows-latest
            test: cli-start
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.test == 'full'
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Product logic registry
        run: pnpm product-logic:check

      - name: Product logic registry tests
        run: pnpm product-logic:test

      - name: Docs structure
        if: matrix.os == 'ubuntu-latest' && matrix.test == 'full'
        run: pnpm docs:structure:test

      - name: Unit tests
        if: matrix.test == 'full'
        run: pnpm test:run --maxWorkers=1

      - name: Docs search E2E
        if: matrix.os == 'ubuntu-latest' && matrix.test == 'full'
        run: pnpm test:docs-search

      - name: CLI start tests
        if: matrix.test == 'cli-start'
        run: pnpm -s exec vitest run cli/src/__tests__/start.test.ts

      - name: Build
        env:
          RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
        run: pnpm build

      - name: Core work-loop smoke
        if: matrix.os == 'ubuntu-latest' && matrix.test == 'full'
        env:
          RUDDER_E2E_PRODUCTION_UI: "1"
        run: pnpm test:smoke
