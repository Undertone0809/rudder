name: Rust authority boundaries

on:
  pull_request:
    paths:
      - "native/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/rust-authority-boundaries.yml"

permissions:
  contents: read

jobs:
  native-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_NATIVE_AUTH_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:54329/native_auth_test
      RUDDER_MIGRATION_SERVICE_TEST_ADMIN_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:54329/postgres
      RUDDER_MIGRATION_APPLY_TEST_ADMIN_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:54329/postgres
      RUDDER_TEST_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
      RUDDER_TEST_PSQL: /usr/lib/postgresql/16/bin/psql
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
      - name: Start isolated loopback PostgreSQL
        run: |
          /usr/lib/postgresql/16/bin/initdb -D "$RUNNER_TEMP/rudder-native-boundaries-pg" --username=postgres --auth=trust --no-locale
          /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/rudder-native-boundaries-pg" -l "$RUNNER_TEMP/rudder-native-boundaries-pg.log" -o "-h 127.0.0.1 -p 54329 -k $RUNNER_TEMP" -w start
          /usr/lib/postgresql/16/bin/createdb -h 127.0.0.1 -p 54329 -U postgres native_auth_test
      - name: Prepare legacy auth fixture
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.RUDDER_NATIVE_AUTH_TEST_DATABASE_URL }}
        run: pnpm exec tsx src/migrate.ts
      - name: Verify native credentials and real public entry
        run: |
          for test in \
            postgres_bearer_resolution_preserves_scope_status_expiry_and_touch_contracts \
            committed_revocation_or_expiry_wins_a_concurrent_last_used_touch \
            native_pcp_member_directory_works_without_node_auth_and_fails_closed_after_revocation; do
            cargo test --locked --manifest-path native/Cargo.toml \
              -p rudder-server-foundation-core --lib "$test" -- --ignored --nocapture
          done
      - name: Verify migration locking, historical upgrade, and real backup restore
        run: |
          cargo test --locked --manifest-path native/Cargo.toml \
            -p rudder-migration-service --test postgres_apply -- --ignored --nocapture
          cargo test --locked --manifest-path native/Cargo.toml \
            -p rudder-migration-service --test apply_cli -- --ignored --nocapture
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rudder-native-boundaries-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/rudder-native-boundaries-pg" -m fast -w stop
          fi
