name: Rust D1 real-entry smoke

on:
  pull_request:
    paths:
      - ".github/workflows/rust-d1-real-entry.yml"
      - "native/**"
      - "server/**"
      - "packages/**"
      - "cli/**"
      - "scripts/acceptance/**"
      - "scripts/smoke/rust-branding-real-entry.ts"
      - "scripts/smoke/rust-project-goal-real-entry.ts"
      - "scripts/smoke/rust-project-delete-real-entry.ts"
      - "scripts/smoke/rust-project-delete-real-entry.test.ts"
      - "scripts/smoke/rust-project-create-real-entry.ts"
      - "scripts/smoke/rust-project-create-real-entry.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: rust-d1-real-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  real-entry:
    name: Rust D1 real-entry smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    services:
      issue-core-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rudder_issue_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rudder_issue_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify historical migration snapshot comparison
        run: python3 -m unittest discover -s scripts/acceptance -p 'test_compare_snapshots.py' -v

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Capture bounded failure log
        run: touch "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Install JavaScript prerequisites
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Build Rust server foundation and migration authorities
        run: |
          set -o pipefail
          cargo build --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation --bin rudder-server-foundation \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo build --locked --manifest-path native/Cargo.toml \
            --package rudder-migration-service --bin migration-preflight --bin migration-apply \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          test -x native/target/debug/rudder-server-foundation
          cargo build --locked --manifest-path native/Cargo.toml \
            --package rudder-postgres-lifecycle --bin rudder-postgres-owner \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          test -x native/target/debug/migration-preflight
          test -x native/target/debug/migration-apply
          test -x native/target/debug/rudder-postgres-owner
          cargo build --locked --manifest-path native/Cargo.toml \
            --package rudder-process-host --bin rudder-process-host \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          test -x native/target/debug/rudder-process-host

      - name: Verify public Rust domain workflows against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rudder_issue_core_test
          RUDDER_NATIVE_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rudder_issue_core_test
          RUDDER_NATIVE_MIGRATION_APPLY_PATH: ${{ github.workspace }}/native/target/debug/migration-apply
          RUDDER_HOME: ${{ runner.temp }}/rudder-public-workflow/instance-home
          RUDDER_NATIVE_HOST_ORGANIZATION_WORKSPACE_HOME: ${{ runner.temp }}/rudder-public-workflow/workspaces
          RUDDER_NATIVE_HOST_HOME_DIRECTORY: ${{ runner.temp }}/rudder-public-workflow/host-home
          RUDDER_NATIVE_HOST_RUDDER_HOME: ${{ runner.temp }}/rudder-public-workflow/instance-home
          RUDDER_NATIVE_HOST_INSTANCE_ID: ci-public-workflow
          RUDDER_NATIVE_HOST_HOSTNAME: ci-public-workflow-host
        run: |
          set -euo pipefail
          mkdir -p "$RUDDER_NATIVE_HOST_ORGANIZATION_WORKSPACE_HOME" \
            "$RUDDER_NATIVE_HOST_HOME_DIRECTORY" "$RUDDER_NATIVE_HOST_RUDDER_HOME"
          pnpm --filter @rudderhq/db migrate \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::issue_core_http_tests::public_issue_reads_and_agent_board_checkout_use_rust_without_node_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::cost_read_http_tests::native_cost_reads_revalidate_scope_and_keep_finance_events_in_rust \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::run_read_http_tests::public_run_reads_revalidate_scope_owner_and_never_fall_back \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::automation_read_http_tests::native_automation_reads_revalidate_scope_and_keep_writes_on_node \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::request_read_http_tests::native_request_reads_revalidate_scope_and_never_fall_back \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::observational_read_http_tests::native_observational_reads_cover_scope_privacy_paging_dates_and_no_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::existing_read_http_tests::native_existing_reads_keep_scope_owners_filters_artifact_streams_and_no_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::tests::messenger_read_http_tests::native_messenger_reads_cover_journey_paging_privacy_effects_and_no_node_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

          RUDDER_SECRETS_PROVIDER=local_encrypted \
          RUDDER_SECRETS_MASTER_KEY_FILE="$RUNNER_TEMP/rudder-secret-write-synthetic.key" \
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::secret_writes::http_tests::native_secret_writes_preserve_crypto_scope_receipts_rollback_and_no_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::calendar_writes::http_tests::native_calendar_writes_preserve_validation_scope_privacy_rollback_and_no_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Messenger writes and ephemeral title processes
        env:
          RUDDER_NATIVE_HOST_ORGANIZATION_WORKSPACE_HOME: ${{ runner.temp }}/rudder-public-workflow/workspaces
          RUDDER_NATIVE_HOST_HOME_DIRECTORY: ${{ runner.temp }}/rudder-public-workflow/host-home
          RUDDER_NATIVE_HOST_RUDDER_HOME: ${{ runner.temp }}/rudder-public-workflow/instance-home
          RUDDER_NATIVE_HOST_INSTANCE_ID: ci-public-workflow
          RUDDER_NATIVE_HOST_HOSTNAME: ci-public-workflow-host
          RUDDER_NATIVE_AUTH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/rudder_issue_core_test
          RUDDER_TEST_PROCESS_HOST: ${{ github.workspace }}/native/target/debug/rudder-process-host
          RUDDER_SECRETS_PROVIDER: local_encrypted
          RUDDER_SECRETS_MASTER_KEY_FILE: ${{ runner.temp }}/rudder-messenger-title-synthetic.key
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-native-chat-executor --lib messenger_title::tests::title_ \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          cargo test --locked --manifest-path native/Cargo.toml \
            --package rudder-server-foundation-core --lib \
            public_ingress::messenger_writes::http_tests::native_messenger_writes_cover_all_twenty_one_journey_privacy_titles_rollback_and_no_node_fallback \
            -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify API-wide Rust Project reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/project-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify API-wide Rust Cost and Finance reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/cost-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Request reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/request-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Activity reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/activity-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Approval, association and label reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/approval-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Overview and run workspace reads against legacy data
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/overview-read-real-entry.test.ts \
            src/__tests__/run-workspace-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust issue metadata and organization catalog reads
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/issue-metadata-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust issue checkout real-entry through Node transport and Rust authority
        env:
          RUDDER_ISSUE_CHECKOUT_TEST_DISPOSABLE: "1"
          RUDDER_SERVER_FOUNDATION_PATH: ${{ github.workspace }}/native/target/debug/rudder-server-foundation
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
        run: |
          set -o pipefail
          test "$RUDDER_ISSUE_CHECKOUT_TEST_DISPOSABLE" = "1"
          test -x "$RUDDER_SERVER_FOUNDATION_PATH"
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/issue-checkout-rust-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Rust Automation and Activity link reads
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/automation-read-real-entry.test.ts \
            src/__tests__/activity-link-read-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Verify Chat branding recovery through authenticated API and Rust
        run: |
          set -o pipefail
          pnpm exec vitest run --root server --config vitest.config.ts \
            src/__tests__/chat-branding-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Build first-party CLI for branding CLI and MCP real-entry smoke
        run: |
          set -o pipefail
          pnpm --filter @rudderhq/cli build \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Smoke Rust organization branding real entry
        run: |
          set -o pipefail
          node cli/node_modules/tsx/dist/cli.mjs \
            scripts/smoke/rust-branding-real-entry.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Smoke Rust project goal real entry
        run: |
          set -o pipefail
          node cli/node_modules/tsx/dist/cli.mjs \
            scripts/smoke/rust-project-goal-real-entry.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Smoke Rust project creation through HTTP CLI and MCP
        run: |
          set -o pipefail
          node cli/node_modules/tsx/dist/cli.mjs --test \
            scripts/smoke/rust-project-create-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          node cli/node_modules/tsx/dist/cli.mjs \
            scripts/smoke/rust-project-create-real-entry.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Smoke Rust-owned project deletion and recovery
        run: |
          set -o pipefail
          node cli/node_modules/tsx/dist/cli.mjs --test \
            scripts/smoke/rust-project-delete-real-entry.test.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"
          node cli/node_modules/tsx/dist/cli.mjs \
            scripts/smoke/rust-project-delete-real-entry.ts \
            2>&1 | tee -a "$RUNNER_TEMP/rust-d1-real-entry.log"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rust-d1-real-entry-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-d1-real-entry.log
          if-no-files-found: ignore
          retention-days: 3
