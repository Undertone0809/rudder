name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA, branch, or tag to promote as stable"
        required: true
        default: "main"
      dry_run:
        description: "Preview stable publish without publishing"
        required: true
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release-preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}

      - name: Resolve immutable release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require release source from main history
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Release source $SOURCE_SHA is not reachable from main." >&2
            exit 1
          fi

      - name: Require successful CI for exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_SHA" \
            -f status=success \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch")] | length')"
          if [ "$count" -lt 1 ]; then
            echo "No successful CI workflow found for exact source $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Release preflight
        id: release-preflight
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git checkout -B main "${{ steps.source.outputs.sha }}"
            channel="canary"
            version="$(./scripts/release.sh canary --preflight)"
          else
            channel="stable"
            version="$(./scripts/release.sh stable --preflight)"
          fi
          node scripts/release-compatibility-matrix.mjs \
            --channel "$channel" \
            --candidate-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release source: ${{ steps.source.outputs.sha }}"
          echo "Release version: $version"

  prepublish-upgrade-gate:
    name: Prepublish database and packaged upgrade gate (${{ matrix.os }})
    needs: preflight
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: bash
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      - name: Cache PostgreSQL 18.4 runtime
        uses: actions/cache@v5
        with:
          path: ~/.rudder/runtime-payloads/postgres-18.4
          key: postgres-runtime-18.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/prepare-postgres-runtime.mjs', '.github/workflows/release.yml') }}

      - name: Prepare PostgreSQL 18.4 runtime
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            runtime_arch="$(node -p 'process.arch')"
            runtime_root="${HOME}/.rudder/runtime-payloads/postgres-18.4/linux-${runtime_arch}"
            bin_dir="${runtime_root}/bin"
            if [ ! -x "${bin_dir}/postgres" ]; then
              source_url="https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
              source_sha256="81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
              source_archive="${RUNNER_TEMP}/postgresql-18.4.tar.bz2"
              source_root="${RUNNER_TEMP}/postgresql-18.4"
              build_root="${RUNNER_TEMP}/postgresql-18.4-build"
              curl --fail --location --output "${source_archive}" "${source_url}"
              actual_sha256="$(shasum -a 256 "${source_archive}" | awk '{print $1}')"
              test "${actual_sha256}" = "${source_sha256}"
              tar -xjf "${source_archive}" -C "${RUNNER_TEMP}"
              mkdir -p "${build_root}"
              cd "${build_root}"
              "${source_root}/configure" \
                --prefix="${runtime_root}" \
                --without-icu \
                --without-readline \
                --without-zlib
              make -j2
              make install
            fi
            test -f "${runtime_root}/share/postgres.bki"
            test -f "${runtime_root}/share/postgresql.conf.sample"
            test -d "${runtime_root}/share/timezone"
            test -x "${bin_dir}/pg_config"
            postgres_configure="$("${bin_dir}/pg_config" --configure)"
            if grep -q -- '--with-system-tzdata' <<< "${postgres_configure}"; then
              echo "Linux portable PostgreSQL must bundle its own timezone database." >&2
              exit 1
            fi
          else
            bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          fi
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"
          RUDDER_POSTGRES_BIN_DIR="${bin_dir}" node -e "const {execFileSync}=require('node:child_process'); const path=require('node:path'); const exe=process.platform==='win32'?'postgres.exe':'postgres'; console.log(execFileSync(path.join(process.env.RUDDER_POSTGRES_BIN_DIR, exe), ['--version'], {encoding:'utf8'}).trim())"

      - name: Verify locked migration compatibility
        shell: bash
        run: |
          channel="canary"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then channel="stable"; fi
          node scripts/release-compatibility-matrix.mjs \
            --channel "$channel" \
            --candidate-version "${{ needs.preflight.outputs.version }}"

      - name: Run database migration and recovery tests
        shell: bash
        run: pnpm --filter @rudderhq/db exec vitest run --maxWorkers=1 src/client.test.ts src/migration-manifest.test.ts

      - name: Run historical schema upgrade matrix with shaped data
        shell: bash
        run: pnpm --filter @rudderhq/db exec tsx ../../scripts/release-compatibility-runtime.ts

      - name: Run packaged upgrade smoke
        shell: bash
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            dbus-run-session -- xvfb-run --auto-servernum pnpm desktop:verify
          else
            pnpm desktop:verify
          fi

  canary:
    name: Publish npm canary
    needs:
      - preflight
      - prepublish-upgrade-gate
    if: github.event_name == 'workflow_run' && needs.prepublish-upgrade-gate.result == 'success'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-canary
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Pin canary source to main
        run: git checkout -B main "${{ needs.preflight.outputs.source_sha }}"

      - name: Locked canary preflight
        id: locked-preflight
        run: echo "version=$(./scripts/release.sh canary --preflight)" >> "$GITHUB_OUTPUT"

      - name: Locked canary migration compatibility preflight
        run: |
          node scripts/release-compatibility-matrix.mjs \
            --channel canary \
            --candidate-version "${{ steps.locked-preflight.outputs.version }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish canary
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.locked-preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh canary --skip-verify --expected-version "$version"
          git push origin "refs/tags/canary/v${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Promote canary to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/promote-npm-dist-tag.mjs \
            --version "${{ steps.publish.outputs.version }}" \
            --tag latest \
            --only-if-no-stable

  stable-dry-run:
    name: Preview stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Locked stable migration compatibility preflight
        run: |
          node scripts/release-compatibility-matrix.mjs \
            --channel stable \
            --candidate-version "${{ needs.preflight.outputs.version }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preview stable publish
        run: ./scripts/release.sh stable --dry-run --skip-verify

  stable:
    name: Publish stable release
    needs:
      - preflight
      - prepublish-upgrade-gate
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.repository == 'Undertone0809/rudder' && needs.prepublish-upgrade-gate.result == 'success'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-stable
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Locked stable migration compatibility preflight
        run: |
          node scripts/release-compatibility-matrix.mjs \
            --channel stable \
            --candidate-version "${{ needs.preflight.outputs.version }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh stable --skip-verify --expected-version "$version"
          git push origin "refs/tags/v${version}"
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Clean up obsolete canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/cleanup-obsolete-canaries.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --remote origin \
            --stable-version "${{ steps.publish.outputs.version }}"

  stable-docs:
    name: Publish stable changelog to docs production
    needs:
      - preflight
      - stable
    if: needs.stable.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/docs-production.yml
    with:
      source_ref: v${{ needs.stable.outputs.version }}
      tag_name: docs/release/v${{ needs.stable.outputs.version }}
      release_docs_approved: true
    secrets: inherit

  next-release-base:
    name: Advance next release base
    needs:
      - preflight
      - stable
      - stable-docs
    if: needs.stable.result == 'success' && needs.stable-docs.result == 'success'
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Advance main to the next patch version
        id: next-release
        run: |
          node scripts/prepare-next-release.mjs \
            --stable-version "${{ needs.stable.outputs.version }}"

      - name: Start CI for the advanced release base
        if: steps.next-release.outputs.action == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --ref main \
            -f source_sha="${{ steps.next-release.outputs.head_sha }}"
          {
            echo "### Next release base"
            echo "Version: ${{ steps.next-release.outputs.version }}"
            echo "Commit: ${{ steps.next-release.outputs.head_sha }}"
            echo "Trusted CI dispatched for ${{ steps.next-release.outputs.head_sha }}."
          } >> "$GITHUB_STEP_SUMMARY"

  public-install-smoke:
    name: Public install smoke
    needs:
      - canary
      - stable
    if: always() && (needs.canary.result == 'success' || needs.stable.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      package_spec: "@rudderhq/cli@${{ needs.canary.outputs.version || needs.stable.outputs.version }}"
      repo: ${{ github.repository }}
