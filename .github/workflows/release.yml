    name: Canary public install ${{ matrix.label }}
    needs:
      - preflight
      - publish-canary
      - mirror-canary
      - checksum-canary
    if: >-
      always() &&
      needs.publish-canary.result == 'success' &&
      ((needs.preflight.outputs.mirror_cos == 'true' &&
        needs.mirror-canary.result == 'success') ||
       (needs.preflight.outputs.mirror_cos != 'true' &&
        needs.checksum-canary.result == 'success'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
          - label: Windows x64
            runner: windows-latest
          - label: macOS arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
