name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA, branch, or tag to promote as stable"
        required: true
        default: "main"
      dry_run:
        description: "Preview stable publish without publishing"
        required: true
        type: boolean
        default: true
      confirm_stable:
        description: "For a real publish, enter PUBLISH STABLE only after explicit operator approval"
        required: false
        default: ""
        type: string
      confirm_docs:
        description: "For a real stable publish, enter PUBLISH DOCS only after explicit docs.rudderhq.dev deployment approval"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release-preflight.outputs.version }}
    steps:
      - name: Confirm stable publish authorization
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          CONFIRM_STABLE: ${{ inputs.confirm_stable }}
          CONFIRM_DOCS: ${{ inputs.confirm_docs }}
        run: |
          test "$CONFIRM_STABLE" = "PUBLISH STABLE"
          test "$CONFIRM_DOCS" = "PUBLISH DOCS"

      - name: Require release repository safeguards
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_SAFEGUARDS_CONFIGURED: ${{ vars.RELEASE_SAFEGUARDS_CONFIGURED }}
        run: |
          if [ "$RELEASE_SAFEGUARDS_CONFIGURED" != "true" ]; then
            echo "Configure npm-stable reviewers, main protection without direct-push bypass, and Actions permission to create the version-handoff PR and dispatch CI, then set RELEASE_SAFEGUARDS_CONFIGURED=true." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}

      - name: Resolve immutable release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_SHA" \
            -f status=success \
            -f per_page=100 \
            --jq '.workflow_runs | length')"
          if [ "$count" -lt 1 ]; then
            echo "No successful CI workflow found for exact source $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Release preflight
        id: release-preflight
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git checkout -B main "${{ steps.source.outputs.sha }}"
            version="$(./scripts/release.sh canary --preflight)"
          else
            version="$(./scripts/release.sh stable --preflight)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release source: ${{ steps.source.outputs.sha }}"
          echo "Release version: $version"

  canary:
    name: Publish npm canary
    needs: preflight
    if: github.event_name == 'workflow_run'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-canary
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Pin canary source to main
        run: git checkout -B main "${{ needs.preflight.outputs.source_sha }}"

      - name: Locked canary preflight
        id: locked-preflight
        run: echo "version=$(./scripts/release.sh canary --preflight)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish canary
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.locked-preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh canary --skip-verify --expected-version "$version"
          git push origin "refs/tags/canary/v${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Promote canary to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/promote-npm-dist-tag.mjs \
            --version "${{ steps.publish.outputs.version }}" \
            --tag latest \
            --only-if-no-stable

  stable-dry-run:
    name: Preview stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preview stable publish
        run: ./scripts/release.sh stable --dry-run --skip-verify

  stable:
    name: Publish stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.repository == 'Undertone0809/rudder'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-stable
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Confirm stable publish authorization
        env:
          CONFIRM_STABLE: ${{ inputs.confirm_stable }}
        run: test "$CONFIRM_STABLE" = "PUBLISH STABLE"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh stable --skip-verify --expected-version "$version"
          git push origin "refs/tags/v${version}"
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Clean up obsolete canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/cleanup-obsolete-canaries.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --remote origin \
            --stable-version "${{ steps.publish.outputs.version }}"

  stable-docs:
    name: Publish stable changelog to docs production
    needs:
      - preflight
      - stable
    if: needs.stable.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/docs-production.yml
    with:
      source_ref: v${{ needs.stable.outputs.version }}
      tag_name: docs/release/v${{ needs.stable.outputs.version }}
      release_docs_approved: true
    secrets: inherit

  next-release-base:
    name: Prepare next release base PR
    needs:
      - preflight
      - stable
      - stable-docs
    if: needs.stable.result == 'success' && needs.stable-docs.result == 'success'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare the next patch version branch
        id: next-release
        run: |
          node scripts/prepare-next-release.mjs \
            --stable-version "${{ needs.stable.outputs.version }}"

      - name: Create or reuse the next release base PR
        if: steps.next-release.outputs.action == 'updated' || steps.next-release.outputs.action == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.next-release.outputs.branch }}"
          pr_url="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): start v${{ steps.next-release.outputs.version }}" \
              --body "Automated post-release version handoff for v${{ needs.stable.outputs.version }}. This PR remains subject to normal CI and CODEOWNERS review.")"
          fi
          gh workflow run ci.yml \
            --ref "$branch" \
            -f source_sha="${{ steps.next-release.outputs.head_sha }}"
          {
            echo "### Next release base"
            echo "Version: ${{ steps.next-release.outputs.version }}"
            echo "Commit: ${{ steps.next-release.outputs.head_sha }}"
            echo "Pull request: $pr_url"
            echo "Trusted CI dispatched for ${{ steps.next-release.outputs.head_sha }}."
          } >> "$GITHUB_STEP_SUMMARY"

  public-install-smoke:
    name: Public install smoke
    needs:
      - canary
      - stable
    if: always() && (needs.canary.result == 'success' || needs.stable.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      package_spec: "@rudderhq/cli@${{ needs.canary.outputs.version || needs.stable.outputs.version }}"
      repo: ${{ github.repository }}
