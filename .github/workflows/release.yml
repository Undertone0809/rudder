  checksum-canary:
    name: Publish canary GitHub checksum marker without COS mirror
    needs:
      - preflight
      - publish-canary
      - candidate-verify
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.publish-canary.result == 'success' &&
      needs.candidate-verify.result == 'success' &&
      needs.preflight.outputs.mirror_cos != 'true'
    permissions:
      actions: read
