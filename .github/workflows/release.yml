name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Full commit SHA to promote as stable"
        required: true
      dry_run:
        description: "Preview stable publish without publishing"
        required: true
        type: boolean
        default: true
      resume_missing:
        description: "Resume a partial stable npm publish without republishing existing versions"
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: release-source-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}

jobs:
  preflight:
    name: Release preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release-preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}

      - name: Require immutable stable source SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Stable source_ref must be a full 40-character commit SHA, not a moving branch or tag." >&2
            exit 1
          fi

      - name: Resolve immutable release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require release source from main history
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Release source $SOURCE_SHA is not reachable from main." >&2
            exit 1
          fi

      - name: Require successful CI for exact source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_SHA" \
            -f status=success \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch")] | length')"
          if [ "$count" -lt 1 ]; then
            echo "No successful CI workflow found for exact source $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Release preflight
        id: release-preflight
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git checkout -B main "${{ steps.source.outputs.sha }}"
            version="$(./scripts/release.sh canary --preflight)"
          elif [ "${{ inputs.resume_missing }}" = "true" ]; then
            version="$(node -p "require('./cli/package.json').version")"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test -f "releases/v${version}.md"
          else
            version="$(./scripts/release.sh stable --preflight)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release source: ${{ steps.source.outputs.sha }}"
          echo "Release version: $version"

  resume-stable:
    name: Resume partial stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.resume_missing && !inputs.dry_run && github.repository == 'Undertone0809/rudder'
    permissions:
      actions: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-stable
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      version: ${{ steps.recovery-source.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Require locked stable source
        id: recovery-source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PREFLIGHT_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          version="$(node -p "require('./cli/package.json').version")"
          test "$version" = "$PREFLIGHT_VERSION"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Build resumable publish payloads
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          bash scripts/prepare-server-ui-dist.sh
          for pkg_dir in \
            server \
            packages/agent-runtimes/claude-local \
            packages/agent-runtimes/codex-local \
            packages/agent-runtimes/cursor-local \
            packages/agent-runtimes/gemini-local \
            packages/agent-runtimes/opencode-local; do
            rm -rf "$pkg_dir/skills"
            cp -R server/resources/bundled-skills "$pkg_dir/skills"
          done
          node scripts/release-package-map.mjs set-publish-version "$RELEASE_VERSION" --allow-source-mutation
          ./scripts/build-npm.sh --skip-checks --skip-typecheck

      - name: Publish only missing packages and create release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          package_map="$(mktemp)"
          node scripts/release-package-map.mjs list > "$package_map"
          test "$(wc -l < "$package_map" | xargs)" = "15"

          while IFS=$'\t' read -r pkg_dir pkg_name pkg_version; do
            [ -n "$pkg_dir" ] || continue
            view_error="$(mktemp)"
            if published="$(npm view "$pkg_name@$pkg_version" version 2>"$view_error")"; then
              test "$published" = "$pkg_version"
              echo "Skipping existing $pkg_name@$pkg_version"
            elif grep -q "E404" "$view_error"; then
              (cd "$pkg_dir" && npm publish --tag latest --access public --no-git-checks --provenance)
            else
              cat "$view_error" >&2
              exit 1
            fi
            rm -f "$view_error"
          done < "$package_map"

          . ./scripts/release-lib.sh
          if ! wait_for_npm_package_versions "$(cat "$package_map")" 60 5; then
            release_fail "publish completed but npm never exposed: $WAIT_FOR_NPM_PACKAGE_VERSIONS_MISSING"
          fi
          rm -f "$package_map"

          tag="v${RELEASE_VERSION}"
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [ -n "$remote_tag_sha" ]; then
            test "$remote_tag_sha" = "$SOURCE_REF"
            git tag --force "$tag" "$SOURCE_REF"
          else
            git tag "$tag" "$SOURCE_REF"
            git push origin "refs/tags/$tag"
          fi
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "$RELEASE_VERSION"
          gh workflow run desktop-release.yml --ref main -f release_tag="$tag" -f source_ref="$tag"

  canary:
    name: Publish npm canary
    needs: preflight
    if: github.event_name == 'workflow_run'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-canary
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Pin canary source to main
        run: git checkout -B main "${{ needs.preflight.outputs.source_sha }}"

      - name: Locked canary preflight
        id: locked-preflight
        run: echo "version=$(./scripts/release.sh canary --preflight)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish canary
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.locked-preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh canary --skip-verify --expected-version "$version"
          git push origin "refs/tags/canary/v${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

  canary-desktop:
    name: Wait for canary Desktop assets
    needs:
      - preflight
      - canary
    if: needs.canary.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="canary/v${{ needs.canary.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ needs.canary.outputs.version }}"

  canary-promote-latest:
    name: Promote first canary to npm latest
    needs:
      - preflight
      - canary
      - canary-desktop
    if: needs.canary.result == 'success' && needs.canary-desktop.result == 'success'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-canary
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Promote canary to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/promote-npm-dist-tag.mjs \
            --version "${{ needs.canary.outputs.version }}" \
            --tag latest \
            --only-if-no-stable

  stable-dry-run:
    name: Preview stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.resume_missing
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preview stable publish
        run: ./scripts/release.sh stable --dry-run --skip-verify

  stable:
    name: Publish stable release
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.resume_missing && github.repository == 'Undertone0809/rudder'
    permissions:
      actions: write
      contents: write
      id-token: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-stable
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.preflight.outputs.version }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh stable --skip-verify --expected-version "$version"
          git push origin "refs/tags/v${version}"
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml \
            --ref main \
            -f release_tag="$tag" \
            -f source_ref="$tag"

  stable-desktop:
    name: Wait for stable Desktop assets
    needs:
      - preflight
      - stable
      - resume-stable
    if: always() && (needs.stable.result == 'success' || needs.resume-stable.result == 'success')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
          RELEASE_VERSION: ${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}
        run: |
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "v${RELEASE_VERSION}" \
            --version "$RELEASE_VERSION"

  stable-docs:
    name: Publish stable changelog to docs production
    needs:
      - preflight
      - stable
      - resume-stable
    if: always() && (needs.stable.result == 'success' || needs.resume-stable.result == 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/docs-production.yml
    with:
      source_ref: v${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}
      tag_name: docs/release/v${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}
      release_docs_approved: true
    secrets: inherit

  canary-public-install:
    name: Canary public install smoke
    needs:
      - canary
      - canary-desktop
    if: needs.canary.result == 'success' && needs.canary-desktop.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      package_spec: "@rudderhq/cli@${{ needs.canary.outputs.version }}"
      repo: ${{ github.repository }}

  stable-public-install:
    name: Stable public install smoke
    needs:
      - stable
      - resume-stable
      - stable-desktop
    if: >-
      always() &&
      needs.stable-desktop.result == 'success' &&
      (needs.stable.result == 'success' || needs.resume-stable.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      package_spec: "@rudderhq/cli@${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}"
      repo: ${{ github.repository }}

  stable-canary-cleanup:
    name: Clean up obsolete canary releases
    needs:
      - preflight
      - stable
      - resume-stable
      - stable-desktop
    if: >-
      always() &&
      needs.stable-desktop.result == 'success' &&
      (needs.stable.result == 'success' || needs.resume-stable.result == 'success')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Clean up obsolete canary releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}
        run: |
          node scripts/cleanup-obsolete-canaries.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --remote origin \
            --stable-version "$RELEASE_VERSION"

  next-release-base:
    name: Advance next release base
    needs:
      - preflight
      - stable
      - resume-stable
      - stable-desktop
      - stable-docs
      - stable-public-install
      - stable-canary-cleanup
    if: >-
      always() &&
      (needs.stable.result == 'success' || needs.resume-stable.result == 'success') &&
      needs.stable-desktop.result == 'success' &&
      needs.stable-docs.result == 'success' &&
      needs.stable-public-install.result == 'success' &&
      needs.stable-canary-cleanup.result == 'success'
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Advance main to the next patch version
        id: next-release
        run: |
          node scripts/prepare-next-release.mjs \
            --stable-version "${{ needs.stable.outputs.version || needs.resume-stable.outputs.version }}"

      - name: Start CI for the advanced release base
        if: steps.next-release.outputs.action == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --ref main \
            -f source_sha="${{ steps.next-release.outputs.head_sha }}"
          {
            echo "### Next release base"
            echo "Version: ${{ steps.next-release.outputs.version }}"
            echo "Commit: ${{ steps.next-release.outputs.head_sha }}"
            echo "Trusted CI dispatched for ${{ steps.next-release.outputs.head_sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
