name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Full commit SHA to promote as stable"
        required: true
      dry_run:
        description: "Build and verify the release candidate without publishing"
        required: true
        type: boolean
        default: true
      mirror_cos:
        description: "Mirror Desktop packages to Tencent COS (default: disabled)"
        required: false
        type: boolean
        default: false
      resume_missing:
        description: "Resume a partial stable release without republishing existing versions"
        required: true
        type: boolean
        default: false
      candidate_run_id:
        description: "Original Release run ID containing the verified candidate artifacts (required for resume)"
        required: false
        type: string
      mirror_recovery:
        description: "Run only the COS mirror recovery against an existing stable Release"
        required: false
        type: boolean
        default: false
      skip_mirror:
        description: "Legacy compatibility alias: force Tencent COS mirroring off"
        required: false
        type: boolean
        default: false
      recovery_tag:
        description: "Existing stable tag to mirror during mirror recovery, for example v0.7.7"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Lock source and preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_recovery != 'true') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      resume: ${{ steps.release.outputs.resume }}
      candidate_run_id: ${{ steps.release.outputs.candidate_run_id }}
      candidate_external: ${{ steps.release.outputs.candidate_external }}
      workflow_source_sha: ${{ steps.candidate_validation.outputs.workflow_source_sha || github.workflow_sha }}
      qualification_run_id: ${{ steps.qualification_output.outputs.run_id }}
      mirror_cos: ${{ steps.release.outputs.mirror_cos }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}

      - name: Require immutable stable source SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Stable source_ref must be a full 40-character commit SHA." >&2
            exit 1
          }

      - name: Resolve immutable release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require release source from main history
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Resolve exact successful Test qualification
        id: qualification
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f status=completed \
            -f per_page=100 \
            --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main" and ((.event == "push") or (.event == "workflow_dispatch") or (.event == "merge_group")))) | sort_by(.updated_at) | reverse')"
          selected_run_id=""
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            if ! jq -e '.jobs[] | select(.name == "Qualification summary" and .conclusion == "success")' <<< "$jobs" >/dev/null; then
              continue
            fi
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              | jq -r --arg name "ci-impact-plan-$run_id" '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n 1)"
            [ -n "$artifact_id" ] || continue
            plan_root="$RUNNER_TEMP/qualification-plan-$run_id"
            mkdir -p "$plan_root"
            plan_zip="$RUNNER_TEMP/qualification-plan-$run_id.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$plan_zip"
            unzip -q -o "$plan_zip" -d "$plan_root"
            plan_path="$(find "$plan_root" -type f -name ci-impact-plan.json -print -quit)"
            [ -n "$plan_path" ] || continue
            if node --input-type=module - "$plan_path" "$SOURCE_SHA" "$source_tree_sha" <<'NODE'
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";

            const [planPath, sourceSha, sourceTreeSha] = process.argv.slice(2);
            const plan = JSON.parse(readFileSync(planPath, "utf8"));
            const { planDigest, ...withoutDigest } = plan;
            const expectedDigest = createHash("sha256").update(JSON.stringify(withoutDigest)).digest("hex");
            if (planDigest !== expectedDigest) throw new Error("Test impact-plan digest is invalid");
            if (plan.sourceSha !== sourceSha || plan.sourceTreeSha !== sourceTreeSha) {
              throw new Error("Test impact plan source identity does not match release source");
            }
            if (plan.qualification !== "full" || plan.fullQualification !== true) {
              throw new Error("Release promotion requires full Test qualification");
            }
            NODE
            then
              selected_run_id="$run_id"
              break
            fi
          done < <(jq -r '.[].id' <<< "$runs")
          test -n "$selected_run_id" || {
            echo "No successful full Test qualification artifact found for exact source $SOURCE_SHA." >&2
            exit 1
          }
          echo "run_id=$selected_run_id" >> "$GITHUB_OUTPUT"

      - name: Use triggering Test qualification
        id: triggering_qualification
        if: github.event_name == 'workflow_run'
        run: echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"

      - name: Resolve qualification output
        id: qualification_output
        run: |
          if [ -n "${{ steps.qualification.outputs.run_id }}" ]; then
            echo "run_id=${{ steps.qualification.outputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ steps.triggering_qualification.outputs.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact Test impact plan
        uses: actions/download-artifact@v8
        with:
          name: ci-impact-plan-${{ steps.qualification_output.outputs.run_id }}
          path: dist/qualification-plan
          run-id: ${{ steps.qualification_output.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Require exact aggregate qualification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          QUALIFICATION_RUN_ID: ${{ steps.qualification_output.outputs.run_id }}
        run: |
          set -euo pipefail
          qualification_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID")"
          test "$(jq -r '.path' <<< "$qualification_json")" = ".github/workflows/ci.yml"
          test "$(jq -r '.head_repository.full_name' <<< "$qualification_json")" = "$GITHUB_REPOSITORY"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test "$(jq -r '.head_branch' <<< "$qualification_json")" = "main"
            test "$(jq -r '.head_sha' <<< "$qualification_json")" = "$SOURCE_SHA"
          fi
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/jobs?per_page=100")"
          jq -e '.jobs[] | select(.name == "Qualification summary" and .conclusion == "success")' <<< "$jobs" >/dev/null || {
            echo "Test run $QUALIFICATION_RUN_ID has no successful Qualification summary for exact source $SOURCE_SHA." >&2
            exit 1
          }
          plan_path="$(find dist/qualification-plan -type f -name 'ci-impact-plan.json' -print -quit)"
          test -n "$plan_path"
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          node --input-type=module - "$plan_path" "$EVENT_NAME" "$SOURCE_SHA" "$source_tree_sha" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const [planPath, eventName, sourceSha, sourceTreeSha] = process.argv.slice(2);
          const plan = JSON.parse(readFileSync(planPath, "utf8"));
          const { planDigest, ...withoutDigest } = plan;
          const expectedDigest = createHash("sha256").update(JSON.stringify(withoutDigest)).digest("hex");
          if (planDigest !== expectedDigest) throw new Error("Test impact-plan digest is invalid");
          if (plan.sourceSha !== sourceSha || plan.sourceTreeSha !== sourceTreeSha) {
            throw new Error("Test impact plan source identity does not match release source");
          }
          if (plan.qualification !== "full" || plan.fullQualification !== true) {
            throw new Error("Release promotion requires full Test qualification");
          }
          if (eventName === "workflow_run" && (plan.profile !== "main_attest" || plan.event !== "push")) {
            throw new Error(`Automatic canary requires main_attest push qualification, got ${plan.profile}/${plan.event}`);
          }
          console.log(`verified\t${plan.profile}\t${plan.sourceSha}\t${plan.sourceTreeSha}\t${plan.planDigest}`);
          NODE

      - name: Resolve release identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIRROR_COS: ${{ inputs.mirror_cos }}
          SKIP_MIRROR: ${{ inputs.skip_mirror }}
          RESUME_MISSING: ${{ inputs.resume_missing }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            git checkout -B main "${{ steps.source.outputs.sha }}"
            channel="canary"
            version="$(./scripts/release.sh canary --preflight)"
            tag="canary/v${version}"
            publish="true"
            resume="false"
            candidate_external="false"
          else
            channel="stable"
            resume="${RESUME_MISSING:-false}"
            candidate_external="false"
            if [ -n "${CANDIDATE_RUN_ID:-}" ]; then candidate_external="true"; fi
            if [ "$resume" = "true" ]; then
              [[ "${CANDIDATE_RUN_ID:-}" =~ ^[0-9]+$ ]] || {
                echo "candidate_run_id is required when resume_missing is true." >&2
                exit 1
              }
              version="$(node -p "require('./cli/package.json').version")"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              test -f "releases/v${version}.md"
            else
              version="$(./scripts/release.sh stable --preflight)"
            fi
            tag="v${version}"
            if [ "${DRY_RUN:-true}" = "true" ]; then publish="false"; else publish="true"; fi
          fi
          mirror_cos="$(node scripts/release-mirror-policy.mjs)"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "resume=$resume"
            echo "candidate_run_id=${CANDIDATE_RUN_ID:-$GITHUB_RUN_ID}"
            echo "candidate_external=$candidate_external"
            echo "mirror_cos=$mirror_cos"
          } >> "$GITHUB_OUTPUT"

      - name: Require stable workflow dispatch from main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Report Tencent COS sync policy
        run: |
          if [ "${{ steps.release.outputs.mirror_cos }}" = "true" ]; then
            echo "Tencent COS package sync: ENABLED (explicit mirror_cos=true)."
          else
            echo "Tencent COS package sync: DISABLED (default or not explicitly enabled)."
          fi

      - name: Verify migration compatibility manifest
        if: steps.release.outputs.resume != 'true'
        run: >-
          node scripts/release-compatibility-matrix.mjs
          --candidate-version "${{ steps.release.outputs.version }}"
          --channel "${{ steps.release.outputs.channel }}"

      - name: Require matching verified candidate run
        id: candidate_validation
        if: steps.release.outputs.resume == 'true' || steps.release.outputs.candidate_external == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.release.outputs.candidate_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          CANDIDATE_EXTERNAL: ${{ steps.release.outputs.candidate_external }}
        run: |
          set -euo pipefail
          candidate_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r '.path' <<< "$candidate_run_json")" = ".github/workflows/release.yml"
          test "$(jq -r '.head_branch' <<< "$candidate_run_json")" = "main"
          test "$(jq -r '.head_repository.full_name' <<< "$candidate_run_json")" = "$GITHUB_REPOSITORY"
          candidate_head_sha="$(jq -r '.head_sha' <<< "$candidate_run_json")"
          [[ "$candidate_head_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$candidate_head_sha^{commit}"
          git merge-base --is-ancestor "$candidate_head_sha" refs/remotes/origin/main
          run_conclusion="$(jq -r '.conclusion' <<< "$candidate_run_json")"
          case "$run_conclusion" in
            success|cancelled|failure) ;;
            *) echo "Candidate run $CANDIDATE_RUN_ID did not produce a usable stable candidate." >&2; exit 1 ;;
          esac
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100")"
          jq -e '.jobs[] | select(.name == "Verify immutable candidate" and .conclusion == "success")' <<< "$jobs" >/dev/null || {
            echo "Candidate run $CANDIDATE_RUN_ID did not complete Verify immutable candidate successfully." >&2
            exit 1
          }
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ "$CANDIDATE_EXTERNAL" = "true" ] && [ -z "$remote_tag_sha" ]; then
            echo "Promoting a prebuilt candidate before the stable tag exists."
          else
            test -n "$remote_tag_sha"
            test "$SOURCE_SHA" = "$remote_tag_sha"
          fi
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" --jq '.artifacts | map(select(.expired == false)) | map(.name) | .[]')"
          for artifact in \
            npm-release-candidate \
            release-candidate-manifest \
            desktop-macos-x64 \
            desktop-macos-arm64 \
            desktop-windows-x64 \
            desktop-linux-x64; do
            grep -Fxq "$artifact" <<< "$artifacts" || {
              echo "Candidate run $CANDIDATE_RUN_ID is missing unexpired artifact $artifact." >&2
              exit 1
            }
          done
          manifest_artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "release-candidate-manifest" and .expired == false) | .id' | head -n 1)"
          test -n "$manifest_artifact_id"
          manifest_root="$RUNNER_TEMP/candidate-manifest-$CANDIDATE_RUN_ID"
          mkdir -p "$manifest_root"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$manifest_artifact_id/zip" > "$RUNNER_TEMP/candidate-manifest-$CANDIDATE_RUN_ID.zip"
          unzip -q -o "$RUNNER_TEMP/candidate-manifest-$CANDIDATE_RUN_ID.zip" -d "$manifest_root"
          manifest_path="$(find "$manifest_root" -type f -name candidate-manifest.json -print -quit)"
          test -n "$manifest_path"
          manifest_source_sha="$(jq -r '.source.commitSha // empty' "$manifest_path")"
          manifest_tree_sha="$(jq -r '.source.treeSha // empty' "$manifest_path")"
          manifest_workflow_sha="$(jq -r '.candidate.workflow.sourceSha // empty' "$manifest_path")"
          [[ "$manifest_source_sha" = "$SOURCE_SHA" ]]
          [[ "$manifest_tree_sha" = "$(git rev-parse "${SOURCE_SHA}^{tree}")" ]]
          [[ "$manifest_workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.candidate.workflow.path' "$manifest_path")" = ".github/workflows/release.yml"
          test "$(jq -r '.candidate.workflow.ref' "$manifest_path")" = "main"
          git cat-file -e "$manifest_workflow_sha^{commit}"
          git merge-base --is-ancestor "$manifest_workflow_sha" refs/remotes/origin/main
          echo "workflow_source_sha=$manifest_workflow_sha" >> "$GITHUB_OUTPUT"

  npm-candidate:
    name: Build npm candidate
    needs: preflight
    if: needs.preflight.outputs.resume != 'true' && needs.preflight.outputs.candidate_external != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Build publish payloads
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          bash scripts/prepare-server-ui-dist.sh
          for pkg_dir in \
            server \
            packages/agent-runtimes/claude-local \
            packages/agent-runtimes/codex-local \
            packages/agent-runtimes/cursor-local \
            packages/agent-runtimes/gemini-local \
            packages/agent-runtimes/opencode-local; do
            rm -rf "$pkg_dir/skills"
            cp -R server/resources/bundled-skills "$pkg_dir/skills"
          done
          node scripts/release-package-map.mjs set-publish-version "$RELEASE_VERSION" --allow-source-mutation
          ./scripts/build-npm.sh --skip-checks --skip-typecheck

      - name: Pack immutable npm payloads
        run: |
          mkdir -p dist/npm-payloads
          : > dist/npm-payloads/manifest.tsv
          package_map="$(mktemp)"
          node scripts/release-package-map.mjs list > "$package_map"
          test "$(wc -l < "$package_map" | xargs)" = "15"
          while IFS=$'\t' read -r pkg_dir pkg_name pkg_version; do
            [ -n "$pkg_dir" ] || continue
            pack_output="$(cd "$pkg_dir" && npm pack --json --pack-destination "$GITHUB_WORKSPACE/dist/npm-payloads" 2>&1)"
            filename="$(printf '%s\n' "$pack_output" | node scripts/parse-npm-pack-output.mjs)"
            digest="$(shasum -a 256 "dist/npm-payloads/$filename" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$pkg_name" "$pkg_version" "$filename" "$digest" >> dist/npm-payloads/manifest.tsv
          done < "$package_map"
          test "$(wc -l < dist/npm-payloads/manifest.tsv | xargs)" = "15"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-candidate
          path: dist/npm-payloads/*
          if-no-files-found: error
          retention-days: 7

  desktop-candidate:
    name: Desktop candidate ${{ matrix.platform }} ${{ matrix.arch }}
    needs: preflight
    if: needs.preflight.outputs.resume != 'true' && needs.preflight.outputs.candidate_external != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-14
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify historical migration compatibility
        run: pnpm --filter @rudderhq/db exec tsx ../../scripts/release-compatibility-runtime.ts

      - name: Cache Playwright Chromium
        if: matrix.platform != 'windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: matrix.platform != 'windows'
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      - name: Cache PostgreSQL runtime payload
        uses: actions/cache@v5
        with:
          path: ~/.rudder/runtime-payloads/postgres-18.4
          key: postgres-runtime-18.4-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/scripts/prepare-postgres-runtime.mjs', '.github/workflows/release.yml') }}

      - name: Prepare PostgreSQL runtime payload
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$MATRIX_PLATFORM" = "linux" ]; then
            runtime_root="${HOME}/.rudder/runtime-payloads/postgres-18.4/linux-${{ matrix.arch }}"
            bin_dir="${runtime_root}/bin"
            if [ ! -x "${bin_dir}/postgres" ]; then
              source_url="https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
              source_sha256="81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
              source_archive="${RUNNER_TEMP}/postgresql-18.4.tar.bz2"
              source_root="${RUNNER_TEMP}/postgresql-18.4"
              build_root="${RUNNER_TEMP}/postgresql-18.4-build"
              curl --fail --location --output "$source_archive" "$source_url"
              test "$(shasum -a 256 "$source_archive" | awk '{print $1}')" = "$source_sha256"
              tar -xjf "$source_archive" -C "$RUNNER_TEMP"
              mkdir -p "$build_root"
              cd "$build_root"
              "$source_root/configure" --prefix="$runtime_root" --without-icu --without-readline --without-zlib
              make -j2
              make install
            fi
            test -f "$runtime_root/share/postgres.bki"
            test -d "$runtime_root/share/timezone"
            postgres_configure="$("$bin_dir/pg_config" --configure)"
            ! grep -q -- '--with-system-tzdata' <<< "$postgres_configure" || {
              echo "Linux portable PostgreSQL must bundle its own timezone database." >&2
              exit 1
            }
          else
            bin_dir="$(node desktop/scripts/prepare-postgres-runtime.mjs | tail -n 1)"
          fi
          echo "RUDDER_POSTGRES_BIN_DIR=${bin_dir}" >> "$GITHUB_ENV"

      - name: Build final Desktop candidate
        env:
          RUDDER_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/release-package-map.mjs set-version "$RELEASE_VERSION"
          if [ "$(uname -s)" = "Darwin" ]; then ulimit -n 65536 || ulimit -n 10240 || true; fi
          if [ "$(uname -s)" = "Linux" ]; then
            dbus-run-session -- xvfb-run --auto-servernum pnpm desktop:dist
          else
            pnpm desktop:dist
          fi

      - name: Smoke packaged App Builder
        if: matrix.platform != 'windows'
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            dbus-run-session -- xvfb-run --auto-servernum node desktop/scripts/app-builder-smoke.mjs --packaged
          else
            node desktop/scripts/app-builder-smoke.mjs --packaged
          fi

      - name: Smoke staged PostgreSQL runtime
        if: matrix.platform != 'windows'
        run: |
          runtime_platform="linux"
          if [ "$(uname -s)" = "Darwin" ]; then runtime_platform="darwin"; fi
          staged_runtime="$GITHUB_WORKSPACE/desktop/.packaged/postgres-18.4/${runtime_platform}-${{ matrix.arch }}"
          source_runtime="$(dirname "$RUDDER_POSTGRES_BIN_DIR")"
          hidden_source_runtime="${source_runtime}.portable-smoke-hidden"
          restore_runtime() { if [ -d "$hidden_source_runtime" ]; then mv "$hidden_source_runtime" "$source_runtime"; fi; }
          trap restore_runtime EXIT
          mv "$source_runtime" "$hidden_source_runtime"
          smoke_data="$(mktemp -d "$RUNNER_TEMP/rudder-postgres-smoke.XXXXXX")"
          "$staged_runtime/bin/initdb" --pgdata="$smoke_data" --no-locale --encoding=UTF8
          "$staged_runtime/bin/pg_ctl" --pgdata="$smoke_data" --options="-h 127.0.0.1 -p 55432" --wait start
          "$staged_runtime/bin/pg_ctl" --pgdata="$smoke_data" --mode=fast --wait stop
          restore_runtime
          trap - EXIT

      - name: Smoke packaged account gate
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: node desktop/scripts/smoke.mjs --mode=packaged --scenario=account-gate

      - name: Collect verified Desktop asset
        run: |
          node scripts/collect-desktop-release-assets.mjs \
            --version "$RELEASE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --out dist/desktop-assets

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-assets/*
          if-no-files-found: error
          retention-days: 7

  candidate-complete:
    name: Candidate complete
    needs:
      - preflight
      - npm-candidate
      - desktop-candidate
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.resume != 'true' &&
      needs.preflight.outputs.candidate_external != 'true' &&
      needs.npm-candidate.result == 'success' &&
      needs.desktop-candidate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-release-candidate
          path: dist/npm-payloads
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
      - name: Collect candidate runtime identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const root = JSON.parse(readFileSync("package.json", "utf8"));
          const desktop = JSON.parse(readFileSync("desktop/package.json", "utf8"));
          const electron = desktop.devDependencies?.electron ?? desktop.dependencies?.electron ?? "unknown";
          writeFileSync("dist/runtime.json", `${JSON.stringify({
            node: process.version,
            nodeMajor: Number(process.versions.node.split(".")[0]),
            pnpm: root.packageManager ?? "pnpm@9.15.4",
            rust: "dtolnay/rust-toolchain@stable",
            electron,
            packaging: "electron-builder via pnpm desktop:dist",
          }, null, 2)}\n`);
          NODE
      - name: Create and verify immutable candidate manifest
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
          CANDIDATE_RUN_ID: ${{ needs.preflight.outputs.candidate_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ needs.preflight.outputs.workflow_source_sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          node scripts/release-candidate-manifest.mjs create \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$source_tree_sha" \
            --version "$VERSION" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --workflow-ref main \
            --runtime-file dist/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets \
            --retention-days 7 \
            --out dist/candidate-manifest.json
          mkdir -p dist/candidate-manifest
          cp dist/candidate-manifest.json dist/candidate-manifest/candidate-manifest.json
          cp dist/runtime.json dist/candidate-manifest/runtime.json
          cp dist/desktop-assets/SHASUMS256.txt dist/candidate-manifest/SHASUMS256.txt
          node scripts/release-candidate-manifest.mjs verify \
            --manifest dist/candidate-manifest/candidate-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$source_tree_sha" \
            --version "$VERSION" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --runtime-file dist/candidate-manifest/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-manifest
          path: dist/candidate-manifest/*
          if-no-files-found: error
          retention-days: 7

  candidate-verify:
    name: Verify immutable candidate
    needs:
      - preflight
      - candidate-complete
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.candidate_external == 'true' || needs.candidate-complete.result == 'success')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-manifest
          path: dist/candidate-manifest
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-release-candidate
          path: dist/npm-payloads
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, workflow, runtime, and every candidate byte
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
          CANDIDATE_RUN_ID: ${{ needs.preflight.outputs.candidate_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ needs.preflight.outputs.workflow_source_sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          cp dist/candidate-manifest/SHASUMS256.txt dist/desktop-assets/SHASUMS256.txt
          node scripts/release-candidate-manifest.mjs verify \
            --manifest dist/candidate-manifest/candidate-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$source_tree_sha" \
            --version "$VERSION" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --runtime-file dist/candidate-manifest/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets

      - name: Record candidate identity
        run: |
          echo "Source: ${{ needs.preflight.outputs.source_sha }}"
          echo "Version: ${{ needs.preflight.outputs.version }}"
          echo "Tag: ${{ needs.preflight.outputs.tag }}"
          echo "Qualification: ${{ needs.preflight.outputs.qualification_run_id }}"
          echo "Candidate: ${{ needs.preflight.outputs.candidate_run_id }}"

  publish-canary:
    name: Publish canary
    needs:
      - preflight
      - candidate-complete
      - candidate-verify
    if: >-
      needs.preflight.outputs.channel == 'canary' &&
      needs.preflight.outputs.publish == 'true' &&
      needs.candidate-verify.result == 'success'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-canary
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-release-candidate
          path: dist/npm-payloads
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-manifest
          path: dist/candidate-manifest
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate before canary publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
          CANDIDATE_RUN_ID: ${{ needs.preflight.outputs.candidate_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ needs.preflight.outputs.workflow_source_sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          cp dist/candidate-manifest/SHASUMS256.txt dist/desktop-assets/SHASUMS256.txt
          node scripts/release-candidate-manifest.mjs verify \
            --manifest dist/candidate-manifest/candidate-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$source_tree_sha" \
            --version "$VERSION" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --runtime-file dist/candidate-manifest/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets
      - name: Publish exact candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          while IFS=$'\t' read -r pkg_name pkg_version filename digest; do
            test "$(shasum -a 256 "dist/npm-payloads/$filename" | awk '{print $1}')" = "$digest"
            npm publish "dist/npm-payloads/$filename" --tag canary --access public --provenance
          done < dist/npm-payloads/manifest.tsv
          . ./scripts/release-lib.sh
          package_map="$(mktemp)"
          awk -F '\t' 'NF == 4 { print ".\t" $1 "\t" $2 }' dist/npm-payloads/manifest.tsv > "$package_map"
          test "$(wc -l < "$package_map" | xargs)" = "15"
          wait_for_npm_package_versions "$(cat "$package_map")" 60 5
          git tag "$RELEASE_TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          cd dist/desktop-assets
          test "$(find . -maxdepth 1 -type f -name 'Rudder-*' | wc -l | xargs)" = "7"
          cd "$GITHUB_WORKSPACE"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "${RELEASE_TAG##*/}" --prerelease --notes "Desktop artifacts for $RELEASE_TAG."
          else
            gh release edit "$RELEASE_TAG" --title "${RELEASE_TAG##*/}" --prerelease
          fi
          node scripts/publish-github-release-assets-immutable.mjs \
            --tag "$RELEASE_TAG" \
            --asset-dir dist/desktop-assets \
            --phase binaries

  publish-stable:
    name: Publish stable
    needs:
      - preflight
      - candidate-complete
      - candidate-verify
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.candidate-complete.result == 'success' || needs.preflight.outputs.candidate_external == 'true') &&
      needs.candidate-verify.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mirror_recovery != 'true' &&
      github.event.inputs.dry_run == 'false'
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: npm-stable
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-release-candidate
          path: dist/npm-payloads
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-manifest
          path: dist/candidate-manifest
          run-id: ${{ needs.preflight.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate before stable publication
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          QUALIFICATION_RUN_ID: ${{ needs.preflight.outputs.qualification_run_id }}
          CANDIDATE_RUN_ID: ${{ needs.preflight.outputs.candidate_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ needs.preflight.outputs.workflow_source_sha }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          cp dist/candidate-manifest/SHASUMS256.txt dist/desktop-assets/SHASUMS256.txt
          node scripts/release-candidate-manifest.mjs verify \
            --manifest dist/candidate-manifest/candidate-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$source_tree_sha" \
            --version "$VERSION" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --runtime-file dist/candidate-manifest/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets
      - name: Publish missing npm payloads
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RESUME_MISSING: ${{ needs.preflight.outputs.resume }}
        run: |
          while IFS=$'\t' read -r pkg_name pkg_version filename digest; do
            test "$(shasum -a 256 "dist/npm-payloads/$filename" | awk '{print $1}')" = "$digest"
            view_error="$(mktemp)"
            if published="$(npm view "$pkg_name@$pkg_version" version 2>"$view_error")"; then
              test "$RESUME_MISSING" = "true"
              test "$published" = "$pkg_version"
              echo "Keeping existing $pkg_name@$pkg_version"
            elif grep -q "E404" "$view_error"; then
              npm publish "dist/npm-payloads/$filename" --tag latest --access public --provenance
            else
              cat "$view_error" >&2
              exit 1
            fi
            rm -f "$view_error"
          done < dist/npm-payloads/manifest.tsv
          . ./scripts/release-lib.sh
          package_map="$(mktemp)"
          awk -F '\t' 'NF == 4 { print ".\t" $1 "\t" $2 }' dist/npm-payloads/manifest.tsv > "$package_map"
          test "$(wc -l < "$package_map" | xargs)" = "15"
          wait_for_npm_package_versions "$(cat "$package_map")" 60 5
      - name: Create immutable Release and upload verified Desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RESUME_MISSING: ${{ needs.preflight.outputs.resume }}
        run: |
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_tag_sha" ]; then
            test "$RESUME_MISSING" = "true"
            test "$remote_tag_sha" = "$SOURCE_SHA"
          else
            git tag "$RELEASE_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "$RELEASE_VERSION"
          cd dist/desktop-assets
          test "$(find . -maxdepth 1 -type f -name 'Rudder-*' | wc -l | xargs)" = "7"
          cd "$GITHUB_WORKSPACE"
          node scripts/publish-github-release-assets-immutable.mjs \
            --tag "$RELEASE_TAG" \
            --asset-dir dist/desktop-assets \
            --phase binaries

  mirror-recovery:
    name: Recover stable Desktop release mirror in Tencent COS
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_recovery == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: desktop-release-mirror
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Require immutable recovery inputs
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must be a full 40-character commit SHA for mirror recovery." >&2
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "candidate_run_id is required for mirror recovery." >&2
            exit 1
          }
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "recovery_tag must be an existing stable tag such as v0.7.7." >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git cat-file -e "$SOURCE_REF^{commit}"
          git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
      - name: Validate frozen candidate run and existing Release
        id: candidate_validation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          candidate_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r '.path' <<< "$candidate_run_json")" = ".github/workflows/release.yml"
          test "$(jq -r '.head_branch' <<< "$candidate_run_json")" = "main"
          test "$(jq -r '.head_repository.full_name' <<< "$candidate_run_json")" = "$GITHUB_REPOSITORY"
          candidate_head_sha="$(jq -r '.head_sha' <<< "$candidate_run_json")"
          [[ "$candidate_head_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$candidate_head_sha^{commit}"
          git merge-base --is-ancestor "$candidate_head_sha" refs/remotes/origin/main
          run_conclusion="$(jq -r '.conclusion' <<< "$candidate_run_json")"
          case "$run_conclusion" in
            success|cancelled|failure) ;;
            *) echo "Candidate run $CANDIDATE_RUN_ID did not produce a usable stable candidate." >&2; exit 1 ;;
          esac
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100")"
          jq -e '.jobs[] | select(.name == "Publish stable" and .conclusion == "success")' <<< "$jobs" >/dev/null || {
            echo "Candidate run $CANDIDATE_RUN_ID did not complete Publish stable successfully." >&2
            exit 1
          }
          if [ "$run_conclusion" = "failure" ]; then
            jq -e '.jobs[] | select(.name == "Mirror stable Desktop release to Tencent COS" and .conclusion == "failure")' <<< "$jobs" >/dev/null || {
              echo "Failed candidate run $CANDIDATE_RUN_ID did not fail at the stable COS mirror boundary." >&2
              exit 1
            }
          fi
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$RECOVERY_TAG" | awk '{print $1}')"
          test -n "$remote_tag_sha"
          test "$SOURCE_REF" = "$remote_tag_sha"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")"
          for artifact in \
            desktop-macos-x64 \
            desktop-macos-arm64 \
            desktop-windows-x64 \
            desktop-linux-x64; do
            jq -e --arg name "$artifact" '.artifacts[] | select(.name == $name and .expired == false)' <<< "$artifacts" >/dev/null || {
              echo "Candidate run $CANDIDATE_RUN_ID is missing unexpired artifact $artifact." >&2
              exit 1
            }
          done
          for artifact in npm-release-candidate release-candidate-manifest; do
            jq -e --arg name "$artifact" '.artifacts[] | select(.name == $name and .expired == false)' <<< "$artifacts" >/dev/null || {
              echo "Candidate run $CANDIDATE_RUN_ID is missing unexpired artifact $artifact." >&2
              exit 1
            }
          done
          manifest_artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "release-candidate-manifest" and .expired == false) | .id' | head -n 1)"
          test -n "$manifest_artifact_id"
          manifest_root="$RUNNER_TEMP/candidate-manifest-$CANDIDATE_RUN_ID"
          mkdir -p "$manifest_root"
          manifest_zip="$RUNNER_TEMP/candidate-manifest-$CANDIDATE_RUN_ID.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$manifest_artifact_id/zip" > "$manifest_zip"
          unzip -q -o "$manifest_zip" -d "$manifest_root"
          manifest_path="$(find "$manifest_root" -type f -name candidate-manifest.json -print -quit)"
          test -n "$manifest_path"
          manifest_source_sha="$(jq -r '.source.commitSha // empty' "$manifest_path")"
          manifest_tree_sha="$(jq -r '.source.treeSha // empty' "$manifest_path")"
          manifest_workflow_sha="$(jq -r '.candidate.workflow.sourceSha // empty' "$manifest_path")"
          [[ "$manifest_source_sha" = "$SOURCE_REF" ]]
          [[ "$manifest_tree_sha" = "$(git rev-parse "${SOURCE_REF}^{tree}")" ]]
          [[ "$manifest_workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.release.version' "$manifest_path")" = "${RECOVERY_TAG#v}"
          test "$(jq -r '.candidate.runId' "$manifest_path")" = "$CANDIDATE_RUN_ID"
          test "$(jq -r '.candidate.workflow.path' "$manifest_path")" = ".github/workflows/release.yml"
          test "$(jq -r '.candidate.workflow.ref' "$manifest_path")" = "main"
          git cat-file -e "$manifest_workflow_sha^{commit}"
          git merge-base --is-ancestor "$manifest_workflow_sha" refs/remotes/origin/main
          echo "workflow_source_sha=$manifest_workflow_sha" >> "$GITHUB_OUTPUT"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RECOVERY_TAG")"
          test "$(jq -r '.draft' <<< "$release_json")" = "false"
          test "$(jq -r '.prerelease' <<< "$release_json")" = "false"
          test "$(jq '[.assets[] | select(.name | startswith("Rudder-"))] | length' <<< "$release_json")" = "7"
      - name: Download frozen candidate desktop assets (attempt 1)
        id: download_candidate_assets_attempt_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download frozen candidate npm payloads
        uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: dist/npm-payloads
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download frozen candidate manifest
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-manifest
          path: dist/candidate-manifest
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download frozen candidate desktop assets (attempt 2)
        id: download_candidate_assets_attempt_2
        if: steps.download_candidate_assets_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download frozen candidate desktop assets (attempt 3)
        id: download_candidate_assets_attempt_3
        if: steps.download_candidate_assets_attempt_1.outcome == 'failure' && steps.download_candidate_assets_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop-assets
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Require frozen candidate desktop assets
        if: always()
        run: |
          test "${{ steps.download_candidate_assets_attempt_1.outcome }}" = "success" || \
            test "${{ steps.download_candidate_assets_attempt_2.outcome }}" = "success" || \
            test "${{ steps.download_candidate_assets_attempt_3.outcome }}" = "success"
          test "$(find dist/desktop-assets -maxdepth 1 -type f -name 'Rudder-*' | wc -l | xargs)" = "7"
      - name: Verify frozen candidate manifest and checksum trust root
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          source_tree_sha="$(git rev-parse "${SOURCE_REF}^{tree}")"
          cp dist/candidate-manifest/SHASUMS256.txt dist/desktop-assets/SHASUMS256.txt
          qualification_run_id="$(node -p "require('./dist/candidate-manifest/candidate-manifest.json').qualification.runId")"
          node scripts/release-candidate-manifest.mjs verify \
            --manifest dist/candidate-manifest/candidate-manifest.json \
            --source-sha "$SOURCE_REF" \
            --source-tree-sha "$source_tree_sha" \
            --version "${RECOVERY_TAG#v}" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --qualification-run-id "$qualification_run_id" \
            --workflow-source-sha "${{ steps.candidate_validation.outputs.workflow_source_sha }}" \
            --runtime-file dist/candidate-manifest/runtime.json \
            --npm-dir dist/npm-payloads \
            --desktop-dir dist/desktop-assets
      - name: Mirror frozen GitHub binaries to Tencent COS
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_CLOUD_OIDC_PROVIDER_ID: ${{ vars.TENCENT_CLOUD_OIDC_PROVIDER_ID }}
          TENCENT_CLOUD_ROLE_ARN: ${{ vars.TENCENT_CLOUD_ROLE_ARN }}
          TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
        run: |
          for attempt in 1 2 3; do
            echo "COS mirror attempt ${attempt}/3"
            set +e
            node scripts/mirror-desktop-release-to-cos.mjs \
              --tag "${{ inputs.recovery_tag }}" \
              --asset-dir dist/desktop-assets \
              --prefix releases \
              --allow-existing-checksum-marker
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 15))
          done
      - name: Verify Tencent COS multipart abort cleanup
        env:
          TENCENT_CLOUD_OIDC_PROVIDER_ID: ${{ vars.TENCENT_CLOUD_OIDC_PROVIDER_ID }}
          TENCENT_CLOUD_ROLE_ARN: ${{ vars.TENCENT_CLOUD_ROLE_ARN }}
          TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { CosReleaseMirror, getTencentStsCredentials } from './scripts/mirror-desktop-release-to-cos.mjs';

          const credentials = await getTencentStsCredentials({
            providerId: process.env.TENCENT_CLOUD_OIDC_PROVIDER_ID,
            region: process.env.TENCENT_COS_REGION,
            requestToken: process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
            requestUrl: process.env.ACTIONS_ID_TOKEN_REQUEST_URL,
            roleArn: process.env.TENCENT_CLOUD_ROLE_ARN,
            roleSessionName: `rudder-cos-abort-probe-${process.env.GITHUB_RUN_ID}`,
          });
          class AbortProbeMirror extends CosReleaseMirror {
            async abortMultipartUpload(key, uploadId) {
              const response = await this.requestObject('DELETE', key, {
                query: new URLSearchParams([['uploadId', uploadId]]),
              });
              this.abortStatus = response.status;
              await response.body?.cancel();
            }
          }

          const mirror = new AbortProbeMirror({
            bucket: process.env.TENCENT_COS_BUCKET,
            credentials,
            multipartThreshold: 1,
            region: process.env.TENCENT_COS_REGION,
          });
          const key = `releases/${process.env.RECOVERY_TAG}/Rudder-cos-abort-probe-${process.env.GITHUB_RUN_ID}.zip`;
          const file = {
            contentType: 'application/octet-stream',
            md5: '',
            name: 'Rudder-cos-abort-probe.zip',
            path: '/tmp/rudder-cos-abort-probe-file-does-not-exist',
            sha256: '0'.repeat(64),
            size: 1,
          };
          let failure;
          try {
            await mirror.mirrorFile(key, file);
          } catch (error) {
            failure = error;
          }
          if (!failure || !String(failure).includes('ENOENT')) {
            throw new Error(`Abort probe did not fail at the intended local file boundary: ${failure || 'no failure'}.`);
          }
          if (mirror.abortStatus !== 204) {
            throw new Error(`COS AbortMultipartUpload returned ${mirror.abortStatus ?? 'no status'}, expected 204.`);
          }
          const publicObject = await mirror.readObject(key, false);
          if (publicObject.status !== 404) {
            throw new Error(`Aborted COS probe object is still readable with HTTP ${publicObject.status}.`);
          }
          console.log(`verified\tabort\tcos://${process.env.TENCENT_COS_BUCKET}/${key}`);
          NODE
      - name: Publish GitHub checksum completion marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-github-release-assets-immutable.mjs \
            --tag "${{ inputs.recovery_tag }}" \
            --asset-dir dist/desktop-assets \
            --phase checksum

  mirror-canary:
