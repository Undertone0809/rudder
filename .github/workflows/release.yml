name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA, branch, or tag to promote as stable"
        required: true
        default: "main"
      dry_run:
        description: "Preview stable publish without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'push' }}
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve trusted release source
    if: >-
      github.repository == 'Undertone0809/rudder' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source commit from main history
        id: source
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
        run: |
          source_sha="$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Release source must belong to the protected main history: $SOURCE_REF" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.os }}
    needs: resolve-source
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: full
          - os: macos-latest
            test: full
          - os: windows-latest
            test: cli-start
    env:
      CI: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve-source.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        if: matrix.test == 'full'
        run: pnpm test:run --maxWorkers=1

      - name: CLI start tests
        if: matrix.test == 'cli-start'
        run: pnpm -s exec vitest run cli/src/__tests__/start.test.ts

      - name: Build
        env:
          RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
        run: pnpm build

  canary:
    name: Publish npm canary
    needs: verify
    if: github.event_name == 'push' && github.repository == 'Undertone0809/rudder' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    environment: npm-canary
    permissions:
      actions: write
      contents: write
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main "$GITHUB_SHA"

      - name: Publish canary
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(./scripts/release.sh canary --print-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh canary --skip-verify
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "refs/tags/canary/v${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          gh workflow run desktop-release.yml --ref main -f release_tag="$tag"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="canary/v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Promote canary to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/promote-npm-dist-tag.mjs \
            --version "${{ steps.publish.outputs.version }}" \
            --tag latest \
            --only-if-no-stable

  stable-dry-run:
    name: Preview stable release
    needs:
      - resolve-source
      - verify
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preview stable publish
        run: ./scripts/release.sh stable --dry-run --skip-verify

  stable:
    name: Publish stable release
    needs:
      - resolve-source
      - verify
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.repository == 'Undertone0809/rudder'
    runs-on: ubuntu-latest
    environment: npm-stable
    permissions:
      actions: write
      contents: write
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RUDDER_ALLOW_LEGACY_EMBEDDED_POSTGRES: "1"
      RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "1"
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          npm install --global npm@10.9.8
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(./scripts/release.sh stable --print-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ./scripts/release.sh stable --skip-verify
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "refs/tags/v${version}"
          PUBLISH_REMOTE=origin ./scripts/create-github-release.sh "${version}"

      - name: Start desktop release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop-release.yml --ref main -f release_tag="v${{ steps.publish.outputs.version }}"

      - name: Wait for desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_VERIFY_ATTEMPTS: "360"
        run: |
          tag="v${{ steps.publish.outputs.version }}"
          node scripts/wait-for-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$tag" \
            --version "${{ steps.publish.outputs.version }}"

      - name: Clean up obsolete canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          node scripts/cleanup-obsolete-canaries.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --remote origin \
            --stable-version "${{ steps.publish.outputs.version }}"

  public-install-smoke:
    name: Public install smoke
    needs:
      - canary
      - stable
    if: always() && (needs.canary.result == 'success' || needs.stable.result == 'success')
    uses: ./.github/workflows/public-install-smoke.yml
    with:
      package_spec: "@rudderhq/cli@${{ needs.canary.outputs.version || needs.stable.outputs.version }}"
      repo: ${{ github.repository }}
