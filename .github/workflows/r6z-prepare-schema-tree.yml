name: Prepare exact D1 schema tree
on:
  pull_request:
    paths:
      - .github/workflows/r6z-prepare-schema-tree.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const zlib = require('zlib');
            const {execFileSync} = require('child_process');
            const assert = require('assert/strict');
            const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
            const base = 'a35cc2203f8bf57b88700c9fdfa1505f1e50f393';
            const baseTree = '7d9730b49966077a75ee2d3c698f93060a1dfdf6';
            const expectedTree = '4c07511f61877ab872c1e557e7c92a13ca52e180';
            const expectedPatch = '527eedf4de258bf7e50d2922920ae85685c1f4c568125317059158749e0c27d8';
            const workflow = '.github/workflows/r6z-prepare-schema-tree.yml';
            assert.equal(git('rev-parse','HEAD'), context.payload.pull_request.head.sha);
            assert.equal(git('rev-parse','HEAD^'), base);
            assert.equal(git('rev-parse', `${base}^{tree}`), baseTree);
            assert.equal(git('diff','--name-only',base,'HEAD'), workflow);
            const chunks = [
              'a79ad57adc2974daaee1b98d9b8ebd56a1416ae8',
              'ba406937611022ef03fd334fdaa23fe2bbc7d0c6',
              '82675bb82d33ba1be8b39a193398547e7b984c3a',
              '7ba1c874cdb27d6a104e166f52453013fc824b91',
              '05e7619ae37df3a99e99e5b2b324ef19dff6f106'
            ];
            const buffers = [];
            for (const sha of chunks) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha:sha});
              assert.equal(data.sha, sha);
              assert.equal(data.encoding, 'base64');
              buffers.push(Buffer.from(data.content, 'base64'));
            }
            const compressed = Buffer.concat(buffers);
            assert.equal(compressed.length, 9233);
            const patch = zlib.inflateSync(compressed, {maxOutputLength:262144});
            assert.equal(crypto.createHash('sha256').update(patch).digest('hex'), expectedPatch);
            execFileSync('git',['apply','--index','--whitespace=error','-'],{input:patch});
            git('rm','--cached','--',workflow);
            git('diff','--cached','--check');
            assert.equal(git('write-tree'), expectedTree);
            const expectedPaths = [
              'doc/plans/2026-09-16-rust-d1-persistence.md',
              'native/crates/migration-core/tests/validation.rs',
              'packages/db/src/client.test.ts',
              'packages/db/src/migrations/0163_organization_mutations.sql',
              'packages/db/src/migrations/meta/_journal.json',
              'packages/db/src/migrations/organization-mutations.test.ts',
              'packages/db/src/schema/activity_log.ts',
              'packages/db/src/schema/index.ts',
              'packages/db/src/schema/organization_mutations.ts'
            ].sort();
            assert.deepEqual(git('diff','--cached','--name-only',base).split('\n').sort(), expectedPaths);
            const elements = [];
            for (const file of expectedPaths) {
              const content = fs.readFileSync(file, 'utf8');
              const {data} = await github.rest.git.createBlob({...context.repo,content,encoding:'utf-8'});
              assert.equal(data.sha, git('rev-parse',`:${file}`));
              elements.push({path:file,mode:'100644',type:'blob',sha:data.sha});
            }
            const {data:tree} = await github.rest.git.createTree({...context.repo,base_tree:baseTree,tree:elements});
            assert.equal(tree.sha, expectedTree);
            const output = path.join(process.env.RUNNER_TEMP,'r6z-schema-tree');
            fs.mkdirSync(output,{recursive:true});
            fs.writeFileSync(path.join(output,'candidate.json'),JSON.stringify({base,transport:context.payload.pull_request.head.sha,tree:tree.sha,patchSha256:expectedPatch,paths:expectedPaths,committed:false,branchAdvanced:false},null,2));
            core.info(`Validated candidate tree ${tree.sha}; no branch was changed.`);
      - uses: actions/upload-artifact@v7
        with:
          name: r6z-prepared-schema-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r6z-schema-tree/
          if-no-files-found: error
          retention-days: 1
