name: R6Z baseline diagnostics
on:
  pull_request:
    paths:
      - .github/workflows/r6z-baseline-diagnostics.yml
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {data}=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:104865316097});
            const text=typeof data==='string'?data:Buffer.from(data).toString('utf8');
            const lines=text.replace(/\u001b\[[0-9;]*m/g,'').split('\n');
            const selected=new Set();
            for(let i=0;i<lines.length;i++) {
              if(/FAIL |Failed Suites|Failed Tests|AssertionError|Test Files|Tests  |Unhandled Error|Error:/.test(lines[i]) && lines[i].length<2000) {
                for(let j=Math.max(0,i-2);j<Math.min(lines.length,i+20);j++) selected.add(j);
              }
            }
            for(const index of [...selected].sort((a,b)=>a-b).slice(-200)) core.info(lines[index].slice(0,1400));
            core.info('Final job lines:');
            for(const line of lines.slice(-70)) core.info(line.slice(0,1400));
