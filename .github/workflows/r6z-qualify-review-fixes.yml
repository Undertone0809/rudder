name: Qualify D1 independent review repairs
on:
  pull_request:
    paths:
      - .github/workflows/r6z-qualify-review-fixes.yml
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/r6z-120-project-goal-link-core-luna-fast-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          bin_dir="$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1 | xargs dirname)"
          test -x "$bin_dir/initdb"
          echo "RUDDER_POSTGRES_BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
      - name: Restore the exact functional source and append reviewed regressions
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='47ae2915597afa601b2ffc26d3d36f40e731754a';
            const workflow='.github/workflows/r6z-qualify-review-fixes.yml';
            assert.equal(git('rev-parse','HEAD'),context.payload.pull_request.head.sha);
            assert.equal(git('rev-parse','HEAD^'),'da4539f9eb61c94ca1335169713ce138788fd8bb');
            assert.deepEqual(git('diff','--name-only',base,'HEAD').split('\n').sort(),[
              '.github/workflows/r6z-baseline-diagnostics.yml',
              '.github/workflows/r6z-qualify-integrated-baseline.yml',workflow
            ].sort());
            git('read-tree','--reset','-u',base);
            assert.equal(git('write-tree'),'ccb123895d7d7bc05c21941d350139734ec2d806');
            const file='native/crates/d1-persistence/tests/postgres.rs';
            assert.equal(git('hash-object',file),'0d8433b65e156c91d078ab606296da306af8d3eb');
            for(const sha of ['b44ea4183b49997a308309751f7c9593b89f3d02','cec278836f765c83c78ecf880623537ae8276ee3']) {
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
              assert.equal(data.sha,sha);
              assert.equal(data.encoding,'base64');
              fs.appendFileSync(file,Buffer.from(data.content,'base64'));
            }
      - name: Reproduce the five review failures without weakening assertions
        shell: bash
        run: |
          set +e
          cargo test --manifest-path native/Cargo.toml --locked -p rudder-d1-persistence --test postgres review_ -- --test-threads=1 > "$RUNNER_TEMP/review-red.log" 2>&1
          status=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/review-red.log"
          test "$status" -ne 0
          grep -F 'test result: FAILED. 3 passed; 5 failed;' "$RUNNER_TEMP/review-red.log"
      - name: Apply the reviewed replay, snapshot and bounded-link fixes
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const path=require('path');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            async function blob(sha) {
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
              assert.equal(data.sha,sha);
              assert.equal(data.encoding,'base64');
              return Buffer.from(data.content,'base64');
            }
            const script=path.join(process.env.RUNNER_TEMP,'review-fixes.cjs');
            const scriptSha='dfc693e035b8a637d9b68c848d30e1cfb4b89364';
            fs.writeFileSync(script,await blob(scriptSha));
            assert.equal(git('hash-object',script),scriptSha);
            execFileSync('node',[script],{stdio:'inherit'});
            const transaction='native/crates/d1-persistence/src/transaction.rs';
            const original=fs.readFileSync(transaction,'utf8');
            const old='    let receipt: Receipt = serde_json::from_str(&text).map_err(|_| StoreError::InvalidReceipt)?;';
            const replacement=[
              '    let stored: Value = serde_json::from_str(&text).map_err(|_| StoreError::InvalidReceipt)?;',
              '    let receipt: Receipt = serde_json::from_value(stored.clone()).map_err(|_| StoreError::InvalidReceipt)?;',
              '    // A full receipt must not silently default omitted snapshot members.',
              '    if serde_json::to_value(&receipt).map_err(|_| StoreError::InvalidReceipt)? != stored {',
              '        return Err(StoreError::InvalidReceipt);',
              '    }'
            ].join('\n');
            assert.equal(original.split(old).length,2);
            fs.writeFileSync(transaction,original.replace(old,replacement));
            const links='native/crates/d1-persistence/src/links.rs';
            assert.equal(git('hash-object',links),'ee71599aab9eb5c893e1d1ea81b4bfc3436d0ab2');
            let source=(await blob('1f9ed35c12949afee6e17a43609be39fc94f0c71')).toString('utf8');
            assert.ok(source.endsWith('    Ok(())\n'));
            const guard='    if next_linked && !linked && goals.len() == MAX_PROJECT_GOALS {\n        return Err(StoreError::InvalidInput);\n    }\n    if next_linked {\n        goals.insert(command.goal_id.clone());';
            const combined='    if next_linked {\n        if !linked && goals.len() == MAX_PROJECT_GOALS {\n            return Err(StoreError::InvalidInput);\n        }\n        goals.insert(command.goal_id.clone());';
            assert.equal(source.split(guard).length,2);
            fs.writeFileSync(links,source.replace(guard,combined)+'}\n');
            fs.appendFileSync('native/crates/d1-persistence/tests/postgres.rs',await blob('965ddaefefac94d8642c2477d85f867df2683bf7'));
      - name: Full locked native workspace qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path native/Cargo.toml --all
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked --workspace -- --test-threads=1
      - name: Prepare the verified source objects without changing any refs
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='47ae2915597afa601b2ffc26d3d36f40e731754a';
            const files=['native/crates/d1-persistence/src/branding.rs','native/crates/d1-persistence/src/transaction.rs','native/crates/d1-persistence/src/links.rs','native/crates/d1-persistence/tests/postgres.rs'].sort();
            git('add','--',...files);
            git('diff','--cached','--check',base);
            git('diff','--exit-code');
            assert.deepEqual(git('diff','--cached','--name-only',base).split('\n').sort(),files);
            const elements=[];
            for(const file of files) {
              const {data}=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
              assert.equal(data.sha,git('hash-object',file));
              elements.push({path:file,mode:'100644',type:'blob',sha:data.sha});
            }
            const {data:tree}=await github.rest.git.createTree({...context.repo,base_tree:'ccb123895d7d7bc05c21941d350139734ec2d806',tree:elements});
            assert.equal(tree.sha,git('write-tree'));
            core.info(`QUALIFIED_REVIEW_REPAIRS=${JSON.stringify({tree:tree.sha,files:elements})}`);
            await core.summary.addHeading('D1 independent review repair qualification').addRaw(JSON.stringify({base,tree:tree.sha,files:elements,branchesChanged:false,publicAuthorityChanged:false},null,2)).write();
  diagnostics:
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId});
            const job=jobs.jobs.find(job=>job.name==='qualify');
            if(!job) throw new Error('qualification job missing');
            const {data}=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
            const text=typeof data==='string'?data:Buffer.from(data).toString('utf8');
            const lines=text.replace(/\u001b\[[0-9;]*m/g,'').split('\n');
            const selected=new Set();
            for(let i=0;i<lines.length;i++) {
              if(/FAILED|test result:|QUALIFIED_REVIEW_REPAIRS=|[Ee]rror:|error\[/.test(lines[i])) {
                for(let j=Math.max(0,i-1);j<Math.min(lines.length,i+12);j++) selected.add(j);
              }
            }
            for(const index of [...selected].sort((a,b)=>a-b).slice(-220)) core.info(lines[index].slice(0,6000));
            core.info(`Qualification conclusion: ${job.conclusion}`);
