name: Assemble reviewed R6Z integration
on:
  pull_request:
    paths:
      - .github/workflows/r6z-assemble-integration.yml
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.number == 172 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Bind integration to the reviewed main and D1 sources
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const head='e829b9d2d0d5b85fef5c2f610865271437c33466';
            const main='81cff2958923cb9009b23a457cd1b9bfcc9d4b69';
            const merge='df9fd0b92656bd09a119c9b91a751a76d707e49b';
            assert.equal(git('rev-parse','HEAD^'),head);
            assert.equal(git('diff','--name-only',head,'HEAD'),'.github/workflows/r6z-assemble-integration.yml');
            execFileSync('git',['fetch','--no-tags','origin',merge],{stdio:'inherit'});
            assert.equal(git('rev-parse',`${merge}^{tree}`),'8830e5750ba6022902f537a2d1fa2a5e987d83d5');
            git('read-tree','--reset','-u',merge);
            const source={
              'native/crates/d1-persistence/src/branding.rs':'b4d5495f46834dedfafbdf1b79ae8355483d3a27',
              'native/crates/d1-persistence/src/links.rs':'6c8c078bb106a4735e04287643f5ad07f32f84b5',
              'native/crates/d1-persistence/src/transaction.rs':'b1fc008c11ade548e5bfd7a3c37979619460c166',
              'native/crates/d1-persistence/tests/postgres.rs':'edcb36272e7437a761a9db5319ae734228a0e197'
            };
            for(const [file,sha] of Object.entries(source)) {
              git('checkout',head,'--',file);
              assert.equal(git('hash-object',file),sha);
            }
            const file='native/Cargo.lock';
            const names=[];
            const lock=fs.readFileSync(file,'utf8').split('[[package]]').map(block=>{
              const name=/^\nname = "([^"]+)"/m.exec(block)?.[1];
              if(!name?.startsWith('rudder-') || /\nsource = /.test(block) || !block.includes('\nversion = "0.7.21"\n')) return block;
              names.push(name);
              return block.replace('\nversion = "0.7.21"\n','\nversion = "0.7.22"\n');
            }).join('[[package]]');
            assert.deepEqual(names.sort(),['rudder-d1-persistence','rudder-organization-mutation-core','rudder-project-goal-link-core'].sort());
            fs.writeFileSync(file,lock);
            git('add','--',file);
            core.exportVariable('R6Z_INTEGRATED_TREE',git('write-tree'));
            const old=git('show','da4539f9eb61c94ca1335169713ce138788fd8bb:.github/workflows/r6z-qualify-integrated-baseline.yml');
            const pieces=old.split("          node --input-type=module <<'NODE'\n");
            assert.equal(pieces.length,2);
            const body=pieces[1].split('          NODE\n')[0].split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
            execFileSync('node',['--input-type=module'],{input:body,stdio:['pipe','inherit','inherit']});
      - run: pnpm install --frozen-lockfile
      - name: Reproduce inherited runtime-auto-prepare setting
        run: |
          set +e
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE=1 pnpm exec vitest run --root desktop --config vitest.config.ts scripts/stage-server.test.mjs -t 'optionally prepares PostgreSQL' > "$RUNNER_TEMP/red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$code" -ne 0
          grep -F 'requires RUDDER_POSTGRES_BIN_DIR' "$RUNNER_TEMP/red.log"
      - name: Make the preparation fixture declare its own environment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const file='desktop/scripts/stage-server.test.mjs';
          const text=fs.readFileSync(file,'utf8');
          const old='        RUDDER_DESKTOP_BUNDLE_POSTGRES_RUNTIME: "1",\n        RUDDER_FAKE_PREPARED_POSTGRES_BIN_DIR: pgBinDir,';
          assert.equal(text.split(old).length,2);
          fs.writeFileSync(file,text.replace(old,'        RUDDER_DESKTOP_BUNDLE_POSTGRES_RUNTIME: "1",\n        RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE: "0",\n        RUDDER_FAKE_PREPARED_POSTGRES_BIN_DIR: pgBinDir,'));
          NODE
      - name: Verify retained declarations and adversarial packaging fixture
        run: |
          node scripts/release-compatibility-matrix.mjs --candidate-version 0.7.22 --channel stable
          pnpm exec vitest run --root scripts --config vitest.config.ts release-compatibility-matrix.test.mjs
          RUDDER_SKIP_POSTGRES_RUNTIME_AUTO_PREPARE=1 pnpm exec vitest run --root desktop --config vitest.config.ts scripts/stage-server.test.mjs
          pnpm lint
      - name: Export exact reviewable trees
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            const assert=require('assert/strict');
            const {execFileSync}=require('child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            async function upload(file) {
              const {data}=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(file,'utf8'),encoding:'utf-8'});
              assert.equal(data.sha,git('hash-object',file));
              return {path:file,mode:'100644',type:'blob',sha:data.sha};
            }
            const d1=['native/crates/d1-persistence/src/branding.rs','native/crates/d1-persistence/src/links.rs','native/crates/d1-persistence/src/transaction.rs','native/crates/d1-persistence/tests/postgres.rs'];
            const initial=await Promise.all([...d1,'native/Cargo.lock'].map(upload));
            let {data:tree}=await github.rest.git.createTree({...context.repo,base_tree:'8830e5750ba6022902f537a2d1fa2a5e987d83d5',tree:initial});
            assert.equal(tree.sha,process.env.R6Z_INTEGRATED_TREE);
            const records=[{kind:'main-integration',tree:tree.sha,files:initial}];
            const groups=[['scripts/release-compatibility-matrix.mjs','scripts/release-compatibility-matrix.test.mjs'],['package.json'],['desktop/scripts/stage-server.test.mjs']];
            for(const files of groups) {
              const elements=await Promise.all(files.map(upload));
              const {data:next}=await github.rest.git.createTree({...context.repo,base_tree:tree.sha,tree:elements});
              tree=next;
              records.push({tree:tree.sha,files:elements});
            }
            git('add','--',...groups.flat());
            git('diff','--exit-code');
            git('diff','--cached','--check','e829b9d2d0d5b85fef5c2f610865271437c33466');
            assert.equal(tree.sha,git('write-tree'));
            core.info('ASSEMBLED_TREES='+JSON.stringify(records));
            await core.summary.addHeading('Reviewed integration source').addCodeBlock(JSON.stringify(records,null,2)).write();
