name: npm Dist Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published npm version to point the dist-tag at"
        required: true
      tag:
        description: "npm dist-tag to update"
        required: true
        default: "latest"
      dry_run:
        description: "Preview without changing npm dist-tags"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote npm dist-tag
    if: github.repository == 'Undertone0809/rudder'
    runs-on: ubuntu-latest
    environment: npm-canary
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Promote dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ ! "$PUBLISH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid npm version: $PUBLISH_VERSION" >&2
            exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid npm dist-tag: $DIST_TAG" >&2
            exit 1
          fi

          args=(--version "$PUBLISH_VERSION" --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/promote-npm-dist-tag.mjs "${args[@]}"
