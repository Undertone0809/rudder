services:
  telemetry-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TELEMETRY_POSTGRES_DB:-rudder_analytics}
      POSTGRES_USER: ${TELEMETRY_POSTGRES_ADMIN_USER:?TELEMETRY_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_ADMIN_PASSWORD:?TELEMETRY_POSTGRES_ADMIN_PASSWORD is required}
      TELEMETRY_MIGRATION_USER: ${TELEMETRY_MIGRATION_USER:?TELEMETRY_MIGRATION_USER is required}
      TELEMETRY_MIGRATION_PASSWORD: ${TELEMETRY_MIGRATION_PASSWORD:?TELEMETRY_MIGRATION_PASSWORD is required}
      TELEMETRY_COLLECTOR_USER: ${TELEMETRY_COLLECTOR_USER:?TELEMETRY_COLLECTOR_USER is required}
      TELEMETRY_COLLECTOR_PASSWORD: ${TELEMETRY_COLLECTOR_PASSWORD:?TELEMETRY_COLLECTOR_PASSWORD is required}
      TELEMETRY_ROLLUP_USER: ${TELEMETRY_ROLLUP_USER:?TELEMETRY_ROLLUP_USER is required}
      TELEMETRY_ROLLUP_PASSWORD: ${TELEMETRY_ROLLUP_PASSWORD:?TELEMETRY_ROLLUP_PASSWORD is required}
      TELEMETRY_READER_USER: ${TELEMETRY_READER_USER:-rudder_analytics_reader}
      TELEMETRY_READER_PASSWORD: ${TELEMETRY_READER_PASSWORD:?TELEMETRY_READER_PASSWORD is required}
    volumes:
      - telemetry-db:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-product-analytics-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  telemetry-migrate:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: "no"
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${TELEMETRY_MIGRATION_USER:?TELEMETRY_MIGRATION_USER is required}:${TELEMETRY_MIGRATION_PASSWORD:?TELEMETRY_MIGRATION_PASSWORD is required}@telemetry-db:5432/${TELEMETRY_POSTGRES_DB:-rudder_analytics}
      TELEMETRY_COLLECTOR_USER: ${TELEMETRY_COLLECTOR_USER:?TELEMETRY_COLLECTOR_USER is required}
      TELEMETRY_ROLLUP_USER: ${TELEMETRY_ROLLUP_USER:?TELEMETRY_ROLLUP_USER is required}
      TELEMETRY_READER_USER: ${TELEMETRY_READER_USER:?TELEMETRY_READER_USER is required}
    command: ["node", "scripts/product-analytics-migrate.mjs"]

  telemetry-collector:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      telemetry-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      RUDDER_TELEMETRY_COLLECTOR_HOST: 0.0.0.0
      RUDDER_TELEMETRY_COLLECTOR_PORT: 4318
      RUDDER_TELEMETRY_COLLECTOR_SCHEMA: rudder_analytics
      RUDDER_TELEMETRY_COLLECTOR_DATABASE_URL: postgres://${TELEMETRY_COLLECTOR_USER:?TELEMETRY_COLLECTOR_USER is required}:${TELEMETRY_COLLECTOR_PASSWORD:?TELEMETRY_COLLECTOR_PASSWORD is required}@telemetry-db:5432/${TELEMETRY_POSTGRES_DB:-rudder_analytics}
      RUDDER_TELEMETRY_COLLECTOR_MAINTENANCE_DATABASE_URL: postgres://${TELEMETRY_ROLLUP_USER:?TELEMETRY_ROLLUP_USER is required}:${TELEMETRY_ROLLUP_PASSWORD:?TELEMETRY_ROLLUP_PASSWORD is required}@telemetry-db:5432/${TELEMETRY_POSTGRES_DB:-rudder_analytics}
      RUDDER_TELEMETRY_COLLECTOR_REPORT_DATABASE_URL: postgres://${TELEMETRY_READER_USER:?TELEMETRY_READER_USER is required}:${TELEMETRY_READER_PASSWORD:?TELEMETRY_READER_PASSWORD is required}@telemetry-db:5432/${TELEMETRY_POSTGRES_DB:-rudder_analytics}
      RUDDER_TELEMETRY_COLLECTOR_DATABASE_ROLE: ${TELEMETRY_COLLECTOR_USER}
      RUDDER_TELEMETRY_COLLECTOR_EXPECTED_DATABASE_ROLE: ${TELEMETRY_COLLECTOR_USER}
      RUDDER_TELEMETRY_COLLECTOR_MAINTENANCE_DATABASE_ROLE: ${TELEMETRY_ROLLUP_USER}
      RUDDER_TELEMETRY_COLLECTOR_REPORT_DATABASE_ROLE: ${TELEMETRY_READER_USER}
      RUDDER_TELEMETRY_COLLECTOR_IDENTITY_PUBLIC_KEY: ${IDENTITY_TELEMETRY_PUBLIC_KEY:?IDENTITY_TELEMETRY_PUBLIC_KEY is required}
      RUDDER_TELEMETRY_COLLECTOR_IDENTITY_ISSUER: ${IDENTITY_TELEMETRY_ISSUER:?IDENTITY_TELEMETRY_ISSUER is required}
      RUDDER_TELEMETRY_COLLECTOR_IDENTITY_KEY_ID: ${IDENTITY_TELEMETRY_KEY_ID:?IDENTITY_TELEMETRY_KEY_ID is required}
      RUDDER_TELEMETRY_COLLECTOR_ANONYMOUS_AUTHORIZATION: ${TELEMETRY_ANONYMOUS_AUTHORIZATION:-}
      RUDDER_TELEMETRY_COLLECTOR_REPORT_SECRET: ${TELEMETRY_REPORT_SECRET:?TELEMETRY_REPORT_SECRET is required}
      RUDDER_TELEMETRY_COLLECTOR_REVOKE_SECRET: ${TELEMETRY_REVOKE_SECRET:?TELEMETRY_REVOKE_SECRET is required}
      RUDDER_TELEMETRY_COLLECTOR_CONSENT_SYNC_SECRET: ${TELEMETRY_CONSENT_SYNC_SECRET:?TELEMETRY_CONSENT_SYNC_SECRET is required}
      RUDDER_TELEMETRY_COLLECTOR_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-90}
      RUDDER_TELEMETRY_COLLECTOR_PRIVACY_THRESHOLD: ${TELEMETRY_PRIVACY_THRESHOLD:-10}
      RUDDER_TELEMETRY_COLLECTOR_ROLLUP_INTERVAL_MS: ${TELEMETRY_ROLLUP_INTERVAL_MS:-900000}
    ports:
      - "127.0.0.1:${TELEMETRY_COLLECTOR_PORT:-4318}:4318"
    command: ["node", "server/dist/product-analytics-collector-server.js"]

volumes:
  telemetry-db:
