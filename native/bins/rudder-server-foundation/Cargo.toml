[package]
name = "rudder-server-foundation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-server-foundation-core = { path = "../../crates/server-foundation" }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
libc = "0.2"
rudder-archive-core = { path = "../../crates/archive-core" }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tempfile = "3.20"
