[package]
name = "rudder-db-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
rudder-read-surfaces-core = { path = "../read-surfaces-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "macros"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
