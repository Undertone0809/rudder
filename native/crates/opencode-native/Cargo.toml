[package]
name = "rudder-opencode-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
awc = { version = "3.8.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["time"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "net", "io-util"] }
