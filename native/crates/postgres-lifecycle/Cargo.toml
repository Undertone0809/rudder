[package]
name = "rudder-postgres-lifecycle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "io-std", "signal", "sync", "net"] }
tempfile = "3.23"
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
