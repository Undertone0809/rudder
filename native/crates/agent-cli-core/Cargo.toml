[package]
name = "rudder-agent-cli-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-agent-contract-core = { path = "../agent-contract-core" }
rudder-agent-request-planner = { path = "../agent-request-planner" }
rudder-cli-mcp-contract-core = { path = "../cli-mcp-contract-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
serde_json = "1.0"
url = "2.5"
time = { version = "0.3", features = ["parsing", "formatting"] }
