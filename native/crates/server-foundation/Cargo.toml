[package]
name = "rudder-server-foundation-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
actix-web = { version = "4.11", default-features = false, features = ["macros"] }
base64 = "0.22"
rudder-archive-core = { path = "../archive-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0"
time = { version = "0.3", features = ["local-offset", "parsing"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zip = { version = "4.6", default-features = false }

[dev-dependencies]
tempfile = "3.23"
