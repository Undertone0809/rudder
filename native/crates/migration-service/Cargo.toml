[package]
name = "rudder-migration-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-migration-core = { path = "../migration-core" }
rudder-migration-history-core = { path = "../migration-history-core" }
rudder-migration-history-postgres = { path = "../migration-history-postgres" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
percent-encoding = "2.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23"
