[package]
name = "rudder-bearer-auth-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
actix-service = "2"
actix-web = { version = "4", default-features = false, features = ["macros"] }
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2"

[dev-dependencies]
rudder-agent-key-service = { path = "../agent-key-service" }
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
