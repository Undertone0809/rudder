[package]
name = "rudder-migration-history-postgres"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-migration-core = { path = "../migration-core" }
rudder-migration-history-core = { path = "../migration-history-core" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
