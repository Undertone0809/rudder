[package]
name = "rudder-cursor-acp-adapter"
version.workspace = true
edition.workspace = true
publish.workspace = true

description = "Typed, bounded Cursor ACP protocol and capability boundary"

[dependencies]
rudder-native-process-transport = { path = "../native-process-transport" }
rudder-native-protocol = { path = "../native-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1", default-features = false, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.23"
