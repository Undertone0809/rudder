[package]
name = "rudder-agent-key-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
actix-web = { version = "4.11", default-features = false, features = ["macros"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
