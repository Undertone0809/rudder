[package]
name = "rudder-hermes-acp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-native-process-transport = { path = "../native-process-transport" }
rudder-native-protocol = { path = "../native-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
