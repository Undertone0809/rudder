[package]
name = "rudder-d1-persistence"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-auth-core = { path = "../auth-core" }
getrandom = "0.2"
stacker = "0.1"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
base64 = "0.22"
regex-lite = "0.1"
url = "2.5"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
rudder-organization-mutation-core = { path = "../organization-mutation-core" }
rudder-project-goal-link-core = { path = "../project-goal-link-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt", "time"] }
uuid = { version = "1", default-features = false, features = ["v5"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
