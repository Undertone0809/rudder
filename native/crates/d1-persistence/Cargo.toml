[package]
name = "rudder-d1-persistence"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rudder-codex-app-server = { path = "../codex-app-server" }
rudder-claude-code = { path = "../claude-code" }
rudder-cursor-acp-adapter = { path = "../cursor-acp-adapter" }
rudder-auth-core = { path = "../auth-core" }
rudder-hermes-acp = { path = "../hermes-acp" }
rudder-opencode-native = { path = "../opencode-native" }
rudder-native-process-transport = { path = "../native-process-transport" }
rudder-pi-rpc = { path = "../pi-rpc" }
rudder-runtime-core = { path = "../runtime-core" }
getrandom = "0.2"
stacker = "0.1"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
base64 = "0.22"
ring = "0.17.14"
regex-lite = "0.1"
url = "2.5"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
rudder-organization-mutation-core = { path = "../organization-mutation-core" }
rudder-project-goal-link-core = { path = "../project-goal-link-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
awc = { version = "3.8.2", default-features = false, features = ["rustls-0_23-webpki-roots"] }
futures-util = "0.3"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.47", features = ["rt", "time", "process", "io-util", "net"] }
uuid = { version = "1", default-features = false, features = ["v5"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
