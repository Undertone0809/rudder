[package]
name = "rudder-agent-permissions-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
actix-web = { version = "4.11", default-features = false, features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
