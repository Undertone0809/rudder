[package]
name = "rudder-claude-code"
version.workspace = true
edition.workspace = true
publish.workspace = true

description = "Bounded Rust transport boundary for the installed Claude Code CLI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
