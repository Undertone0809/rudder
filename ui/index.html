<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rudder" />
    <title>Rudder</title>
    <!-- RUDDER_RUNTIME_BRANDING_START -->
    <!-- RUDDER_RUNTIME_BRANDING_END -->
    <!-- RUDDER_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- RUDDER_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "rudder.theme";
        const styleKey = "rudder.designStyle";
        const defaultDesignStyle = "luma";
        const baseColorKey = "rudder.baseColor";
        const accentThemeKey = "rudder.accentTheme";
        const defaultAccentTheme = "emerald";
        const darkThemeColor = "#1f1f1d";
        const lightThemeColor = "#f1f0ef";
        const darkBaseThemeColors = {
          neutral: darkThemeColor,
          stone: "#151412",
          zinc: "#141416",
          mauve: "#181316",
          olive: "#050604",
          mist: "#101617",
          taupe: "#1a1411",
        };
        const lightBaseThemeColors = {
          neutral: lightThemeColor,
          stone: "#f3f1ed",
          zinc: "#f2f2f4",
          mauve: "#f4eff3",
          olive: "#f2f1e7",
          mist: "#eef3f3",
          taupe: "#f1ece8",
        };
        const baseColors = ["neutral", "stone", "zinc", "mauve", "olive", "mist", "taupe"];
        const accentThemes = ["neutral", "amber", "blue", "cyan", "emerald", "fuchsia", "green", "indigo", "lime", "orange", "pink"];
        let theme = "system";
        let isDark = true;
        let baseColor = "neutral";
        try {
          const stored = window.localStorage.getItem(key);
          const storedStyle = window.localStorage.getItem(styleKey);
          const storedBaseColor = window.localStorage.getItem(baseColorKey);
          const storedAccentTheme = window.localStorage.getItem(accentThemeKey);
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          isDark = theme === "system" ? prefersDark : theme === "dark";
          baseColor = baseColors.includes(storedBaseColor) ? storedBaseColor : "neutral";
          document.documentElement.dataset.style =
            storedStyle === "default" || storedStyle === "mira" || storedStyle === "luma" ? storedStyle : defaultDesignStyle;
          document.documentElement.dataset.baseColor = baseColor;
          document.documentElement.dataset.themeColor = accentThemes.includes(storedAccentTheme) ? storedAccentTheme : defaultAccentTheme;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkBaseThemeColors[baseColor] : lightBaseThemeColors[baseColor]);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.style = defaultDesignStyle;
          document.documentElement.dataset.baseColor = "neutral";
          document.documentElement.dataset.themeColor = defaultAccentTheme;
          document.documentElement.style.colorScheme = "dark";
        }

        const isDesktopShell =
          typeof window !== "undefined"
          && Boolean(window.desktopShell);
        const desktopPlatform = window.desktopShell?.platform;
        const isMacDesktopShell = isDesktopShell && desktopPlatform === "darwin";
        const isWindowsDesktopShell = isDesktopShell && desktopPlatform === "win32";
        document.documentElement.classList.toggle("desktop-shell-glass", isDesktopShell);
        document.documentElement.classList.toggle("desktop-shell-macos", isMacDesktopShell);
        document.documentElement.classList.toggle("desktop-shell-windows", isWindowsDesktopShell);
        document.documentElement.style.backgroundColor = isDesktopShell
          ? "transparent"
          : (isDark ? darkBaseThemeColors[baseColor] : lightBaseThemeColors[baseColor]);
        if (isDesktopShell && typeof window.desktopShell?.setAppearance === "function") {
          void window.desktopShell.setAppearance(theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
