paired_comparison_protocol:
  purpose: 'future Node baseline versus Rust candidate only; current A3 receipts are Node-only and cannot be promoted to a Rust performance gate'
  pair_count: 7
  block_count: 7
  warmups_per_arm: 2
  order_seed: 127
  arm_order:
    - block: 1
      order: ['node_baseline', 'rust_candidate']
    - block: 2
      order: ['rust_candidate', 'node_baseline']
    - block: 3
      order: ['node_baseline', 'rust_candidate']
    - block: 4
      order: ['rust_candidate', 'node_baseline']
    - block: 5
      order: ['node_baseline', 'rust_candidate']
    - block: 6
      order: ['rust_candidate', 'node_baseline']
    - block: 7
      order: ['node_baseline', 'rust_candidate']
  balance: '4 node-first blocks and 3 rust-first blocks; both arms must be present in every complete pair'
  cache_and_host_rules:
    - 'Use the same source data manifest, fixed anchor, scale, projection, warmups, iteration count, platform, power mode, and filesystem for both arms.'
    - 'Run one campaign without unrelated benchmark producers; record host load and thermal/power state as observed.'
    - 'Restart or cold-start both arms according to the case definition; do not mix cold and warm observations.'
    - 'Discard a block when source, runtime, fixture, process set, correctness, timeout, cancellation, or cleanup identity differs.'

measurement_rules:
  latency:
    source: 'performance.now() timings emitted by the Node harness'
    summaries: ['p50', 'p95', 'max']
    p99: 'not emitted by the current harness; do not infer p99 from max or from seven aggregate runs'
  payload:
    source: 'serializedBytes for response projections'
    response_rows: 'recorded per named response in the harness JSON'
    serialization_time: 'not separated from service timing by the current harness'
  memory:
    source: 'process.memoryUsage() before and after measured iterations'
    metrics: ['heapUsedBytes delta', 'rssBytes delta']
    peak_process_tree_rss: 'not sampled by the current harness; do not rename RSS delta as peak RSS'
    memory_time: 'not emitted; future comparator must integrate sampled process RSS over monotonic time'
  cpu:
    process_cpu_time: 'not emitted by the current harness'
    event_loop_delay: 'not emitted by the current harness'
  lifecycle:
    cold_start: 'not emitted; migrations and seeding occur outside measured path timing'
    throughput: 'not emitted as an open-loop rate; derive only from a future receipt that exposes total elapsed time and completed operations'
    errors: 'read-only success path only; correctness gates and process exit are recorded'
    cancellation: 'not exercised by this harness'
    timeout: 'not exercised by this harness'
  correctness:
    hard_gates:
      - 'exact response counts'
      - 'expected id set and uniqueness'
      - 'timestamp/id ordering'
      - 'parent linkage'
      - 'organization scope'
      - 'neighbor organization isolation for thread-heavy'
    promotion_rule: 'any failed correctness gate, leaked organization token, process failure, cleanup failure, cancellation failure, or timeout failure makes the trial non-comparable and blocks promotion'

noise_and_regression_policy:
  noise_budget:
    latency_and_cpu: '10 percent relative to the Node baseline'
    rss_and_memory_time: '10 percent relative to the Node baseline'
    cold_start: '15 percent relative to the Node baseline'
    throughput: '10 percent relative to the Node baseline'
    interpretation: 'A difference inside the budget is descriptive and not a win; a gate requires the confidence interval to clear the threshold.'
  confidence_interval:
    method: 'paired bootstrap over seven complete counterbalanced blocks'
    resamples: 10000
    level: '95 percent'
    seed: 127
    statistic: 'per-block p95 and p50 difference; report absolute and baseline-relative values'
  regression_rule:
    latency: 'regression when the 95 percent CI lower bound for candidate minus baseline exceeds +10 percent relative'
    rss_or_memory_time: 'regression when the 95 percent CI lower bound exceeds +10 percent relative'
    cold_start: 'regression when the 95 percent CI lower bound exceeds +15 percent relative'
    throughput: 'regression when the 95 percent CI upper bound for candidate minus baseline is below -10 percent relative'
    correctness_and_reliability: 'any new error, cancellation, timeout, cleanup failure, or correctness violation is a hard failure regardless of latency'
    no_claim: 'No regression or improvement claim is valid without seven complete paired blocks, current candidate identity, and a comparable process set.'

