unknowns_and_risks:
  - id: unknown.dynamic_http_handlers
    fact: "Better Auth app.all and UI regex fallbacks are not represented by a static REST path list."
    impact: "Actix route inventory must preserve generic auth callback methods and optional UI serving behavior."
    next_evidence: "B1/B2 contract inventory and release-set compatibility tests."
  - id: unknown.direct_writes_outside_transactions
    fact: "The transaction scan identifies 185 production transaction calls; the known direct-write exceptions are now classified as writer.bootstrap_ceo_invite (production, non-transactional revoke/insert boundary) and executable.packages_db_seed (development-only, intentionally non-transactional). The scan still does not prove that every remaining Drizzle write is inside a transaction."
    impact: "G0 must preserve the two classified boundaries and pair this inventory with a complete mutation/writer scan before selecting a Rust vertical slice; no unclassified bootstrap helper or packages/db executable is hidden behind this residual risk."
    next_evidence: "A2/B1 contract and writer audit, plus SQLx query ownership tests for remaining direct writes."
  - id: unknown.private_listener_cutover
    fact: "Product analytics collector has its own listener, DB roles, maintenance loop, and routes."
    impact: "A public-listener claim is false if the collector is omitted from release-set accounting."
    next_evidence: "A4/release-set inventory and collector deployment verification."
  - id: unknown.external_process_lifecycle
    fact: "Adapter subprocesses, shell commands, native archive helper, and Feishu transport may own state outside the main Node process."
    impact: "Rust cutover needs explicit process kill, lease, recovery, and compatibility gates."
    next_evidence: "A3 runtime baseline and E execution/adapter migration."
  - id: unknown.fire_and_forget_dispatch_recovery
    fact: "Issue comment and issue mutation wakeup delivery, automatic chat-title generation, hire-approval adapter hooks, Browser/Computer activity projections, and automation chat-output execution are launched in-process after the request/dispatch path; ordinary failures are log-only and these paths do not expose a durable worker queue or process-shutdown drain in the inventoried sources."
    impact: "A Rust cutover can silently lose wakeups, title updates, hire notifications, activity receipts, or duplicate automation chat execution unless admission, retry/recovery, shutdown, and ownership semantics are explicitly fenced."
    next_evidence: "B1/B3 writer contract and runtime cutover tests for issue create/update/checkout wakeups, comment wake, title generation, hire hooks, Browser/Computer activity, automation dispatch, process restart, and graceful shutdown."
  - id: unknown.backup_mutation_fence
    fact: "Backup inspect/list/download are read-only candidates; create/delete/restore are stateful filesystem/database mutations."
    impact: "Do not include backup mutations in C without the dedicated serial-claim/recovery/rollback fence."
    next_evidence: "Dedicated fenced backup mutation Issue."

handoff:
  first_read_only_vertical_slice:
    - "Health and instance capability reads."
    - "Organization/project/agent/adapter availability reads with organization authorization."
    - "Issue/run/activity reads and live-run/event reads."
    - "No create/update/delete, checkout, wakeup, review, backup mutation, or external adapter execution."
  prerequisites_before_mutation:
    - "Freeze API/CLI/MCP contracts and generated bindings."
    - "Establish Actix/Tokio/SQLx lifecycle and writer fencing."
    - "Implement Rust read-only route/auth/organization-scope parity."
    - "Create a dedicated backup mutation fence covering serial claim, pre-restore backup, filesystem ownership, activity receipt, crash recovery, and rollback."
    - "Keep Electron as the desktop shell and keep plugin implementation runtime out of scope."
  next_issue: "G0 baseline freeze after A1, A2, A3, and A4 each publish accepted evidence."
  parent_status: "R6Z-120 remains open; this child only unlocks baseline reconciliation."

