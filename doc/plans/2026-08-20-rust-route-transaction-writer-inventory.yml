http_streaming:
  - id: stream.chat_messages_ndjson
    authority_state: node_express_current
    source:
      - server/src/routes/chats.stream-routes.ts:302-508
      - server/src/routes/chats.stream-routes.ts:735-1007
      - server/src/routes/chats.stream-routes.ts:1115-1210
    endpoints:
      - "POST /chats/:id/messages/stream"
      - "POST /orgs/:orgId/chats/messages/stream"
    organization_scope: "Conversation access is asserted before generation creation; the org-scoped first-turn endpoint creates the conversation within the authorized organization and reuses the same stream handler."
    protocol:
      content_type: "application/x-ndjson; charset=utf-8"
      cache_headers: ["Cache-Control: no-cache, no-transform", "X-Accel-Buffering: no"]
      status_codes: [201, 202]
      event_types:
        - "ack: atomic first-turn conversation and user message"
        - "queued: queued message accepted without an active generation"
        - "transcript_entry: ordered visible transcript projection with generationId, attemptEpoch, generationSeq, and bodyHash"
        - "final: durable assistant message projection and completed generation"
        - "error: recoverable or runtime failure with errorCode, runId, and messageId when available"
    lifecycle_and_fencing:
      - "Generation claim and startup gate serialize one active generation per conversation."
      - "Output admission is serialized; visible transcript/runtime output is appended and projected before it is emitted."
      - "Client checkpoint records the rendered generation sequence and hash; stop records a control action, freezes the admitted body/transcript cutoff, and persists a stopped assistant projection."
      - "Abort or response close marks clientClosed, suppresses further writes, and leaves terminal durability/recovery to generation protocol finalization."
      - "The finally path records terminal evidence, marks queued delivery terminal, releases generation ownership, and wakes the server queue."
    durable_side_effects:
      - "Chat user/assistant messages, generation rows/events, transcript projections, run linkage, terminal outbox/effects, queued-message delivery state, and activity receipts."
    candidate_rust_authority: rust_pending
    retirement_gate: "Actix streaming parity must preserve both endpoints, NDJSON event ordering and terminal semantics, organization isolation, checkpoint/stop epochs and hashes, disconnect/abort behavior, durable projection/outbox writes, and no writes after client close."
    evidence_status: source_verified

