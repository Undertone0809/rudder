blockers:
  - id: P0-main-drift-candidate
    owner: migration_implementation
    state: resolved
    detail: origin/main advanced from b4c2f46966d080a18b8ce8d9545e427aa5b50ced to d1f55c5c180901392804178aa44b3ba3f077a6cb. Desktop update/quit, child-launch, UI status/live-run, and E2E changes were reconciled in /private/tmp/rudder-rust-main-reconcile-20260922-v4; the current v15 candidate source tree is fdbb1b03349290a8b41b050ccb63848575242dda and prior receipts are invalid.
    next_step: commit and push v15 after exact identity and validator checks, then refresh Main before the next slice.
  - id: P0-node-writer-fence
    owner: migration_implementation
    state: open
    detail: The current candidate fences scalar organization branding plus organization update/archive/delete, Project CRUD/resources/workspaces, Issue counter creation, asset DB projection, Issue attachment DB projection, cost ledger, selected Chat projections, budget policy delete, and all 17 mutating methods in server/src/services/goals.ts. Those selected writers acquire the organization mutation row lock before their first business write and hold it through commit; the token is validated as the identity of the locked epoch, not embedded in every business-table predicate. Goal route/issue projection bypasses and the semantic inventory still has unfenced or row-only approval, comment, attachment storage, portability, onboarding, organization skills/plugins, budget/settings, automation, heartbeat, workspace/runtime, and background writers.
    next_step: finish the exact writer inventory, prove the serialized owner-lock contract for every selected writer, and make every competing writer acquire the same lock before its first business write, or drain and remove it from the default path.
  - id: P1-d1-secondary-writers
    owner: migration_implementation
    state: open
    detail: D1 still has direct or indirect legacy writers outside the currently fenced services, including Goal route and issue projection bypasses, approval state machines, issue comments, attachment and avatar storage, Chat operation approvals, Side Chat and inline visual persistence, portability import, onboarding, skills/plugins, budget/settings transitions, automation dispatch, heartbeat/workspace runtime, and activity/wakeup side effects.
    next_step: enumerate each writer and its external side effects, add storage/process orphan recovery where needed, then fence it before any Rust owner activation or explicitly remove it from the default path.
  - id: P1-project-goal-replacement-contract
    owner: migration_implementation
    state: private_slice_complete_default_entry_blocked
    detail: The complete Rust goal-set replacement command, SQLx transaction, supported Node bridge, direct CLI/MCP HTTP entry, and disposable real-entry probe pass success/replay/conflict/target-isolation/audit readback checks. Atomic explicit allowlist handoff and direct MCP project creation now have focused negative coverage; installed/default entry and competing-writer retirement remain open.
    next_step: obtain fresh stage review and exact-candidate verifier PASS, then continue the writer fence/token inventory before any owner handoff.
  - id: P1-signed-actor-envelope
    owner: migration_implementation
    state: open
    detail: Mutation envelopes now bind the idempotency key to the signed request and reject header substitution before business writes; full auth migration, session membership, and revocation authority remain later than D1.
    next_step: extend the signed bridge proof to server-owned session membership, revocation, expiry, replay, and public Actix request extraction.
  - id: P1-single-public-listener
    owner: migration_implementation
    state: open
    detail: Node owns the current listener while Actix is private; the supported startup has not yet selected a sole public socket.
    next_step: record one listener topology and prove no duplicate public listener.
  - id: P1-audit-atomicity
    owner: migration_implementation
    state: open
    detail: Scalar branding now proves business state, receipt, activity, and outbox rollback/commit within the SQLx transaction; broader D1 projections and background effects still lack the same atomic boundary.
    next_step: extend the same effect boundary and add audit-failure/process-recovery evidence for Project-Goal and every subsequent authority unit.
  - id: P1-node-fallback
    owner: migration_implementation
    state: open
    detail: Project-Goal MCP create/update now use direct HTTP and explicit missing-binary checks fail closed; general first-party MCP/native process paths still select bundled Node implementations in fallback modes.
    next_step: finish the manifest-wide static/runtime negative scan and migrate the next disjoint first-party tool slice.
