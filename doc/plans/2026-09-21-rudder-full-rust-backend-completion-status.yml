blockers:
  - id: P0-main-drift-candidate
    owner: migration_implementation
    state: resolved
    detail: origin/main advanced from the migration base to c67ce0f00bb78e323068caac4a9ae349f863c9da. The six Main commits were rebased onto the migration checkpoint in an isolated reconcile worktree, the migration branch now points to 9883c548e19adb5d4915d17c33992e4bce98b4b9, and affected source scans were rerun.
    next_step: rebind stage review and verifier receipts to the exact candidate after the current bridge hardening changes.
  - id: P0-node-writer-fence
    owner: migration_implementation
    state: open
    detail: The current candidate fences organization update/archive/delete, Project CRUD/resources/workspaces, Issue counter creation, asset DB projection, Issue attachment DB projection, cost ledger, selected Chat projections, budget policy delete, and all 17 mutating methods in server/src/services/goals.ts. Those selected writers acquire the organization mutation row lock before their first business write and hold it through commit; the token is validated as the identity of the locked epoch, not embedded in every business-table predicate. Goal route/issue projection bypasses and the semantic inventory still has unfenced or row-only approval, comment, attachment storage, portability, onboarding, organization skills/plugins, budget/settings, automation, heartbeat, workspace/runtime, and background writers.
    next_step: finish the exact writer inventory, prove the serialized owner-lock contract for every selected writer, and make every competing writer acquire the same lock before its first business write, or drain and remove it from the default path.
  - id: P1-d1-secondary-writers
    owner: migration_implementation
    state: open
    detail: D1 still has direct or indirect legacy writers outside the currently fenced services, including Goal route and issue projection bypasses, approval state machines, issue comments, attachment and avatar storage, Chat operation approvals, Side Chat and inline visual persistence, portability import, onboarding, skills/plugins, budget/settings transitions, automation dispatch, heartbeat/workspace runtime, and activity/wakeup side effects.
    next_step: enumerate each writer and its external side effects, add storage/process orphan recovery where needed, then fence it before any Rust owner activation or explicitly remove it from the default path.
  - id: P1-project-goal-replacement-contract
    owner: migration_implementation
    state: private_slice_complete_default_entry_blocked
    detail: The complete Rust goal-set replacement command, SQLx transaction, and standalone Actix HTTP route now pass private black-box success/replay/conflict/target-isolation/audit-rollback/retry checks. The supported Node bridge, installed/default entry, and all competing writers are still absent.
    next_step: bind the route to a server-issued actor bridge, complete the writer fence/token inventory, then obtain exact-candidate verifier PASS before any owner handoff.
  - id: P1-signed-actor-envelope
    owner: migration_implementation
    state: open
    detail: Full auth migration is later than D1, so a signed request-bound actor bridge must be proven before any public Rust write.
    next_step: add server-issued envelope, revocation/expiry/replay checks, and fail-closed bridge tests.
  - id: P1-single-public-listener
    owner: migration_implementation
    state: open
    detail: Node owns the current listener while Actix is private; the supported startup has not yet selected a sole public socket.
    next_step: record one listener topology and prove no duplicate public listener.
  - id: P1-audit-atomicity
    owner: migration_implementation
    state: open
    detail: Existing Node activity logging is outside some business transactions; D1 requires business state, receipt, projection, and audit rollback together.
    next_step: define effect boundary and add audit-failure/process-recovery evidence.
  - id: P1-node-fallback
    owner: migration_implementation
    state: open
    detail: First-party MCP/native process paths still select bundled Node implementations in fallback modes.
    next_step: add explicit missing-Rust failure and static/runtime negative checks.
