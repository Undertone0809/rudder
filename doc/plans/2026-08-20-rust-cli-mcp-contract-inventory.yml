    - 'pnpm --filter @rudderhq/cli typecheck'
    - 'pnpm product-logic:check'
  focused_tests:
    - 'cli/src/__tests__/agent-v1-mcp-server.test.ts'
    - 'cli/src/__tests__/agent-v1-registry.test.ts'
    - 'packages/agent-runtime-utils/src/rudder-mcp.test.ts'
    - 'packages/agent-runtime-utils/src/rudder-mcp-preflight.test.ts'
    - 'packages/shared/src/computer-use.test.ts'
  handoff_to:
    - 'G0 baseline freeze'
