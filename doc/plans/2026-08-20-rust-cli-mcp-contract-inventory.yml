computer_use:
  server: 'rudder-computer'
  instruction_version: 'rudder.computer-use-instruction/v1'
  enabled_by_default: false
  enable_env: 'RUDDER_COMPUTER_ENABLED=true'
  tool_count: 13
  actions:
    - 'list_apps'
    - 'launch_app'
    - 'list_windows'
    - 'get_app_state'
    - 'click'
    - 'drag'
    - 'type_text'
    - 'press_key'
    - 'scroll'
    - 'set_value'
    - 'select_text'
    - 'perform_secondary_action'
    - 'stop'
  tools:
    - stable_name: 'rudder_computer_list_apps'
      action: 'list_apps'
      description: 'List running macOS applications. Use this to identify the exact target before observing it.'
      input_schema:
        type: 'object'
        properties: {}
        additionalProperties: false
      source_ref: 'source_catalog.computer_use'
      dispatch_source_ref: 'source_catalog.mcp_dispatch'
      identity_contract_ref: 'identity_contract'
      identity_requirements: 'RUDDER_ORG_ID, RUDDER_AGENT_ID, and RUDDER_RUN_ID are injected by the managed runtime; reserved identity arguments are rejected'
      authorization_path: 'RUDDER_COMPUTER_ENABLED=true, active Run context, and Desktop Computer Use broker/API authorization'
      output_contract_ref: 'mcp_output_contract'
      error_contract:
        - 'computer_disabled'
        - 'computer_invalid_argument'
        - 'rudder_mcp_tool_not_available'
        - 'rudder_mcp_response_too_large'
      cancellation_contract_ref: 'cancellation_contract.mcp.direct_api'
      authority_state: 'experimental first-party Computer Use surface; action schemas are canonical in shared source and every mutating action requires a fresh observation'
    - stable_name: 'rudder_computer_launch_app'
      action: 'launch_app'
      description: 'Launch an installed application without taking focus. Use the returned pid and window ID to observe it directly.'
      input_schema:
        type: 'object'
        properties: {'name': {'type': 'string', 'description': 'Exact installed application name.'}, 'bundleId': {'type': 'string', 'description': 'Exact application bundle identifier.'}, 'newInstance': {'type': 'boolean', 'description': 'Request a separate application instance when the platform supports it.'}}
