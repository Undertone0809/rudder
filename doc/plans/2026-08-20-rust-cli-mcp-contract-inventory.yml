    - 'git rev-parse HEAD'
    - 'rg -n "agent-v1|mcp-server|register.*Commands|new Command|tools/list|tools/call|RUDDER_(API|ORG|AGENT|RUN)" cli/src packages/agent-runtime-utils/src packages/shared/src scripts'
