      identity_requirements: 'RUDDER_ORG_ID, RUDDER_AGENT_ID, and RUDDER_RUN_ID are injected by the managed runtime; reserved identity arguments are rejected'
      authorization_path: 'RUDDER_COMPUTER_ENABLED=true, active Run context, and Desktop Computer Use broker/API authorization'
