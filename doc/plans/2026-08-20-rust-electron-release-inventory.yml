bounded_entrypoints:
  runtime_shell_javascript:
    - path: 'desktop/src/main.ts'
      permitted_role: 'Electron window, preload, IPC, profile, managed-runtime attachment, startup recovery, update admission, and native helper handoff.'
      state_proof: 'May invoke the existing Server supervisor and credential vault, but does not replace the Server listener/database authority or carry provider web-session material.'
    - path: 'desktop/src/preload.ts and desktop/src/boot-preload.ts'
      permitted_role: 'Narrow typed renderer bridges under contextIsolation with nodeIntegration disabled.'
      state_proof: 'No direct filesystem, database, queue, MCP, or credential-store authority is exposed to the renderer.'
  build_and_packaging_javascript:
    - path: 'desktop/scripts/stage-native.mjs'
      permitted_role: 'Compile and stage the three native binaries for the current target.'
      state_proof: 'Build output only; no server listener, database, credentials, queues, or product state.'
    - path: 'desktop/scripts/build.mjs, stage-server.mjs, stage-cli.mjs, stage-app.mjs, after-pack.mjs'
      permitted_role: 'Build Server/CLI bundles, copy packaged resources, normalize manifests, and prepare PostgreSQL/native resources.'
      state_proof: 'These operate on packaging directories and source manifests; they do not start the persistent runtime or migrate user data.'
    - path: 'desktop/scripts/dist.mjs and scripts/prod-desktop.mjs'
      permitted_role: 'Build portable/shell artifacts, run the packaged smoke command where requested, and open a verified local artifact.'
      state_proof: 'No long-lived listener or product-state authority; prod-desktop refuses to open when packaging smoke fails.'
  release_javascript_and_shell:
    - path: 'scripts/release-package-map.mjs and scripts/native-release-version.mjs'
      permitted_role: 'Discover, align, and validate release versions across npm/Desktop/native/CLI metadata.'
      state_proof: 'Manifest and lockfile staging only; no runtime database or credential authority.'
    - path: 'scripts/collect-desktop-release-assets.mjs, scripts/publish-github-release-assets-immutable.mjs, scripts/mirror-desktop-release-to-cos.mjs'
      permitted_role: 'Normalize, hash, compare, upload, and mirror frozen release bytes.'
      state_proof: 'Artifact transport and verification only; OIDC/npm/GitHub credentials are CI inputs and are not persisted as Rudder product state.'
    - path: 'scripts/release-compatibility-matrix.mjs and scripts/release-compatibility-runtime.ts'
      permitted_role: 'Read migration manifests and historical fixtures, then fail or pass the compatibility gate.'
      state_proof: 'Read-only validation/rehearsal; no release migration is applied to an end-user instance.'
    - path: 'scripts/release.sh and scripts/release-lib.sh'
      permitted_role: 'Clean-checkout release preflight, npm payload publication, tag creation, and temporary publish-shape cleanup.'
      state_proof: 'No persistent Server/CLI/MCP/database/queue authority. The script requires a clean tree for release execution; its cleanup trap is unsafe for unrelated dirty work and must remain confined to CI or an explicitly disposable release checkout.'
    - path: 'scripts/rollback-latest.sh'
      permitted_role: 'Repoint npm latest only.'
      state_proof: 'No Desktop filesystem, database, queue, credential, or product-state authority.'
  bounded_shell_commands:
    - command: 'npx @rudderhq/cli@latest start'
      role: 'Public first-run path; persistent CLI plus matching runtime cache and checksum-verified portable Desktop when enabled.'
    - command: 'npx @rudderhq/cli@latest start --server-only'
      role: 'Public server-only path; never resolves, downloads, installs, or launches Desktop assets.'
    - command: 'rudder start'
      role: 'Equivalent persistent CLI path after the CLI is installed.'
    - command: 'pnpm desktop:verify'
      role: 'Contributor gate for Desktop dev-shell smoke, packaging, and packaged smoke.'
    - command: 'pnpm --filter @rudderhq/desktop smoke'
      role: 'Development Desktop, authenticated update-session, and App Builder smoke.'
    - command: 'node desktop/scripts/smoke.mjs --mode=packaged'
      role: 'Packaged default smoke; the current resolver runs account-gate only. Explicit startup-recovery, clean, upgrade, auto-update, and auto-update-public scenarios are separate commands below; renderer reload recovery is exercised inside clean.'
    - command: 'pnpm desktop:dist'
      role: 'Portable/shell artifact production without opening the app.'
    - command: 'pnpm native:build'
      role: 'Build/stage the current platform native binaries; not an installed end-user runtime entrypoint.'

proof_of_non_ownership:
  persistent_server: 'Only the managed Server module creates the HTTP listener and owns runtime shutdown; Electron calls startManagedLocalServer and reports its handle. Packaging/release scripts never serve product traffic.'
  cli_and_mcp: 'The packaged CLI is bundled or invoked as an adapter and routes through the shared local instance. Desktop shell, staging, release, and rollback scripts do not own the CLI command surface, MCP protocol, or persistent MCP connections.'
  database_and_migrations: 'The Server/database runtime owns PostgreSQL, Drizzle migrations, and product data. Release compatibility scripts read/rehearse manifests; the update helper only carries a database revision and migrationCompatible checkpoint and rejects false compatibility.'
  credentials: 'Native Desktop auth is limited to the documented Rudder device-credential vault and ephemeral authorization-code/PKCE boundary. Provider tokens and Supabase web-session material are excluded; build/release entrypoints use transient CI credentials only.'
  queues_and_agent_runs: 'Agent queues and run lifecycle remain Server authority. The update flow queries active runs and requires a closed admission with zero active runs before native exchange; it does not implement a second queue.'
  product_state: 'Organization, issue, chat, workspace, Browser, and database product state remain in the shared Server instance. Electron userData contains shell/update metadata only, and packaging/release directories are disposable build outputs.'

failure_closed_rules:
  - 'Account-required packaged startup must stop before starting the Local Workspace; failed provider capability refresh preserves the account gate.'
  - 'A packaged runtime cache is accepted only with exact package metadata/version identity; missing bundled fallback fails startup.'
  - 'Automatic update is disabled outside packaged macOS prod_local/default, with no attested helper, with no usable signed policy, or while attached to another runtime.'
  - 'A policy must be in-date, signature-valid, non-replayed, non-revoked, and bound to the exact version, asset name, asset SHA-256, and release digest.'
  - 'A staged candidate must have an exact artifact proof; a second different candidate, stale claim, request mismatch, or state parse failure blocks or requires recovery.'
  - 'Manual update waits for active runs or requires an explicit stop-runs decision; native apply rejects admission that is not closed with activeRuns=0.'
  - 'The native helper rejects path traversal, symlink chains, non-regular request/helper files, wrong helper owner/mode/digest, wrong transaction identity, and incompatible checkpoint identity.'
  - 'The helper writes the journal and checkpoint before destructive exchange, probes the replacement, restores LKG on target failure, and records dual_failure/recovery_required when neither generation is safe.'
  - 'On next launch, unreadable update state, mismatched journal, missing generation, or failed recovery leaves the boot window in an explicit recovery error.'
  - 'Release publication requires exact-source verification, migration compatibility, package/native version coupling, candidate artifact completeness, byte checks, and the final checksum marker; COS is transport, not trust root.'
  - 'The release rollback script only changes npm latest. Desktop rollback stays under the native helper journal and must not be represented as an npm rollback.'

b3_handoff:
  compatibility:
    current_observation: 'scripts/release-compatibility-matrix.mjs declares candidate matrices through 0.7.12; candidate 0.7.13 has no declaration and therefore fails closed with an explicit add-declaration error.'
    required_action: 'Before B3 promotion, add an explicit 0.7.13 matrix entry whose candidateFingerprint is the current migration manifest fingerprint and whose fixtures are immutable old-version refs/fingerprints; run both manifest preflight and historical runtime compatibility before the first publication mutation.'
    boundary: 'A4 does not edit the compatibility matrix or migrations.'
  rust_runtime_attachment:
    required: 'A Rust runtime candidate must be packageable behind the existing Desktop attachment contract: exact runtime/package version metadata, the selected shared profile, private loopback /api/health identity, readiness, drain, and graceful stop.'
    prohibited: 'Do not move Desktop window/IPC authority, signed update policy, update admission, native exchange, LKG journal, or npm/Desktop rollback authority into the Rust core as part of B3.'
  release_coupling:
    required: 'Keep public packages, Desktop manifest, CLI version, Rust workspace/Cargo.lock members, native helper protocol, artifact names, and checksums on one frozen source/version identity.'
    shell_vs_portable: 'Preserve portable full-runtime assets for end users and shell assets with the bounded server-package/CLI payload; test both paths before promotion.'
  rollback:
    npm: 'Use scripts/rollback-latest.sh only to repoint public package latest and then fix forward with a new stable semver.'
    desktop: 'Use the native helper journal/LKG recovery for an installed Desktop; require the exact candidate/helper/checkpoint identity and surface recovery_required or dual_failure rather than guessing.'
    partial_release: 'Recover a partial public release from the original immutable candidate artifacts; never republish an immutable npm version or overwrite a conflicting checksum object.'

electron_smoke_matrix:
  local_commands:
    - 'pnpm --filter @rudderhq/cli typecheck'
    - 'pnpm architecture:audit:test'
    - 'pnpm product-logic:check'
    - 'pnpm desktop:verify'
    - 'git diff --check'
  packaged_scenarios:
    - scenario: 'startup-recovery'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=startup-recovery'
      evidence: 'Boot failure diagnostics, retry coalescing, support context, and failure-closed startup.'
    - scenario: 'clean'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=clean'
      evidence: 'Fresh packaged profile, shared instance, Browser/CLI attachment, in-place renderer reload recovery, and product workflow.'
    - scenario: 'upgrade'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=upgrade'
      evidence: 'Historical schema downgrade, startup migration, stale PostgreSQL pid recovery, and board readiness.'
    - scenario: 'account-gate'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=account-gate'
      evidence: 'Packaged account gate and unavailable fixture/bypass behavior.'
    - scenario: 'auto-update'
      platform: 'macOS only'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=auto-update'
      evidence: 'Packaged helper version, commit, rollback, dual-failure, interruption recovery, tamper, active-run admission, and external-helper handoff fault matrix.'
    - scenario: 'auto-update-public'
      platform: 'macOS only'
      command: 'node desktop/scripts/smoke.mjs --mode=packaged --scenario=auto-update-public'
      evidence: 'Signed policy, exact artifact/release binding, runtime drain, helper attestation, journal/request commit, candidate installation, and release-note acknowledgement across the public update path.'
    - scenario: 'app-builder-packaged'
      command: 'node desktop/scripts/app-builder-smoke.mjs --packaged'
      evidence: 'Packaged App Builder workflow, exercised separately from desktop/scripts/smoke.mjs by pnpm desktop:verify and the release candidate job.'
  resolver_and_coverage_notes:
    packaged_default_and_all: 'desktop/scripts/smoke.mjs resolves both --mode=packaged and --mode=packaged --scenario=all to account-gate only; neither command covers startup-recovery, clean, upgrade, or update scenarios.'
    renderer_recovery: 'There is no standalone renderer-recovery scenario. The runnable clean scenario calls verifyReloadRecovery and is the current renderer reload/recovery coverage; do not publish a synthetic renderer-recovery command.'
    release_gate_gap: 'The current release workflow runs packaged App Builder smoke on non-Windows, staged PostgreSQL smoke on non-Windows, and packaged account-gate on macOS arm64. It does not run the explicit packaged startup-recovery, clean, upgrade, auto-update, or auto-update-public commands above.'
  release_matrix:
    candidates:
      - platform: 'linux'
        arch: 'x64'
        artifact: 'Rudder-<version>-linux-x64.AppImage'
        required: 'Build, staged PostgreSQL smoke, packaged runtime smoke, artifact collection, checksum verification.'
      - platform: 'macos'
        arch: 'x64'
        artifacts: 'portable ZIP and shell ZIP'
        required: 'Build, staged PostgreSQL smoke, packaged runtime smoke, artifact collection, checksum verification.'
      - platform: 'macos'
        arch: 'arm64'
        artifacts: 'portable ZIP and shell ZIP'
        required: 'Build, account gate, update/helper smoke, staged PostgreSQL smoke, packaged runtime smoke, artifact collection, checksum verification.'
      - platform: 'windows'
        arch: 'x64'
        artifacts: 'portable ZIP and shell ZIP'
        required: 'Build, shell CLI verification, packaged runtime smoke, artifact collection, checksum verification.'
    public_release: 'After candidate-complete, require seven Desktop binaries, SHASUMS256.txt, GitHub asset byte verification, COS byte verification, npm/tag/source identity, public install smoke, and stable-surface verification.'
    observed_workflow_note: 'The release Desktop candidate job directly runs packaged App Builder smoke on non-Windows, staged PostgreSQL smoke on non-Windows, and account-gate smoke on macOS arm64. It does not run the explicit packaged startup-recovery, clean, upgrade, or update commands above; --scenario=all is account-gate-only in packaged mode. B3 must add an explicit exact-source CI gate for the required runnable matrix before publication; do not infer it from artifact generation alone.'

acceptance:
  commands:
    - 'git rev-parse HEAD'
    - 'rg -n "stage-native|release-package-map|rollback|checksum|manifest|updater|RUDDER_DESKTOP|electron" desktop scripts .github doc/engineering/DESKTOP.md doc/engineering/RELEASING.md doc/engineering/PUBLISHING.md'
    - 'pnpm --filter @rudderhq/cli typecheck'
    - 'pnpm architecture:audit:test'
    - 'pnpm product-logic:check'
    - 'git diff --check'
  artifact_validation: 'Parse this file as YAML, verify the candidate SHA/fingerprint fields, and recompute the dirty-worktree fingerprint excluding this file.'
  preservation_requirement: 'Relative to the pre-write fingerprint, only this YAML may be added; all pre-existing modified and untracked paths must remain byte-for-byte and status-for-status unchanged.'

risks:
  - 'The 0.7.13 migration compatibility declaration is absent and blocks a release candidate until B3 or release ownership adds it.'
  - 'Npm latest rollback cannot restore a bad installed Desktop or database; operational runbooks must select the correct rollback authority.'
  - 'A release job that produces Desktop binaries without the exact packaged upgrade/recovery gate can make a correct Rust runtime unshippable; packaged smoke evidence must precede publication.'
