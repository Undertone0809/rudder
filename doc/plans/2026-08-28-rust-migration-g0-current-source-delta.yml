    current_node_authority: 'The existing plugin directory/detail routes now admit organization-scoped Agents as well as board actors; the plugin service remains authoritative for installed, local-app, discoverable, component, and setup-state projections.'
    writer_boundary: 'Read-only access expansion on two existing routes; plugin import, enablement, configuration, rollback, update, and uninstall mutations retain their existing stricter authorization.'
    failure_and_recovery: 'Cross-organization access fails closed, missing installed plugins return not found, and repeated reads have no side effect.'
