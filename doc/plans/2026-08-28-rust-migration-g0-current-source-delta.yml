    writer_boundary: 'Read-only projection; no Goal, Run, activity, or wake state mutation.'
    failure_and_recovery: 'Unknown or unauthorized Goals return not found, invalid limits fail validation, and read retries have no side effect.'
    evidence_status: 'Current public route identity and service source classified against the accepted A1 route inventory.'
    candidate_rust_authority: 'none at G0'
    retirement_gate: 'B1 must freeze the route/schema identity; any later Rust read slice must prove authorization, cursor ordering, mixed history/Run projection, live-state projection, and error parity.'
