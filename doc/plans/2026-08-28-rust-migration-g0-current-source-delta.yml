      - 'server/src/services/organization-members.ts'
    route: 'GET /api/orgs/:orgId/members/directory'
    current_node_authority: 'The organization route and member service own organization authorization, type/query filtering, bounded pagination, identifier projection, and cursor semantics.'
    writer_boundary: 'Read-only organization member projection; no human, Agent, organization, or membership mutation.'
    failure_and_recovery: 'Cross-organization access fails closed, invalid type/limit/cursor input is rejected, and read retries have no side effect.'
    evidence_status: 'Current public route identity and service source classified with the CLI/MCP organization-members delta.'
    candidate_rust_authority: 'none at G0'
    retirement_gate: 'B1 must freeze the route/schema identity and differential fixtures before any Rust read dispatch; preserve authorization, filtering, pagination, full-id, and error parity.'
  - id: 'delta.route.plugin_agent_reads'
    sources:
